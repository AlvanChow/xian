ayed bolted to the antibody in blood and released only inside the tumour. That vc-MMAE linker became the industry standard and was licensed to Roche, Astellas and Genmab, funding 14 product-less years.","comp":["ImmunoGen","Roche/Genentech","Daiichi Sankyo","AbbVie"],"obst":"Fourteen years from founding to first approval, through the 2001 biotech funding winter, financed on partner royalties rather than product revenue. Siegall was then forced out of the company he built in May 2022 after a domestic-violence arrest.","turn":"August 2011, when the FDA approved Adcetris for Hodgkin lymphoma, validating the linker platform and repricing every licensing deal Seagen had signed.","band":"b1","ageb":"a7","y100":2012,"u45":false,"years":29,"vel":7.6,"ageAt100":51,"since100":14},{"id":"PRABIR_ADARKAR","n":"Prabir Adarkar","age":49,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.22,"p":"E","c":0.8,"s":"DoorDash Form 4 filed 22 Apr 2026 reporting 987,941 shares; DASH close 222.36 on 21 Aug 2026; age 43 in DoorDash S-1/A of 30 Nov 2020","m":"987,941 shares held per the 22 Apr 2026 Form 4 times the DASH close of 222.36 on 21 Aug 2026","sect":"tech","origin":"self","co":"DoorDash","did":"Left Uber's strategic finance group in August 2018 to become DoorDash's first public-company-grade CFO, priced its December 2020 IPO at 102 dollars for a 39B dollar valuation, and became president and chief operating officer in March 2023 running marketplace, logistics and international.","started":2018,"startAge":41,"toFirst100":3,"why":"Delivery is won on batching and drive-time density, not brand. Adarkar supplied the unit-economics discipline and the balance sheet - a 3.4B dollar IPO plus convertible notes - that let DoorDash buy suburban market density while Uber Eats and Grubhub fought over dense urban cores.","comp":["Uber Eats","Grubhub","Instacart","Postmates"],"obst":"He raised at a 16B dollar valuation in June 2020 while California's Proposition 22 fight threatened to reclassify every Dasher as an employee, then had to price an IPO into a market convinced that pandemic delivery demand would evaporate within a year.","turn":"The December 2020 IPO, which priced above range and converted a stake he had taken as a private-company finance hire two years earlier into public equity.","band":"b1","ageb":"a5","y100":2021,"u45":false,"years":8,"vel":27.5,"ageAt100":44,"since100":5},{"id":"LIBOR_MICHALEK","n":"Libor Michalek","age":53,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.22,"p":"E","c":0.7,"s":"Affirm DEF 14A filed 24 Oct 2025 (ownership as of 30 Sep 2025); AFRM close 75.05 on 21 Aug 2026; age 47 in Affirm S-1/A of 11 Jan 2021","m":"1,939,614 shares held (1,064,349 Class A including 868,114 in the Michalek 2007 Trust, plus 875,265 Class B) times the AFRM close of 75.05 on 21 Aug 2026, before 1,626,336 exercisable options","sect":"finance","origin":"self","co":"Affirm","did":"Joined Affirm in 2014 as an early engineering leader and is now president of technology, owning the underwriting, servicing and merchant-integration stack behind its point-of-sale instalment loans; he had previously led engineering at Google and at Max Levchin's Slide.","started":2014,"startAge":41,"toFirst100":7,"why":"Buy-now-pay-later is a credit-underwriting business wearing a checkout button. Affirm scores each individual transaction inside the merchant's checkout in under a second on its own risk models rather than a FICO cutoff, which is why it can price 0 percent APR offers card issuers cannot.","comp":["Klarna","Afterpay","PayPal","Synchrony Financial"],"obst":"Affirm fell from 168 dollars in November 2021 to under 10 dollars in December 2022 as rates and its own funding costs rose, and the collapse of Peloton - once roughly 30 percent of revenue - forced the platform to be rebuilt around Amazon and Shopify instead.","turn":"The 2020 Shopify partnership that made Affirm the default instalment option for Shopify merchants, replacing a single-customer concentration risk with distribution across hundreds of thousands of stores.","band":"b1","ageb":"a5","y100":2021,"u45":false,"years":12,"vel":18.3,"ageAt100":48,"since100":5},{"id":"JOHN_ALLISON","n":"John W. Allison","age":80,"city":"Conway","country":"US","state":"AR","region":"se","nw":0.22,"p":"E","c":0.7,"s":"Home BancShares Form 4 filed 4 Jun 2026: 5,768,826 direct plus restricted and performance shares, 865,360 held by his wife and holdings in an IRA, a 401(k) and Capital Buyers; HOMB closed 30.27 on 21 Aug 2026","m":"7,166,908 beneficially owned shares x 30.27 = 217M","sect":"finance","origin":"self","co":"Home BancShares / Centennial Bank","did":"Co-founded Home BancShares in Conway Arkansas in 1998 with a group of local investors, took it public in 2006 and rolled up more than 20 failed and struggling banks across Arkansas, Florida, Alabama and Texas to build a roughly 23B-asset lender.","started":1998,"startAge":52,"toFirst100":12,"why":"Home BancShares bought Florida banks from the FDIC after 2008 with loss-sharing agreements, so the government absorbed the bad loans and it kept the deposits and branches at a discount. Buying franchise value while carrying almost none of the credit risk is the cheapest growth in banking.","comp":["Simmons First National","Bank OZK","Cadence Bank","Ameris Bancorp"],"obst":"He started a bank at 52 after selling an earlier one, then bet the company on distressed Florida acquisitions in 2010 when Florida real estate was still falling; the 2022 Happy Bancshares merger in Texas came just before deposit costs spiked across the sector.","turn":"2010, when the FDIC-assisted purchases of failed Florida banks gave Home BancShares a coastal franchise it could never have built branch by branch.","band":"b1","ageb":"a7","y100":2010,"u45":false,"years":28,"vel":7.9,"ageAt100":64,"since100":16},{"id":"SCOTT_STRUTHERS","n":"Scott Struthers","age":64,"city":"San Diego","country":"US","state":"CA","region" at on its board from 2008, and held roughly 7 percent of the property-management software company through its 2015 IPO and its run to an 8 billion dollar market value.","started":2006,"startAge":52,"toFirst100":12,"why":"IGSB's model was to fund a small number of Santa Barbara software companies at inception and never sell, so the compounding stayed with the founders rather than the funds. Holding dual-class B stock through two decades of AppFolio's growth is why one seed position is now worth more than 200 million.","comp":["Yardi Systems","RealPage","Entrata","Buildium"],"obst":"AppFolio sold into small property managers who had never bought software, a segment RealPage and Yardi had written off as too fragmented to serve; it took nine years of subscale revenue before the 2015 IPO validated the market.","turn":"AppFolio's June 2015 Nasdaq listing, which converted a nine-year private position into public stock he did not sell.","band":"b1","ageb":"a7","y100":2018,"u45":false,"years":20,"vel":10.5,"ageAt100":64,"since100":8},{"id":"MARK_MCKENNA","n":"Mark McKenna","age":46,"city":"San Diego","country":"US","state":"CA","region":"socal","nw":0.21,"p":"E","c":0.7,"s":"Prometheus Biosciences DEFM14A filed 16 May 2023: at Merck's 200.00 dollar per share price McKenna's equity was 206,647,761 in vested option spread, 184,629,465 unvested and 7,422,600 in RSUs, total 398,699,826, plus 26,039,295 in tax reimbursement; age 42 in the DEF 14A of 28 Apr 2022","m":"398.7 million dollars of option and RSU value is ordinary income; net of combined California and federal rates of about 50 percent that is roughly 200 million, plus the disclosed 26 million tax gross-up and retained founder equity in Mirador Therapeutics.","sect":"health","origin":"self","co":"Prometheus Biosciences","did":"Took over Prometheus in 2019 when it was a Cedars-Sinai spinout sitting on an inflammatory bowel disease biobank, listed it at 19 dollars in March 2021, read out the anti-TL1A antibody PRA023 in December 2022 and sold the company to Merck for 10.8 billion dollars at 200 dollars a share in 2023.","started":2019,"startAge":39,"toFirst100":4,"why":"The Cedars-Sinai patient database let Prometheus pick TL1A and pre-select genetic responders with a companion diagnostic before dosing anyone, so a Phase 2 in ulcerative colitis produced an effect size nobody else in inflammatory bowel disease could show and forced an auction.","comp":["Roivant Sciences","Pfizer","AbbVie","Takeda"],"obst":"TL1A had been passed over by every large pharma as an unproven target; Prometheus priced its IPO at 19 dollars and traded near 12 through mid-2022 with a single Phase 2 asset and no partner.","turn":"7 December 2022, the ARTEMIS-UC Phase 2 result, which tripled the stock overnight and started the process that ended with Merck.","band":"b1","ageb":"a5","y100":2023,"u45":false,"years":7,"vel":30,"ageAt100":43,"since100":3},{"id":"BRADFORD_SMITH","n":"Bradford L. Smith","age":67,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.21,"p":"E","c":0.7,"s":"Microsoft DEF 14A filed 2025-10-21, holdings as of 2025-09-30; MSFT close 483.24 on 2026-08-21 (stockanalysis.com)","m":"402,131 shares plus 26,151 unvested stock units = 428,282 x $483.24 = $207M. A floor: it excludes more than two decades of prior share sales, which are not netted out here.","sect":"tech","origin":"self","co":"Microsoft","did":"Joined Microsoft in 1993 from Covington and Burling, became general counsel in 2002, president in 2015 and vice chair in 2021. Negotiated the settlements that ended the US state antitrust cases and the EU proceedings, and built the government-affairs and AI-policy machine Microsoft now runs.","started":1993,"startAge":34,"toFirst100":22,"why":"Smith turned the legal department from a defence cost into a market-access function. Settling with Sun, Novell, RealNetworks, IBM, the US states and Brussels between 2002 and 2009 cleared the regulatory overhang on bundling, which is exactly the freedom Azure, Office 365 and Teams were later sold on.","comp":["Kent Walker (Google)","David Zapolsky (Amazon)","EU DG COMP","US DOJ Antitrust"],"obst":"He inherited a company that had already lost. A federal court had ordered a breakup, the EU issued a $1.35B fine in 2008, and every rival was suing. Paying out and conceding rather than appealing was unpopular internally and cost Microsoft billions in cash settlements.","turn":"2002, when he took over as general counsel and reversed a decade of litigate-everything strategy, telling the board it was time to make peace.","band":"b1","ageb":"a7","y100":2015,"u45":false,"years":33,"vel":6.4,"ageAt100":56,"since100":11},{"id":"YULING_LUO","n":"Yuling Luo","age":62,"city":"Fremont","country":"US","state":"CA","region":"bay","nw":0.21,"p":"E","c":0.9,"s":"Alamar Biosciences 424B4 IPO prospectus filed 17 Apr 2026, ownership as of 1 Mar 2026; ALMR close $34.24, 21 Aug 2026","m":"6,207,834 shares beneficially owned, 9.0% after the offering, x $34.24 = $213M; the IPO priced at $17.00 so the stake has roughly doubled since listing","sect":"health","origin":"self","co":"Alamar Biosciences","did":"Co-founded Alamar in Fremont in May 2018 to commercialise NULISA, an immunoassay that pushes protein detection into the femtogram range so blood tests can read brain proteins; earlier he founded Advanced Cell Diagnostics, sold to Bio-Techne in 2016.","started":2018,"startAge":54,"toFirst100":8,"why":"Proteomics rivals sold breadth - thousands of proteins at mediocre sensitivity. Alamar sold depth on the proteins that matter in plasma, particularly neurology markers present at a thousandth the concentration mass spectrometry can see, which is exactly what Alzheimer's blood tests need.","comp":["Olink","SomaLogic","Quanterix","Nautilus Biotechnology"],"obst":"He was launching a research-tools company into the 2022-2024 life-science instrument recession that halved Quanterix and forced Olink and SomaLogic into sales; academic and ent combined federal and Mississippi capital-gains tax, plus four decades of disclosed compensation and prior share sales","sect":"agri","origin":"mixed","co":"Sanderson Farms","did":"Ran the family poultry company from 1989, grew it from a regional Mississippi processor to the third-largest US chicken producer with about 4.8 billion dollars of revenue, and sold it in 2021 to a Cargill and Continental Grain joint venture for 4.53 billion dollars in cash.","started":1989,"startAge":41,"toFirst100":17,"why":"He refused to follow the industry into branded and antibiotic-free chicken, staying in big-bird deboning for food service with the lowest cost per pound in America. Building plants only where a hundred contract growers sat within fifty miles kept live-haul costs down and margins above larger rivals.","comp":["Tyson Foods","Pilgrims Pride","Perdue Farms","Koch Foods"],"obst":"A 2016 antitrust class action accused Sanderson and its peers of using Agri Stats to coordinate broiler supply and prices, an overhang that ran through the sale; he also carried the company through the 2008 corn spike and Hurricane Katrina, which took out his Hazlehurst and McComb operations.","turn":"The August 2021 agreement to sell at 203 dollars a share, the top of the poultry cycle, after two decades of refusing offers.","band":"b1","ageb":"a7","y100":2006,"u45":false,"years":37,"vel":5.4,"ageAt100":58,"since100":20},{"id":"FRANK_ISLAM","n":"Frank Islam","age":73,"city":"Potomac","country":"US","state":"MD","region":"dc","nw":0.2,"p":"E","c":0.5,"s":"Perot Systems acquired QSS Group for about 250 million dollars in 2007; Islam was founder and sole owner of the company","m":"Disclosed acquisition price less estimated capital-gains tax, plus nineteen years of investment returns and less large disclosed philanthropic gifts","sect":"tech","origin":"self","co":"QSS Group","did":"An Indian immigrant with a Colorado computer-science degree who bought a one-person Maryland IT firm in 1994, built QSS Group into a 300 million dollar federal systems integrator serving NASA, the FAA and Homeland Security, and sold it to Perot Systems in 2007 for about 250 million dollars.","started":1994,"startAge":41,"toFirst100":13,"why":"He built the company on the 8(a) small-disadvantaged-business set-aside programme, which gave a firm with no past performance record sole-source access to federal contracts, then graduated out of 8(a) with incumbent positions on multi-year vehicles that competitors could not dislodge at recompete.","comp":["SAIC","CACI International","ManTech","NCI Information Systems"],"obst":"Graduating from the 8(a) programme removes the set-aside protection that most such firms depend on, and the majority collapse or sell at that point; he had to win full and open competitions against companies twenty times his size to keep the NASA and FAA work that carried the business.","turn":"Winning the NASA Goddard information-technology support contract in the late 1990s, which gave QSS the past-performance record to bid outside the set-aside.","band":"b1","ageb":"a7","y100":2007,"u45":false,"years":32,"vel":6.3,"ageAt100":54,"since100":19},{"id":"JEREMY_STOPPELMAN","n":"Jeremy Stoppelman","age":48,"city":"San Francisco","country":"US","region":"bay","nw":0.2,"p":"E","c":0.45,"s":"Yelp market cap 1.27B USD on 21 Aug 2026; Stoppelman is the largest individual holder at roughly 5 percent","m":"Residual stake at current market cap plus fourteen years of disclosed 10b5-1 sales since the 2012 IPO","sect":"tech","origin":"self","co":"Yelp","did":"Left PayPal after the eBay sale and founded Yelp in 2004 with Russel Simmons, turning an email-your-friends-for-a-recommendation idea into a crowdsourced local review site; took it public on the NYSE in March 2012 and still runs it.","started":2004,"startAge":26,"toFirst100":8,"why":"Local businesses were invisible online and had no budget for search advertising. Yelp got the review corpus free from users, then sold those same ller reports questioning its capitalisation of maintenance spend, and the stock halved in 2017 and 2018 before the buyout.","turn":"The 2012 acquisition of AboveNet for 2.2 billion dollars, which gave Zayo metro fibre in the cities that actually mattered.","band":"b1","ageb":"a6","y100":2014,"u45":false,"years":19,"vel":10.5,"ageAt100":50,"since100":12},{"id":"GREGORY_Q_BROWN","n":"Gregory Q. Brown","age":66,"city":"Chicago","country":"US","state":"IL","region":"mw","nw":0.2,"p":"E","c":0.8,"s":"SEC Form 4 filed 16 Mar 2026: about 406,444 Motorola Solutions shares and units held directly, in trusts, GRATs and 401(k); MSI closed $480.47 on 21 Aug 2026","m":"Disclosed beneficial share and unit count x closing price; excludes unexercised options","sect":"tech","origin":"self","co":"Motorola Solutions","did":"Joined Motorola in 2003, became co-chief executive in 2008 and led the January 2011 split that separated the collapsing handset business from the public-safety radio business. He has run Motorola Solutions since, and it has multiplied in value roughly twentyfold.","started":2003,"startAge":43,"toFirst100":18,"why":"Police, fire and utility radio networks are bought on decade-long contracts, certified to standards that take years to meet, and used by dispatchers trained on one interface. The moat is switching cost, not technology, and he widened it by buying video and command-centre software.","comp":["L3Harris Technologies","Axon Enterprise","Hytera Communications","JVCKenwood"],"obst":"He inherited Motorola while Apple and Samsung were destroying its handset franchise, faced Carl Icahn's campaign to break the company up, and after the split had to fight Chinese rival Hytera, suing it for trade secret theft and winning a large verdict in 2020.","turn":"The January 2011 separation of Motorola Mobility from Motorola Solutions, which left him running the profitable half without the phone losses.","band":"b1","ageb":"a7","y100":2021,"u45":false,"years":23,"vel":8.7,"ageAt100":61,"since100":5},{"id":"JOHN_MARAGANORE","n":"John Maraganore","age":64,"city":"Boston","country":"US","state":"MA","region":"ne","nw":0.2,"p":"E","c":0.5,"s":"SEC insider holdings across Alnylam and other biotech boards, roughly 195 million dollars","m":"Disclosed Alnylam and board-seat holdings plus twenty years of Form 4 exercises as founding CEO, aggregated from SEC filings","sect":"health","origin":"self","co":"Alnylam Pharmaceuticals","did":"Was Alnylam's founding chief executive from 2002 to 2021, taking RNA interference from a Nobel-winning laboratory observation to four approved drugs including Onpattro, the first ever RNAi therapeutic, approved in 2018; now sits on numerous biotech boards and invests through Kilimanjaro Capital.","started":2002,"startAge":40,"toFirst100":16,"why":"RNAi silences a gene before a protein is ever made, so it can hit targets antibodies and small molecules cannot reach. Alnylam bet everything on solving delivery to the liver, and once the GalNAc conjugate worked, every liver-expressed disease became a pipeline instead of a research project.","comp":["Ionis Pharmaceuticals","Arrowhead","Dicerna","Pfizer","Novartis"],"obst":"Alnylam went nineteen years without profit; Novartis and Roche both walked away from RNAi partnerships around 2010-2011, the field was widely declared dead, and Alnylam had to cut staff and rebuild on its own balance sheet.","turn":"The 2018 FDA approval of Onpattro for hereditary transthyretin amyloidosis, the first approved RNAi drug, sixteen years after founding and after the entire sector had been written off.","band":"b1","ageb":"a6","y100":2018,"u45":false,"years":24,"vel":8.3,"ageAt100":56,"since100":8},{"id":"DAVID_KARP","n":"David Karp","age":40,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.2,"p":"E","c":0.45,"s":"Yahoo acquired Tumblr for $1.1B in cash, May 2013; Karp's stake was widely reported at about 25%","m":"25% x $1.1B = roughly $275M pre-tax, plus a reported $110M retention package vesting through 2017, net of tax","sect":"media","origin":"self","co":"Tumblr","did":"Left high school at 15, worked at Frederator Studios, and launched Tumblr in February 2007 at 20 as a short-form blogging platform; sold it to Yahoo for $1.1B in cash in May 2013 holding roughly a quarter of the company.","started":2007,"startAge":21,"toFirst100":6,"why":"Reblogging collapsed the distinction between publishing and sharing - every post was simultaneously content and a distribution event - so a team of twenty carried a hundred million blogs with almost no marketing spend, and the fandom communities that formed there existed nowhere else.","comp":["WordPress","Blogger","LiveJournal","Posterous","Twitter"],"obst":"He had resisted advertising for years and sold a platform with almost no revenue; Yahoo wrote off $712M of the purchase price by 2016, the 2018 adult-content ban destroyed much of the community, and Verizon sold Tumblr to Automattic in 2019 for a reported $3M.","turn":"The May 2013 Yahoo acquisition, agreed in cash before the advertising model was ever proven.","band":"b1","ageb":"a4","y100":2013,"u45":true,"years":19,"vel":10.5,"ageAt100":27,"since100":13},{"id":"DAMIAN_LILLARD","n":"Damian Lillard","age":36,"city":"Portland","country":"US","state":"OR","region":"pnw","nw":0.2,"p":"E","c":0.45,"s":"Disclosed NBA contracts: rookie scale from 2012, a 5-year 120M dollar extension in 2015, a 4-year 196M dollar supermax in 2019, and a 3-year 42M dollar deal on his 2025 return to Portland","m":"Roughly 350M dollars of gross contract earnings through the 2025-26 season, net of tax and agent fees, plus his long-running Adidas signature shoe line","sect":"media","origin":"self","co":"Portland Trail Blazers / Adidas Dame line","did":"Drafted sixth by the Portland Trail Blazers out of Weber State in 2012, became a nine-time All-Star, signed one of the first supermax extensions in 2019, and built the Adidas Dame signature shoe franchise; left Portland in 2023 and returned on a three-year deal in 2025.","started":2012,"startAge":22,"toFirst100":9,"why":"NBA maximum salaries are set by collective bargaining as a share of the cap, so a player who stays healthy and qualifies for the supermax tier captures an escalating slice of a media-rights pool that has roughly tripled since 2012. The Adidas signature line adds royalty income the cap does not touch.","comp":["Stephen Curry","Kyrie Irving","Russell Westbrook","Nike Kyrie line","Under Armour Curry Brand"],"obst":"He played for a small-market franchise that never reached a Finals, tore his Achilles tendon in the 2025 playoffs at 34, and was traded away from the city he had spent eleven years in before Portland signed him back while he rehabilitated.","turn":"The 2019 supermax extension, the first four-year 196 million dollar deal in Trail Blazers history, which converted local loyalty into the top salary tier.","band":"b1","ageb":"a3","y100":2021,"u45":true,"years":14,"vel":14.3,"ageAt100":31,"since100":5},{"id":"ANTHONY_J_GUZZI","n":"Anthony J. Guzzi","age":61,"city":"Norwalk","country":"US","state":"CT","region":"ne","nw":0.2,"p":"E","c":0.5,"s":"EMCOR Group DEF 14A filed 21 April 2026 (age 61, ownership table); EME close 776.62 dollars, 21 August 2026","m":"Proxy beneficial ownership: 170,299 shares x 776.62 = 132.3 million dollars. Proxy also shows 20,995 shares vesting in 2025 alone worth 9.9 million, and comparable vesting each year since 2011, so accumulated after tax proceeds are added to reach 0.2.","sect":"industry","origin":"self","co":"EMCOR Group","did":"Left Carrier to join EMCOR as president in 2004 and became chief executive in 2011; grew the mechanical and electrical contractor from about 5 billion to more than 16 billion dollars of revenue, shifted the mix toward recurring building services, and retired roughly a third of the shares.","started":2004,"startAge":39,"toFirst100":17,"why":"EMCOR sells scarce skilled labour, not equipment: when hyperscalers need gigawatts of datacenter capacity the constraint is having thousands of electricians and pipefitters already trained and on payroll. That workforce cannot be conjured, so EMCOR picks jobs on margin instead of bidding for volume.","comp":["Comfort Systems USA","Quanta Services","APi Group","MasTec"],"obst":"US non residential construction collapsed from 2009 to 2012 just as he was taking over; he consolidated and closed subsidiaries and pushed into maintenance and service contracts rather than bid work at negative margins to keep crews busy.","turn":"The 2021 to 2025 datacenter and semiconductor fabrication wave, when EMCOR remaining backlog capacity became the binding constraint and margins roughly doubled.","band":"b1","ageb":"a6","y100":2021,"u45":false,"years":22,"vel":9.1,"ageAt100":56,"since100":5},{"id":"DANIEL_L_JONES","n":"Daniel L. Jones","age":62,"city":"McKinney","country":"US","state":"TX","region":"tx","nw":0.2,"p":"E","c":0.75,"s":"Encore Wire DEFM14A filed 22 May 2024 for the Prysmian merger: 863,511 shares, 5.36 percent, cashed out at 290.00 dollars per share; age 60 printed in the March 2024 DEF 14A","m":"863,511 shares times 290.00 dollars cash = 250 million dollars gross in the 2024 close, roughly 190 million after federal capital gains and NIIT with no Texas income tax","sect":"industry","origin":"self","co":"Encore Wire","did":"Joined Encore Wire in November 1989, the year it was founded in McKinney, as director of sales; became president in 1998, CEO in 2006 and chairman in 2014, and sold the company to Prysmian in 2024 for 4.2 billion dollars, 290 dollars a share in cash.","started":1989,"startAge":25,"toFirst100":32,"why":"One campus. Copper rod, extrusion, warehouse and truck docks all sat on a single McKinney site, so Encore could quote and ship a complete building-wire order in days where rivals needed weeks from several plants. Distributors paid for that fill rate and the single site kept cost per pound lowest in the industry.","comp":["Southwire","Cerro Wire","General Cable","Republic Wire"],"obst":"Copper is the input and Encore refused to hedge it, so the 2008 and 2015 price collapses wrote down inventory and earnings while hedged rivals looked steadier; Jones held the no-hedging policy through shareholder pressure because it let Encore undercut those same rivals on the way down.","turn":"The 2019-2023 expansion of the McKinney campus, roughly 300 million dollars of new plant finished just as data-centre and reshoring construction sent building-wire spreads to records and drew Prysmian's bid.","band":"b1","ageb":"a6","y100":2021,"u45":false,"years":37,"vel":5.4,"ageAt100":57,"since100":5},{"id":"JACK_FUSCO","n":"Jack Fusco","age":63,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.2,"p":"E","c":0.5,"s":"Cheniere Energy DEF 14A filed 7 Apr 2026; NYSE American close 21 Aug 2026","m":"724,062 shares held through grantor retained annuity trusts x $277.51 close = $201M; excludes 88,162 unvested RSUs and any prior realized proceeds","sect":"energy","origin":"self","co":"Cheniere Energy","did":"Took over Cheniere Energy in May 2016, months after the board removed founder Charif Souki, and ran the Sabine Pass and Corpus Christi terminals to become the largest LNG exporter in the world, lifting output past 45 million tonnes a year and paying down roughly $10B of debt.","started":2016,"startAge":53,"toFirst100":6,"why":"Cheniere sells liquefaction capacity on twenty-year take-or-pay contracts with a fixed fee plus 115 percent of the gas cost, so the margin does not move with commodity prices. Fusco stopped building on spec, contracted trains before sanctioning them and turned the fee stream into a debt-paydown machine.","comp":["Venture Global LNG","QatarEnergy","Sempra Infrastructure"],"obst":"He inherited a company with about $30B of project debt, no free cash flow and a founder-led culture of building ahead of contracts; the 2020 collapse in LNG demand forced cargo cancellations in the middle of the Corpus Christi build-out.","turn":"Russia's 2022 invasion of Ukraine, which redirected US cargoes to Europe and let Cheniere sign a wave of long-term contracts that funded the Corpus Christi Stage 3 expansion.","band":"b1","ageb":"a6","y100":2022,"u45":false,"years":10,"vel":20,"ageAt100":59,"since100":4},{"id":"MATTHEW_MELOY","n":"Matthew Meloy","age":48,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.2,"p":"E","c":0.75,"s":"Targa Resources DEF 14A filed 26 Mar 2026; NYSE close 21 Aug 2026","m":"665,455 shares beneficially owned at the 2026 record date x $299.10 close = $199M","sect":"energy","origin":"self","co":"Targa Resources","did":"Joined Targa Resources in Houston in 2004 as a treasury analyst at age 26, became chief financial officer in 2015 and chief executive in 2020; collapsed the MLP structure, bought in the Badlands and DevCo interests and built out Permian gathering to roughly 30 plants.","started":2004,"startAge":26,"toFirst100":18,"why":"Midstream value comes from fee-based volume under long-term acreage dedications, not commodity spread. Meloy simplified Targa into a single C-corp, bought back the joint-venture interests that leaked cash flow to partners, and timed plant additions to Permian rig schedules so each filled on start-up.","comp":["Enterprise Products Partners","Energy Transfer","ONEOK"],"obst":"Targa entered 2020 with heavy leverage and a distribution it could not cover; Meloy cut the dividend by 89 percent within weeks of taking over as CEO, a step the market punished before the deleveraging worked.","turn":"The 2022 buy-in of the DevCo joint-venture interests for about $925M, which returned full ownership of the Permian gathering and processing cash flow to Targa shareholders.","band":"b1","ageb":"a5","y100":2022,"u45":false,"years":22,"vel":9.1,"ageAt100":44,"since100":4},{"id":"BRYAN_JOHNSON","n":"Bryan Johnson","age":49,"city":"Venice","country":"US","state":"CA","region":"socal","nw":0.2," d 20 percent and touring income, not a published list figure","sect":"media","origin":"self","co":"Welsh Witch Music","did":"Joined Fleetwood Mac with Lindsey Buckingham at the end of 1974 and wrote Rhiannon, Dreams and Landslide, keeping the songwriting credits; in December 2020 she sold 80 percent of her roughly 500-song catalogue to Primary Wave in a deal the Wall Street Journal valued at 100 million dollars.","started":1975,"startAge":27,"toFirst100":25,"why":"She wrote her own material when most women fronting rock bands sang other people's, so she owned publishing rather than only an artist royalty. Dreams is Fleetwood Mac's only US number one and it is hers, which is why a 45-year-old catalogue repriced upward in 2020.","comp":["Linda Ronstadt","Pat Benatar","Heart","Joni Mitchell"],"obst":"A cocaine habit that destroyed her septum, then eight years on Klonopin prescribed to treat it, which she has said cost her most of the 1990s; Rumours itself was cut while her relationship with Buckingham and the McVies' marriage were collapsing.","turn":"Autumn 2020, when a TikTok clip pushed Dreams back onto the charts weeks before she signed the Primary Wave deal, repricing the catalogue at the moment of sale.","band":"b1","ageb":"a7","y100":2000,"u45":false,"years":51,"vel":3.9,"ageAt100":52,"since100":26},{"id":"ABHI_RAMESH","n":"Abhi Ramesh","age":34,"city":"Philadelphia","country":"US","state":"PA","region":"ne","nw":0.2,"p":"I","c":0.7,"s":"Forbes, Chloe Sorvino, 25 February 2026 feature on Misfits Market","m":"Forbes states he is the single largest individual shareholder with an estimated 20 percent stake and worth at least 200 million, against a Forbes-estimated company valuation near 1 billion.","sect":"consumer","origin":"self","co":"Misfits Market","did":"Founded Misfits Market in Philadelphia in 2018 at 26 after seeing unsold cosmetically imperfect apples at a Pennsylvania orchard, building a subscription box for rescued produce; it raised 526 million dollars, bought rival Imperfect Foods in 2022 and The Rounds in 2025, and now runs about 500 million in revenue.","started":2018,"startAge":26,"toFirst100":3,"why":"Grocers reject produce on cosmetic specs, so that supply had no competing bidders; buying it direct from farms gave Misfits a structural gross-margin edge that Instacart and Amazon Fresh, buying at wholesale, cannot copy, and a subscription cadence made perishable logistics predictable.","comp":["Imperfect Foods","Thrive Market","Hungryroot","Instacart","Amazon Fresh"],"obst":"The 2022 online-grocery collapse killed most subscription grocers and cut the SoftBank-led 2 billion dollar 2021 valuation toward 1 billion; Misfits had to buy its largest competitor, merge two fulfilment networks and cut burn while subscriber growth stalled.","turn":"The September 2022 acquisition of Imperfect Foods, which removed the only direct rival and doubled the customer base.","band":"b1","ageb":"a2","y100":2021,"u45":true,"years":8,"vel":25,"ageAt100":29,"since100":5},{"id":"JOHN_J_ENGEL","n":"John J. Engel","age":64,"city":"Pittsburgh","country":"US","state":"PA","region":"ne","nw":0.2,"p":"E","c":0.65,"s":"Wesco International DEF 14A filed 17 Apr 2026; WCC close 349.14 on 21 Aug 2026","m":"753,914 shares beneficially owned including 296,637 exercisable options and SARs; the 457,277 shares held outright are worth 160M, options add on top; age 64 printed in proxy","sect":"industry","origin":"self","co":"Wesco International","did":"Joined Pittsburgh electrical distributor Wesco as operating chief in 2004, became chief executive in 2009, and in June 2020 closed the 4.5B purchase of Anixter International after outbidding Clayton Dubilier and Rice, roughly doubling revenue to about 17B and adding data centre and security wiring.","started":2004,"startAge":42,"toFirst100":17,"why":"Distribution is a scale and working-capital business: buying Anixter gave Wesco supplier rebate tiers and branch density that smaller rivals cannot match, ","comp":["Constellation Brands","E&J Gallo","Jackson Family Wines","Trinchero Family Estates"],"obst":"He was removed from the chairmanship in 2004 as the Woodbridge value tier dragged earnings and activist holders pressed, and the board then sold the company his father founded out from under three generations of the family.","turn":"Constellation's November 2004 all-cash offer at $56.50 a share, which ended family ownership and handed him the liquidity he used to build a second business.","band":"b1","ageb":"a7","y100":1996,"u45":false,"years":60,"vel":3.3,"ageAt100":53,"since100":30},{"id":"TIMOTHY_MONDAVI","n":"Timothy Mondavi","age":75,"city":"St. Helena","country":"US","state":"CA","region":"bay","nw":0.2,"p":"I","c":0.3,"s":"SEC Schedule 13D of 30 Aug 2004 and 13D/A of 22 Dec 2004 pricing Robert Mondavi shares at $56.50 cash; Robert Mondavi Corp DEF 14A of Oct 2003 listing his age as 52","m":"895,350 shares at the $56.50 cash merger price is about $51M gross in 2004 less option strikes, plus 338,058 Class B shares in his children's trusts; the larger asset is Continuum Estate, 172 acres on Pritchard Hill making roughly 10,000 cases at top Napa pricing","sect":"agri","origin":"mixed","co":"Continuum Estate","did":"Was winegrower and vice chairman of the Robert Mondavi Corporation from 1974, and after Constellation bought the family company at $56.50 a share in 2004 founded Continuum Estate with his sister and father, buying 172 acres on Pritchard Hill and making a single Cabernet blend.","started":1974,"startAge":23,"toFirst100":32,"why":"Continuum launched under a family name that already had global distribution, so it skipped the decade of brand-building a new Napa estate normally needs. One wine off hillside fruit means no value tier to defend and nothing to discount in a soft year.","comp":["Harlan Estate","Screaming Eagle","Colgin Cellars","Opus One"],"obst":"He was the winemaker publicly blamed for the quality drift that preceded the 2004 sale and had to oney, which put the company inside the US software buyer base it needed to sell to.","band":"b1","ageb":"a6","y100":2014,"u45":false,"years":19,"vel":10.5,"ageAt100":43,"since100":12},{"id":"GREG_GIANFORTE","n":"Greg Gianforte","age":65,"city":"Bozeman","country":"US","state":"MT","region":"mtn","nw":0.19,"p":"I","c":0.5,"s":"Oracle acquired RightNow Technologies for $1.5B in 2011 and Gianforte has said his proceeds exceeded $300M; Montana press and Forbes have since put him at roughly $180-210M","m":"Disclosed sale proceeds less two decades of documented philanthropy and self-funded campaigns; third-party estimate","sect":"tech","origin":"self","co":"RightNow Technologies","did":"Founded RightNow Technologies in Bozeman in 1997 with his wife Susan, selling web-based customer service software on subscription years before anyone said SaaS; Oracle bought it for 1.5 billion dollars in 2011. He has been governor of Montana since 2021.","started":1997,"startAge":36,"toFirst100":12,"why":"RightNow sold self-service knowledge bases to call centres whose economics ran on cost per contact, so every deflected phone call paid for the software directly. Running it from Bozeman meant engineers at half Silicon Valley wages and almost no attrition, which is why a subscription business survived three years without venture money.","comp":["Salesforce","Kana Communications","eGain","Oracle"],"obst":"He bootstrapped for three years and was told repeatedly that no enterprise software company could be built in Montana. RightNow traded below its 2004 IPO price for years because investors penalised subscription revenue in favour of upfront licences.","turn":"Oracle's October 2011 bid, made to plug the customer-service hole in its cloud stack against Salesforce.","band":"b1","ageb":"a7","y100":2009,"u45":false,"years":29,"vel":6.6,"ageAt100":48,"since100":17},{"id":"BLAKE_SARTINI","n":"Blake Sartini","age":68,"city":"Las Vegas","country":"US","state":"NV","region":"mtn","nw":0.19,"p":"E","c":0.65,"s":"Golden Entertainment DEF 14A: 6,548,788 shares, 24.8% of class; VICI Properties' acquisition closed 30 April 2026 with GDEN last trading at $28.55","m":"Disclosed beneficial share count times the final trading price at the completed cash acquisition, before tax","sect":"consumer","origin":"self","co":"Golden Entertainment","did":"Left Station Casinos in 2001 to build Golden Gaming, a Nevada route operator placing and servicing slot machines in taverns and grocery stores, reverse-merged it into Lakes Entertainment in 2015 to create Golden Entertainment, ran eight casinos and 73 taverns, and sold the company to VICI Properties in April 2026.","started":2001,"startAge":43,"toFirst100":12,"why":"Nevada's restricted gaming licence lets a tavern hold fifteen slot machines and the route operator supplies and services them for a share of the win, a casino business with no casino to build and no hotel rooms to fill. Buying the taverns themselves later captured the food margin and the gaming split together.","comp":["Station Casinos","Boyd Gaming","Herbst Gaming","Century Casinos"],"obst":"Route operators live on renewable location contracts a landlord can hand to a rival overnight. Covid closed every Nevada tavern in 2020, and the company had to sell its distributed-gaming division in 2023 to cut leverage.","turn":"The 2015 reverse merger into Lakes Entertainment, which gave a private route operator a listed currency to buy casinos with.","band":"b1","ageb":"a7","y100":2013,"u45":false,"years":25,"vel":7.6,"ageAt100":55,"since100":13},{"id":"GLENN_FOGEL","n":"Glenn Fogel","age":64,"city":"Norwalk","country":"US","state":"CT","region":"ne","nw":0.19,"p":"E","c":0.6,"s":"Booking Holdings SEC Form 4, 16 April 2026","m":"298,174 shares held directly plus 345,500 held by a grantor retained annuity trust, 643,674 total, at about 185 dollars per share","sect":"consumer","origin":"self","co":"Booking Holdings","did":"Joined Priceline in 2000 as head of corporate development, bought Active Hotels and Bookings BV in 2004-2005 for about 296 million dollars combined, and has been chief executive since 2017 of the renamed Booking Holdings, the largest online travel company in the world.","started":2000,"startAge":38,"toFirst100":18,"why":"The 2005 Bookings BV purchase bought European hotel supply on an agency model where the hotel is paid at checkout, which is why Booking scaled across fragmented European inventory that Expedia's merchant model could not economically sign. Fogel then poured the cash flow into performance marketing nobody could outbid.","comp":["Expedia","Airbnb","Google Travel","Trip.com","Marriott direct"],"obst":"Booking's revenue fell by more than half in 2020 as global travel stopped and the company drew down credit and cut staff; it has also fought sustained EU and national antitrust and price-parity actions in Spain, Italy and the Netherlands.","turn":"The 2005 acquisition of Amsterdam-based Bookings BV for roughly 133 million dollars, which turned a US discount airfare site into the dominant European hotel platform.","band":"b1","ageb":"a6","y100":2018,"u45":false,"years":26,"vel":7.3,"ageAt100":56,"since100":8},{"id":"RICK_L_WESSEL","n":"Rick L. Wessel","age":67,"city":"Fort Worth","country":"US","state":"TX","region":"tx","nw":0.19,"p":"E","c":0.8,"s":"FirstCash Holdings DEF 14A filed 28 Apr 2026, beneficial ownership as of 13 Apr 2026: 822,797 shares, 1.88 percent; age 67 printed in the director table","m":"822,797 shares times the 225.28 dollar FCFS close of 21 Aug 2026 = 185 million dollars","sect":"finance","origin":"self","co":"FirstCash Holdings","did":"Joined a small Texas pawn chain as CFO in 1992 after nine years at Price Waterhouse, became president in 1998 and CEO in 2006, and built FirstCash into roughly 3,000 pawn stores across the US and Latin America, merging with Cash America in 2016 and buying lease-to-own lender American First Finance in 2021.","started":1992,"startAge":33,"toFirst100":22,"why":"Pawn is fully collateralised consumer credit with no charge-off risk and a licensing moat that keeps fintech out. Wessel pushed into Mexico from 1999, where store-level returns ran roughly double the US and sites beside Walmart de Mexico were still open, so Latin America came to supply over half the store base.","comp":["Cash America International","EZCORP","Grupo Salinas","DFC Global"],"obst":"The CFPB sued FirstCash in November 2021 for making pawn loans to active-duty servicemembers above the Military Lending Act rate cap; the company paid a 9 million dollar settlement in 2023 and had to rebuild its compliance stack at the same time as integrating the 1.17 billion dollar AFF acquisition.","turn":"The September 2016 merger with Cash America International, which removed his only US scale competitor and made FirstCash the largest publicly traded pawn operator in the world.","band":"b1","ageb":"a7","y100":2014,"u45":false,"years":34,"vel":5.6,"ageAt100":55,"since100":12},{"id":"JOSEPH_CUTILLO","n":"Joseph Cutillo","age":60,"city":"The Woodlands","country":"US","state":"TX","region":"tx","nw":0.19,"p":"E","c":0.75,"s":"Sterling Infrastructure DEF 14A filed 25 Mar 2026; Nasdaq close 21 Aug 2026","m":"369,839 shares, about 1% of the class, at the 2026 proxy date x $516.81 close = $191M","sect":"industry","origin":"self","co":"Sterling Infrastructure","did":"Joined Sterling Construction in The Woodlands in October 2015 when it was a near-insolvent low-bid highway contractor and became chief executive in 2017; rebuilt it as Sterling Infrastructure around e-commerce and data-centre site work, taking the shares from about $4 to over $500.","started":2015,"startAge":49,"toFirst100":9,"why":"He walked away from lump-sum heavy highway bidding, where the low bidder owns every risk, and bought into e-infrastructure site development, where work is negotiated, margins run three to four times higher and a handful of hyperscale customers repeat. Backlog quality, not backlog size llion dollars on tariffs.","turn":"November 2025, when the board split the president role and handed him the Columbia brand, the unit that is most of group revenue, putting him in line to run the company.","band":"b1","ageb":"a5","y100":2015,"u45":false,"years":21,"vel":9,"ageAt100":34,"since100":11},{"id":"VINCENT_MATTERA","n":"Vincent D. Mattera Jr.","age":70,"city":"Pittsburgh","country":"US","state":"PA","region":"ne","nw":0.19,"p":"E","c":0.45,"s":"Coherent Corp Form 4 filed 15 May 2024 by Vincent D. Mattera Jr (664,684 shares held directly); COHR close 289.52 on 21 Aug 2026","m":"664,684 shares x 289.52 = 192M; excludes options and any sales after he left Section 16 reporting on retirement in mid 2024; age 67 as of 31 Aug 2023 per Coherent proxy","sect":"tech","origin":"self","co":"Coherent Corp","did":"Ran II-VI of Saxonburg Pennsylvania as chief executive from 2014 to June 2024, buying Finisar for 3.2B in 2019 and Coherent Inc for about 7B in 2022, then taking the Coherent name; the combined company supplies the optical transceivers and lasers behind AI datacentre interconnect.","started":2004,"startAge":48,"toFirst100":21,"why":"II-VI already grew its own crystals and substrates, so buying the transceiver and laser businesses in front of it captured the whole optical chain from selenide and silicon carbide boules to finished modules, which is why AI datacentre demand in 2025 and 2026 landed on a cost base nobody could undercut.","comp":["Lumentum","Fabrinet","Broadcom","Applied Optoelectronics","IPG Photonics"],"obst":"Winning Coherent Inc in a 2021 auction against Lumentum and MKS required roughly 5B of new debt and Bain preferred equity, and the share price then fell about 60 percent through 2022 and 2023 before AI optics demand arrived.","turn":"The March 2021 decision to keep raising the bid for Coherent Inc after Lumentum had a signed agreement.","band":"b1","ageb":"a7","y100":2025,"u45":false,"years":22,"vel":8.6,"ageAt100":69,"since100":1},{"id":"FRANCIS_J_KRAMER","n":"Francis J. Kramer","age":77,"city":"Pittsburgh","country":"US","state":"PA","region":"ne","nw":0.19,"p":"I","c":0.4,"s":"Coherent Corp Form 4 filed 16 Nov 2022 by Francis J. Kramer (272,685 direct, 35,000 in a GRAT, 285,401 in a spousal trust, 65,324 options at 19.37); COHR close 289.52 on 21 Aug 2026","m":"593,086 shares x 289.52 = 172M plus option intrinsic value of about 18M; no Section 16 visibility since he left the board in 2022, so sales may have reduced it; age 72 in the II-VI 2021 proxy","sect":"tech","origin":"self","co":"Coherent Corp","did":"Joined II-VI in Saxonburg in 1983, was its president from 1985 to 2007 and chief executive from 2007 to 2014, turning a niche maker of infrared optics for carbon dioxide cutting lasers into a vertically integrated photonics manufacturer with plants across China, Singapore, the Philippines and Vietnam.","started":1983,"startAge":34,"toFirst100":41,"why":"II-VI grew its own crystal materials, so it could enter any market where the optic was the hard part; owning the furnaces meant rivals buying merchant substrates could not match its cost or lead times, and the Asian plants he built won volume telecom work US optics firms could not price.","comp":["Lumentum","JDS Uniphase","Rofin-Sinar","Coherent Inc","IPG Photonics"],"obst":"The company depended on industrial laser cutting optics, a cycle that fell with machine-tool orders in 2001 and again in 2009, and he had to fund diversification out of a small revenue base without diluting the founders.","turn":"The January 2010 purchase of Photop Technologies in China, which put II-VI into optical communications components and set up the Finisar deal a decade later.","band":"b1","ageb":"a7","y100":2024,"u45":false,"years":43,"vel":4.4,"ageAt100":75,"since100":2},{"id":"STEVEN_SINGH","n":"S. Steven Singh","age":64,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.19,"p":"E","c":0.6,"s":"Concur DEF 14A filed 2014-01-30 (age 52; 1,081,031 shares, 1.7%, 260,656 unvested RSUs); SAP acquisition at $129 per share, closed December 2014","m":"1,081,031 shares plus 260,656 unvested RSUs cashed at SAP's $129 offer = about $173M gross in December 2014, net of tax and before earlier open-market sales. Compounded modestly since.","sect":"tech","origin":"self","co":"Concur Technologies","did":"Co-founded Concur as Portable Software in Bellevue in 1993 and was CEO from 1996. Rebuilt a boxed expense-report product into a hosted network and sold it to SAP for $8.3B at $129 a share in December 2014, where his own 1.08M shares and unvested units were worth about $173M.","started":1993,"startAge":31,"toFirst100":14,"why":"The moat was the supplier network, not the software. Concur wired airlines, hotel chains and card issuers straight into the expense report, so itineraries and card charges arrived pre-filled. A rival had to rebuild hundreds of integrations, and the customer's travel policy was enforced inside Concur's workflow.","comp":["Ariba","Oracle","Expensify","American Express in-house tools"],"obst":"The licensed business collapsed in the dot-com bust. Concur shares fell to roughly $0.31 in 2001, the company cut about a third of its staff, and Singh had to rewrite the entire product as a hosted service while revenue fell.","turn":"2001-2002, when Singh killed the shrink-wrap licence business outright and moved every customer to the hosted model, trading near-term revenue for recurring subscriptions.","band":"b1","ageb":"a6","y100":2007,"u45":false,"years":33,"vel":5.8,"ageAt100":45,"since100":19},{"id":"WILLIAM_E_BROWN","n":"William E. Brown","age":84,"city":"Walnut Creek","country":"US","state":"CA","region":"bay","nw":0.19,"p":"E","c":0.85,"s":"Central Garden & Pet DEF 14A filed 22 Dec 2025, ownership as of 15 Dec 2025; CENT $44.40 and CENTA $38.43 closes, 21 Aug 2026","m":"1,600,459 Class B plus 1,386,792 Common valued at the $44.40 voting-share close = $132.6M, plus 1,432,565 Class A at the $38.43 close = $55.1M, total about $188M","sect":"consumer","origin":"self","co":"Central Garden & Pet","did":"Founded Central Garden & Pet in 1980 as a lawn and garden distributor in the East Bay, took it public in 1993 and rolled up more than 60 brands - Pennington, Nylabone, Kaytee, Aqueon, Amdro - into a $3.1bn revenue supplier; CEO 1980-2003 and 2007-2013, chairman since.","started":1980,"startAge":38,"toFirst100":16,"why":"He owned distribution before he owned brands. Controlling shelf placement at Home Depot, Walmart and PetSmart meant Central could buy small garden and pet brands cheaply and immediately triple their retail footprint, a spread no brand-only acquirer could match.","comp":["Spectrum Brands","Scotts Miracle-Gro","Petmate","Hartz Mountain"],"obst":"Losing the Scotts distribution business in the late 1990s removed a huge share of revenue and forced Central to become a branded manufacturer instead of a distributor; he also had to hold a dual-class structure through repeated activist pressure over the non-voting Class A stock.","turn":"The 1998-2000 break with Scotts, which pushed him to buy Pennington Seed and the pet brands outright and turned a low-margin distributor into a manufacturer with its own gross margin.","band":"b1","ageb":"a7","y100":1996,"u45":false,"years":46,"vel":4.1,"ageAt100":54,"since100":30},{"id":"JOE_BERCHTOLD","n":"Joe Berchtold","age":61,"city":"Beverly Hills","country":"US","state":"CA","region":"socal","nw":0.19,"p":"E","c":0.8,"s":"Live Nation DEF 14A filed 24 Apr 2026: 1,034,234 shares beneficially owned including options and restricted stock; LYV closed 181.82 dollars on 21 Aug 2026","m":"Disclosed beneficial ownership times market close, 1,034,234 x 181.82 = 188 million dollars","sect":"media","origin":"self","co":"Live Nation Entertainment","did":"Joined Live Nation as chief operating officer in April 2011, a year after the Ticketmaster merger, and rebuilt Ticketmaster technology and the sponsorship business before becoming president and CFO of a company now running more than 26 billion dollars of revenue.","started":2011,"startAge":46,"toFirst100":13,"why":"He made the ticketing platform the data layer under the concerts business, so Live Nation could sell sponsorship and advertising priced off fan purchase history rather than venue footfall. That turned ticketing from a fee collector into the highest-margin segment.","comp":["AEG Presents","SeatGeek","StubHub","Eventbrite"],"obst":"He testified before the Senate Judiciary Committee in January 2023 after the Taylor Swift Eras onsale collapsed under bot traffic, and has run the company through the DOJ and 30-state antitrust suit filed in May 2024 seeking to unwind the Ticketmaster merger.","turn":"The 2018 replatforming of Ticketmaster onto a modern verified-fan and dynamic-pricing stack, which raised yield per ticket across the entire venue portfolio.","band":"b1","ageb":"a6","y100":2024,"u45":false,"years":15,"vel":12.7,"ageAt100":59,"since100":2},{"id":"RICK_PERRY","n":"Rick Perry","age":76,"city":"Dallas","country":"US","state":"TX","region":"tx","nw":0.19,"p":"E","c":0.6,"s":"SEC Form 3/4 and Schedule 13 holdings for Fermi Inc (FRMI) compiled Aug 2026: 32,344,157 shares, 5.05 percent","m":"Disclosed insider share count times the 5.76 dollar implied share price = 186 million dollars","sect":"energy","origin":"self","co":"Fermi Inc","started":2025,"startAge":74,"toFirst100":1,"did":"After fourteen years as governor of Texas and four as US energy secretary, he cofounded Fermi in January 2025 with his son Griffin and Toby Neugebauer to build an 11-gigawatt nuclear and gas powered AI data centre campus on 5,236 acres near Amarillo; it listed on Nasdaq nine months later.","why":"The scarce input in AI is interconnected power, and the people who can move a nuclear licence and an ERCOT interconnection are regulators rather than developers. He supplied the Nuclear Regulatory Commission and Texas grid relationships that let a company formed in January be public by October.","comp":["Oklo","Crusoe Energy","NuScale Power","Vistra"],"obst":"He left public office on a government salary with no operating company, and Fermi went public with no revenue, drawing short-seller scrutiny of whether its reactors were financeable; the stock fell well below its listing valuation within months.","turn":"The October 2025 Nasdaq listing of Fermi at roughly a 12.5 billion dollar valuation, nine months after incorporation.","band":"b1","ageb":"a7","y100":2026,"u45":false,"years":1,"vel":190,"ageAt100":75,"since100":0},{"id":"FREDERIC_KERREST","n":"Frederic Kerrest","age":49,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.18,"p":"E","c":0.85,"s":"Okta DEF 14A filed 7 May 2026: 272,146 Class A and 1,089,931 Class B shares; OKTA closed at $135.14 on 21 Aug 2026","m":"1,362,077 shares x $135.14 = $184M; excludes sales since the 2017 IPO","sect":"tech","origin":"self","co":"Okta","did":"Co-founded Okta with Todd McKinnon in 2009 after both worked at Salesforce, ran it as COO until 2023 and is now vice chairperson; he also founded Windproof Partners to invest in early-stage software.","started":2009,"startAge":32,"toFirst100":8,"why":"Kerrest built the go-to-market that let a neutral identity vendor sell into IT departments already committed to Microsoft. Okta priced per-user across every application, so revenue grew with a customers SaaS sprawl without a new sales cycle.","comp":["Microsoft Entra ID","Ping Identity","SailPoint","OneLogin"],"obst":"Okta was rejected by most investors in 2009 on the grounds that Microsoft owned identity; after the 2021 $6.5B Auth0 acquisition the sales organisations were merged badly, growth decelerated sharply and the 2022 Lapsus breach compounded the damage.","turn":"The 2015 pivot to selling identity as the security perimeter rather than as convenience software, which reframed Okta as a security purchase with a security budget behind it.","band":"b1","ageb":"a5","y100":2017,"u45" d carrying the debt for it.","turn":"The February 2019 completion of the 11B GE Transportation combination, which doubled Wabtec and made the aftermarket the profit engine.","band":"b1","ageb":"a7","y100":2021,"u45":false,"years":20,"vel":9,"ageAt100":70,"since100":5},{"id":"JOE_SANDERSON_JR","n":"Joe F. Sanderson Jr.","age":79,"city":"Laurel","country":"US","state":"MS","region":"se","nw":0.18,"p":"E","c":0.55,"s":"Sanderson Farms Form 4 filed 26 Jul 2022 showing his position cashed out in the merger; the Cargill and Continental Grain buyout closed at 203.00 per share","m":"Peak disclosed holding of 718,587 shares x the 203.00 merger price = 146M, plus disclosed earlier sales and ESOP allocations","sect":"agri","origin":"inherited","co":"Sanderson Farms","did":"Third-generation head of Sanderson Farms in Laurel Mississippi; became president in 1984 and chief executive in 1989, and took the company from a small regional processor to the third-largest US chicken producer before selling it to Cargill and Continental Grain for 4.53B in 2021.","started":1984,"startAge":37,"toFirst100":25,"why":"Sanderson built one new complex at a time, each fully paid for in cash before the next, and refused to carry debt through the chicken cycle. When feed costs spiked or prices collapsed, leveraged competitors sold plants and Sanderson bought growers and market share at the bottom.","comp":["Tyson Foods","Pilgrim's Pride","Perdue Farms","Koch Foods"],"obst":"He publicly refused to move to antibiotic-free or no-hormone labelling when Tyson and Perdue did, and took years of activist and retailer pressure for it; the company was also named in the federal broiler price-fixing litigation that produced hundreds of millions in industry settlements.","turn":"August 2021, when Cargill and Continental Grain agreed to buy the company for 4.53B in cash, the largest US poultry deal in years.","band":"b1","ageb":"a7","y100":2009,"u45":false,"years":42,"vel":4.3,"ageAt100":62,"since100":17},{"id": ogy","Draper Laboratory","Blue Origin"],"obst":"A laser rangefinder left disabled before launch nearly ended the IM-1 mission; Crain's team rewrote flight software mid-cruise to substitute an experimental NASA lidar payload as the primary altimeter, which is the only reason Odysseus reached the surface.","turn":"The 23 February 2024 landing of Odysseus, which validated the navigation stack in flight and turned a decade of unproven engineering into a bankable product line.","band":"b1","ageb":"a5","y100":2024,"u45":false,"years":13,"vel":13.1,"ageAt100":51,"since100":2},{"id":"MARK_CASALE","n":"Mark A. Casale","age":61,"city":"Radnor","country":"US","state":"PA","region":"ne","nw":0.17,"p":"E","c":0.75,"s":"Essent Group DEF 14A filed 2026, beneficial ownership table, and director age table; ESNT close 68.07 on stockanalysis.com, 21 Aug 2026","m":"2,481,544 shares x 68.07 = 169M, of which 472,106 are performance shares that vest only at maximum achievement, so the floor is about 137M.","sect":"finance","origin":"self","co":"Essent Group","did":"After running Radian and then GMACs residential mortgage insurance units, he founded Essent in 2008 and raised roughly 500 million dollars from Goldman Sachs, Pine Brook and JPMorgan to start a private mortgage insurer with no legacy book while every incumbent was drowning in 2005-2007 loans; Essent listed in 2013.","started":2008,"startAge":43,"toFirst100":7,"why":"Mortgage insurance is a function of loan vintage. Starting from zero in 2009 meant Essent wrote only post-crisis loans at 760 FICO scores while MGIC, Radian and Genworth were capital-impaired and unable to bid, letting a startup take share at the best underwriting moment in 40 years.","comp":["MGIC","Radian Group","Genworth Mortgage","NMI Holdings","Arch Capital"],"obst":"Raising half a billion dollars of equity in 2008 and 2009 for a mortgage-related startup, and then convincing state regulators and Fannie Mae and Freddie Mac to approve an unproven counterparty with no claims history.","turn":"The 2009 Fannie Mae and Freddie Mac approvals that let Essent write insurance on conforming loans.","band":"b1","ageb":"a6","y100":2015,"u45":false,"years":18,"vel":9.4,"ageAt100":50,"since100":11},{"id":"MARK_LAPPE","n":"Mark Lappe","age":59,"city":"La Jolla","country":"US","state":"CA","region":"socal","nw":0.17,"p":"E","c":0.6,"s":"Inhibrx Biosciences DEF 14A filed 26 Apr 2026: Lappe beneficially owned 1,075,413 shares, 7.29 percent, age 59; Inhibrx DEFM14A filed 26 Apr 2024 shows 3,194,717 Inhibrx shares at Sanofi's 30.00 dollar cash price; INBX closed 103.63 dollars on 21 Aug 2026","m":"Live stake 1,075,413 x 103.63 = 111 million dollars, of which 925,413 are outright shares. Plus roughly 96 million gross of Sanofi cash in 2024, taken at about 60 million after tax on the option portion. Total held to 170 million.","sect":"health","origin":"self","co":"Inhibrx","did":"Co-founded Inhibrx in La Jolla in 2010 to build multivalent single-domain antibodies, sold the alpha-1 antitrypsin program INBRX-101 to Sanofi for about 2.2 billion dollars in January 2024, and spun the remaining pipeline out as Inhibrx Biosciences, where he is chief executive.","started":2010,"startAge":43,"toFirst100":11,"why":"The single-domain format let him hang three or four binding heads off one molecule and tune valency precisely. Death-receptor agonism had failed for twenty years because bivalent antibodies cluster the receptor too weakly; tetravalent binding is what made INBRX-109 work in chondrosarcoma.","comp":["Grifols","Takeda","CSL Behring","Kamada"],"obst":"Inhibrx spent a decade on venture and crossover money with no approved product, in a target class littered with failures from Amgen, Genentech and Daiichi Sankyo; the 2020 IPO came before any pivotal data existed.","turn":"23 January 2024, when Sanofi agreed to buy the company for one asset and hand the rest of the pipeline back to shareholders as a separate listed company.","band":"b1","ageb":"a6"," k it public on the NYSE in 1997 and served as president until 2017 as the company, renamed Insperity, became one of the largest professional employer organisations in the United States.","why":"A professional employer organisation becomes the employer of record for thousands of small firms at once, so it buys health insurance and workers compensation at large-group rates and resells them to twenty-person companies. That small-to-large group pricing arbitrage is the entire margin.","comp":["ADP TotalSource","TriNet","Paychex","Barrett Business Services"],"obst":"Insperity carries its clients medical claims risk, and large-claim spikes in 2019 and again in 2023 cut earnings sharply and halved the shares; Starboard Value took an activist stake and pushed for changes to the model.","turn":"The January 1997 NYSE listing, which gave a co-employment business the balance sheet to carry insurance risk at scale.","band":"b1","ageb":"a7","y100":2009,"u45":false,"years":37,"vel":4.6,"ageAt100":60,"since100":17},{"id":"JOSH_JAMES","n":"Josh James","age":52,"city":"Provo","country":"US","state":"UT","region":"mtn","nw":0.16,"p":"I","c":0.5,"s":"Adobe acquired Omniture for $1.8B in 2009; his roughly 10% Domo stake is worth under $20M at DOMO's $3.80 close on 21 Aug 2026","m":"Reported Omniture proceeds carried forward plus a marked-to-market Domo stake; third-party estimate of about $160M","sect":"tech","origin":"self","co":"Omniture / Domo","did":"Dropped out of BYU to start MyComputer.com in 1996, which became Omniture, the web analytics service that measured traffic for most of the Fortune 500; sold it to Adobe for 1.8 billion dollars in 2009 and immediately founded Domo in Utah, raising more than 700 million dollars for a business-intelligence dashboard that never repeated it.","started":1996,"startAge":22,"toFirst100":10,"why":"Omniture sold analytics as a hosted service billed on traffic volume when everyone else sold log-analysis software on a licence, so its revenue grew a rgest US bank by buying National City in 2008 and BBVA USA for 11.6B in 2021.","started":2002,"startAge":39,"toFirst100":15,"why":"PNC held a 22 percent stake in BlackRock from the 1995 sale of its own asset manager; selling it in May 2020 for 14.4B gave Demchak acquisition currency at the exact moment BBVA wanted out of the US, so he bought a 100B-asset franchise in Texas and the southwest with a windfall rather than with dilution.","comp":["US Bancorp","Truist","Fifth Third","Citizens Financial","KeyCorp"],"obst":"He integrated National City in December 2008 while it was failing and PNC was inside TARP, absorbing a bank nearly PNC size with a loan book full of Florida and Ohio mortgage losses.","turn":"The May 2020 sale of PNC entire BlackRock stake at the top of the market, converting a passive holding into the BBVA USA purchase.","band":"b1","ageb":"a6","y100":2017,"u45":false,"years":24,"vel":6.7,"ageAt100":54,"since100":9},{"id":"WARREN_WINIARSKI","n":"Warren Winiarski","age":97,"city":"Napa","country":"US","state":"CA","region":"bay","nw":0.16,"p":"E","c":0.4,"s":"Contemporaneous reporting and Wikipedia on the 1 Aug 2007 agreement to sell Stag's Leap Wine Cellars for $185M to UST Inc and Marchese Piero Antinori; born 22 Oct 1928","m":"$185M in 2007, roughly $140M after federal and California capital gains, less about $55M of disclosed giving including a $50M matching grant to St. John's College in 2018, plus the retained Arcadia Vineyard in Coombsville and nineteen years of investment return","sect":"agri","origin":"self","co":"Stag's Leap Wine Cellars","did":"Left a University of Chicago political-philosophy career, bought a 44-acre Napa prune orchard in 1970, and made the 1973 Cabernet that beat Mouton Rothschild and Haut-Brion at the 1976 Paris tasting, then sold Stag's Leap Wine Cellars for $185 million in 2007.","started":1970,"startAge":42,"toFirst100":30,"why":"The Paris tasting was blind and judged by French palates, so the result could not be written n 1997 at the very edge of the dotcom window and nearly ran out before the IPO; LendingTree spent the 2008-2011 period in litigation over its own defunct mortgage-origination arm, and TREE has lost roughly half its market value in the past year.","turn":"2008, when IAC spun LendingTree back out as an independent public company and he was able to run it as a pure marketplace again.","band":"b1","ageb":"a6","y100":2003,"u45":false,"years":30,"vel":5.3,"ageAt100":33,"since100":23},{"id":"JIM_FLORES","n":"Jim Flores","age":67,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.16,"p":"E","c":0.6,"s":"SEC beneficial ownership for Sable Offshore (SOC) compiled Aug 2026: about 11,190,000 shares, roughly 7.7 percent, valued at 161 million dollars","m":"Disclosed share count times implied market price; excludes proceeds already taken from his earlier company sales","sect":"energy","origin":"self","co":"Sable Offshore","started":1992,"startAge":33,"toFirst100":9,"did":"Cofounded Flores and Rucks in Louisiana in 1992, sold it as Ocean Energy to Devon in 2003, built Plains Exploration and Production and sold it to Freeport-McMoRan in 2013 for 6.9 billion dollars, then formed Sable Offshore in Houston in 2021 to buy and restart ExxonMobils shut-in Santa Ynez field off California.","why":"He repeatedly bought producing offshore assets majors were exiting for portfolio reasons rather than geology, so reserves came at a discount to development cost. Sable is the extreme version, buying a field shut since a 2015 pipeline rupture where the only value driver is a regulatory restart, not the drill bit.","comp":["Talos Energy","W and T Offshore","Kosmos Energy","Crescent Energy"],"obst":"The 2013 Plains sale to Freeport-McMoRan triggered shareholder suits and a collapse in the buyers stock, and Sables restart of the Las Flores pipeline has been fought by California regulators and the Coastal Commission, swinging the shares on each ruling.","turn":"The 2024 completion of the Santa Ynez purchase from ExxonMobil, financed largely by a seller note, which handed Sable a producing field for almost no cash.","band":"b1","ageb":"a7","y100":2001,"u45":false,"years":34,"vel":4.7,"ageAt100":42,"since100":25},{"id":"ANDREW_FLORANCE","n":"Andrew Florance","age":62,"city":"Arlington","country":"US","state":"VA","region":"dc","nw":0.15,"p":"E","c":0.5,"s":"CoStar Group DEF 14A filed 30 Apr 2026: 3,044,568 shares beneficially owned as of 1 Apr 2026; CSGP closed 32.26 on 21 Aug 2026","m":"Current holding of 98 million dollars plus estimated after-tax proceeds of three decades of disclosed option exercises against 36.4 million dollars of 2025 pay alone","sect":"realestate","origin":"self","co":"CoStar Group","did":"Founded CoStar in 1987 out of Princeton to photograph and catalogue every commercial building in Washington, sold the data by subscription to brokers, and expanded it into the dominant US commercial property database, then bought Apartments.com in 2014 for 585 million dollars and Homes.com in 2021.","started":1987,"startAge":23,"toFirst100":15,"why":"Commercial real estate had no MLS, so no shared record of what buildings existed, who occupied them and at what rent. He hired researchers to build that record building by building, an operation nobody wanted to replicate, and once brokers depended on it he could raise subscription prices annually with almost no churn.","comp":["Zillow","Moodys Analytics REIS","LoopNet","Yardi Matrix"],"obst":"CoStar burned cash for a decade compiling a database before it had a market, nearly running out in the late 1990s; the FTC then forced divestitures in the 2012 LoopNet acquisition, and the 2024 Homes.com launch cost hundreds of millions in marketing while the stock fell by half.","turn":"The 2012 purchase of LoopNet for 860 million dollars, which removed the only rival listing network and consolidated commercial listings under one owner.","band":"b1","ageb":"a6","y100":2002,"u45":false,"years":39,"vel":3. table","sect":"tech","origin":"self","co":"Great Plains Software","did":"Mortgaged farmland he inherited near Arthur, North Dakota in 1983 to buy into Great Plains Software, an accounting package for small businesses, ran it as chief executive, took it public in 1997 and sold it to Microsoft in 2001 for 1.1 billion dollars in stock. Governor of North Dakota to 2024 and US Interior Secretary since 2025.","started":1983,"startAge":26,"toFirst100":14,"why":"Great Plains sold only through a channel of accountants and value-added resellers, never direct, so thousands of local bookkeepers had a commercial reason to recommend it and to carry the support burden themselves. That channel was the asset Microsoft actually bought, because it reached small businesses Microsoft could not.","comp":["Intuit","Sage Group","Solomon Software","Navision"],"obst":"He put inherited farmland at risk to fund a software company in a state with no software industry and no venture capital, then had to rebuild the entire product for Windows in the mid-1990s while a reseller channel that made money on DOS resisted the change.","turn":"Microsoft's December 2000 all-stock offer, agreed months before the software market repriced.","band":"b1","ageb":"a7","y100":1997,"u45":false,"years":43,"vel":3.5,"ageAt100":40,"since100":29},{"id":"BILL_MAGNUSON","n":"Bill Magnuson","age":40,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.15,"p":"E","c":0.75,"s":"Form 4, May 2026: 4,890,781 Braze Class A shares held directly plus 470 indirect; BRZE closed $31.06 on 21 Aug 2026","m":"4,891,251 shares x $31.06 = $151.9M, including 669,747 unvested restricted and performance units","sect":"tech","origin":"self","co":"Braze","did":"Co-founded Appboy at a Manhattan hackathon in 2011 with Jon Hyman and Mark Ghermezian, building a customer-engagement platform for targeted mobile push and in-app messaging; renamed it Braze in 2017 and listed on Nasdaq in November 2021.","started":2011,"startAge":25,"toFirst100":10,"why":"Marketing clouds were built around email and the web and reached the customer after the fact. Braze started from the mobile SDK inside the app, so it held the live behavioural event stream - what the user did thirty seconds ago - which Salesforce and Adobe could only import later from a warehouse.","comp":["Salesforce Marketing Cloud","Adobe Experience Cloud","Airship","Iterable","OneSignal"],"obst":"Two MIT engineers with no enterprise sales experience spent the first two years selling to app startups with no budget and high mortality; after the 2021 IPO the shares fell more than 70% as software multiples compressed.","turn":"The 2015 Series B and the deliberate move upmarket from app developers to enterprise brands.","band":"b1","ageb":"a4","y100":2021,"u45":true,"years":15,"vel":10,"ageAt100":35,"since100":5},{"id":"BOBBI_BROWN","n":"Bobbi Brown","age":69,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.15,"p":"E","c":0.35,"s":"Estee Lauder acquired Bobbi Brown Essentials in 1995 for a reported $74.5M; Jones Road Beauty, founded 2020, reached roughly $150M of annual sales","m":"1995 sale proceeds plus 22 years of Estee Lauder executive pay, plus a majority family stake in Jones Road marked at roughly 3x revenue","sect":"consumer","origin":"self","co":"Bobbi Brown Cosmetics and Jones Road Beauty","did":"A freelance makeup artist who created ten brown-based lipsticks with a chemist in 1991 and sold them at Bergdorf Goodman; Estee Lauder bought the company in 1995, she stayed 22 years, left in 2016, and once the non-compete expired launched Jones Road Beauty in 2020.","started":1991,"startAge":34,"toFirst100":10,"why":"Prestige counters in 1991 sold theatrical seasonal colour. She sold the opposite proposition - that makeup should look like skin - as a ten-item system rather than a collection, which meant a customer bought the whole range once instead of one lipstick a season.","comp":["MAC Cosmetics","Nars","Laura Mercier","T e member home. Signify owned the only national clinician network able to get inside those homes at scale, making it the toll gate to revenue plans could not otherwise capture, and a decade of hiring built it.","comp":["Matrix Medical Network","Optum HouseCalls","Inovalon","Episource"],"obst":"Signify listed at 24 dollars in February 2021 and lost most of its value in 2022 when CMS ended the BPCI-A bundled-payment programme that its Episodes of Care segment depended on and simultaneously proposed limiting in-home diagnoses in risk adjustment, attacking both halves of the company at once.","turn":"The mid-2022 decision to shut the Episodes of Care business and run a sale process, which produced a three-way auction and CVS's 30.50 dollar all-cash bid.","band":"b1","ageb":"a4","y100":2023,"u45":true,"years":8,"vel":17.5,"ageAt100":38,"since100":3},{"id":"TOMER_WEINGARTEN","n":"Tomer Weingarten","age":43,"city":"Mountain View","country":"US","state":"CA","region":"bay","nw":0.14,"p":"E","c":0.7,"s":"SentinelOne DEF 14A 2026, ownership as of 2026-04-30 and executive officer age table; S close $21.19 on 2026-08-21","m":"4,516,619 held shares, trust shares and near-term RSUs x $21.19 = $96M, plus 3,406,920 exercisable options worth roughly $38M intrinsic against an estimated $10 average strike","sect":"tech","origin":"self","co":"SentinelOne","did":"Co-founded SentinelOne in 2013 and built an endpoint agent that models process behaviour on the device rather than matching signatures in the cloud, with one-click rollback of ransomware damage; listed it on the NYSE in June 2021 and bought Attivo Networks in 2022 and PingSafe in 2024.","started":2013,"startAge":30,"toFirst100":8,"why":"CrowdStrikes cloud-first design needs connectivity and analyst triage; putting detection and automatic rollback on the endpoint itself let SentinelOne win air-gapped, mid-market and MSSP-served accounts that the cloud model served poorly, and it backed that with a ransomware warranty rivals would er price equals 111M dollars, before in-the-money pre-IPO options","sect":"tech","origin":"self","co":"Fitbit","did":"Co-founded Fitbit in San Francisco in 2007 with Eric Friedman after two earlier startups, shipped the clip-on Fitbit Tracker in 2009, took the company public in June 2015 in the year's largest consumer-electronics IPO, and sold it to Google for 2.1B dollars in cash.","started":2007,"startAge":30,"toFirst100":8,"why":"Fitbit put a MEMS accelerometer into a 99 dollar clip years before phones did the counting free, and wrapped it in a social leaderboard. The real moat was shelf space at Best Buy, Target and Walmart, which is exactly what Apple and the cheap Chinese band makers later took away.","comp":["Jawbone","Garmin","Apple","Xiaomi"],"obst":"Fitbit recalled its entire Force line in 2014 after roughly a million units caused nickel rashes, then watched Apple Watch and 20 dollar Xiaomi bands cut the share price from 47 dollars in 2015 to under 3 dollars by 2019 - the level at which the Google sale was negotiated.","turn":"The June 2015 IPO at 20 dollars a share, which converted a hardware founder's equity into a public stake at the very top of the wearables cycle.","band":"b1","ageb":"a5","y100":2015,"u45":false,"years":19,"vel":6.8,"ageAt100":38,"since100":11},{"id":"RAJESH_VASHIST","n":"Rajesh Vashist","age":68,"city":"Santa Clara","country":"US","state":"CA","region":"bay","nw":0.13,"p":"E","c":0.75,"s":"SiTime DEF 14A filed 15 Apr 2026, ownership as of 30 Mar 2026; SITM close $614.83, 21 Aug 2026","m":"210,696 shares beneficially owned, including family dynasty trusts and 9,208 near-term RSUs, x $614.83 = $130M; a floor, since it excludes a decade of disclosed sales","sect":"tech","origin":"self","co":"SiTime","did":"Took over SiTime as CEO in September 2007 after running Ikanos Communications, and spent eighteen years replacing quartz crystal oscillators with MEMS silicon timing devices; SiTime was sold to MegaChips for $200m in 2014, then spun back out in a November 2019 IPO.","started":2007,"startAge":49,"toFirst100":13,"why":"Quartz oscillators cannot be shrunk, cannot survive shock and vibration and come from a fragile Japanese supply base. Silicon MEMS timing is programmable and made in a standard fab, so one part number replaced hundreds and datacentre and automotive customers got parts quartz vendors could not deliver.","comp":["Seiko Epson","Murata","Kyocera","Nihon Dempa Kogyo"],"obst":"MEMS timing was a twenty-year graveyard of failed startups; SiTime ran out of venture money and had to sell itself to MegaChips in 2014 at $200m, and after the 2019 re-IPO revenue fell by a third in the 2023 inventory correction.","turn":"Winning designed-in timing sockets in AI datacentre switching and optical modules from 2023, where jitter budgets are tight enough that quartz simply fails, which tripled revenue and took the stock past $600.","band":"b1","ageb":"a7","y100":2020,"u45":false,"years":19,"vel":6.8,"ageAt100":62,"since100":6},{"id":"DAVID_BRUTON_SMITH","n":"David Bruton Smith","age":51,"city":"Charlotte","country":"US","state":"NC","region":"se","nw":0.13,"p":"E","c":0.5,"s":"Sonic Automotive 2026 DEF 14A: 1,336,528 Class A shares held personally; SAH closed 77.45 on 21 Aug 2026","m":"1,336,528 personally held Class A shares x 77.45 = 104M; excludes the Sonic Financial Corporation Class B block he shares with his siblings","sect":"retail","origin":"inherited","co":"Sonic Automotive","did":"Son of NASCAR track builder O. Bruton Smith; joined Sonic Automotive in 1995, became chief executive in 2018 and runs about 110 franchised dealerships plus the EchoPark used-car chain and a powersports arm, on roughly 15B of revenue out of Charlotte.","started":1995,"startAge":20,"toFirst100":22,"why":"Franchised dealers hold state-protected territorial rights that manufacturers cannot revoke, which makes the franchise itself a licensed asset. Sonic bet that adding a no-haggle used-car format on top of that protected
