A","region":"bay","nw":0.38,"p":"E","c":0.9,"s":"Netskope Inc. DEF 14A filed 27 May 2026, ownership as of 31 Mar 2026; NTSK close $14.51, 21 Aug 2026","m":"25,850,122 Class B shares beneficially owned - 1,486,408 direct plus 22,288,889 in the 2012 Sanjay Beri and Ava Malla Revocable Trust and related holdings - x $14.51","sect":"tech","origin":"self","co":"Netskope","did":"Co-founded Netskope in October 2012 after eight years running Juniper's access and security unit, building a cloud security broker that inspects traffic to thousands of SaaS applications inline; it listed on Nasdaq in September 2025.","started":2012,"startAge":36,"toFirst100":6,"why":"Netskope built its own private backbone of data centres rather than renting hyperscaler capacity, so inspecting encrypted SaaS traffic did not add the latency that made competitors unusable. Enterprises that had banned cloud apps could finally allow them under policy.","comp":["Zscaler","Palo Alto Networks","Cloudflare","Broadcom Symantec"],"obst":"Netskope stayed private for 13 years and raised over $1.4bn while Zscaler listed in 2018 and compounded a public multiple; Beri had to keep funding a capital-heavy global network through the 2022-2023 growth-software repricing without an exit.","turn":"The 2019-2020 pivot from cloud access security broker to full SASE, bundling secure web gateway and zero-trust network access, which moved Netskope from a point product into the seat that replaces the branch firewall.","band":"b2","ageb":"a5","y100":2018,"u45":false,"years":14,"vel":27.1,"ageAt100":42,"since100":8},{"id":"CRAIG_COURTEMANCHE","n":"Craig Courtemanche","age":58,"city":"Carpinteria","country":"US","state":"CA","region":"socal","nw":0.38,"p":"E","c":0.85,"s":"Procore DEF 14A filed 24 Apr 2026: Craig F. Courtemanche Jr. beneficially owned 6,024,423 shares, 4.0 percent; PCOR closed 63.49 dollars on 21 Aug 2026","m":"Disclosed beneficial ownership including trust holdings times market close, 6,024,423 x 63.49 = 383 million dollars","sect":"tech","origin":"self","co":"Procore Technologies","did":"Founded Procore in 2002 from his Santa Barbara home after building a house and finding project management ran on faxes, sold cloud construction software to general contractors for nearly two decades, and listed it on the NYSE in 2021.","started":2002,"startAge":34,"toFirst100":19,"why":"He priced per project instead of per seat, so a contractor could put every subcontractor, architect and owner on the platform for free. That made the general contractor the distribution channel and turned each project into an unpaid sales motion into the rest of the industry.","comp":["Autodesk Construction Cloud","Oracle Aconex","Trimble","Bluebeam"],"obst":"Nine years of near-zero traction before meaningful venture funding, through a construction depression that killed the customer base after 2008; the company also stayed unprofitable for more than two decades before posting its first GAAP operating profit in 2026.","turn":"Switching from seat-based to unlimited-user project pricing around 2014, which removed the reason contractors kept subcontractors off the system.","band":"b2","ageb":"a6","y100":2021,"u45":false,"years":24,"vel":15.8,"ageAt100":53,"since100":5},{"id":"ANNE_GITTINGER","n":"Anne Gittinger","age":95,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.37,"p":"E","c":0.7,"s":"Nordstrom DEF 14A of 11 Apr 2024: 15,404,953 shares, 9.44 percent; the family and El Puerto de Liverpool took Nordstrom private in 2025 at 24.25 dollars a share","m":"Disclosed beneficial share count times the 2025 take-private price","sect":"retail","origin":"inherited","co":"Nordstrom","did":"Granddaughter of the Swedish immigrant John W. Nordstrom who opened a Seattle shoe shop in 1901, she held one of the two largest family blocks of Nordstrom stock, 9.44 percent, through the chain's expansion from shoes to full-line department stores and its 2025 return to private family control.","started":1971,"startAge":40,"toFirst100":18,"why":"Nordstrom never diluted the founding families and never franchised, so a fixed set of heirs held a fixed share of a chain that compounded for a century on one operating rule: full-price service retail with an unconditional returns policy that made the store, not the brand, the thing customers trusted.","comp":["Macy's","Saks Fifth Avenue","Neiman Marcus","Dillard's","Bloomingdale's"],"obst":"Her holding rode the department-store collapse of the 2010s and 2020s, in which Nordstrom shares fell roughly 80 percent from their 2015 peak and the family had to bid twice, in 2018 unsuccessfully and again in 2024, to buy the company back from public shareholders.","turn":"The December 2024 agreement with El Puerto de Liverpool to take Nordstrom private at 24.25 dollars a share, which crystallised the family blocks at a fixed cash price.","band":"b2","ageb":"a7","y100":1989,"u45":false,"years":55,"vel":6.7,"ageAt100":58,"since100":37},{"id":"STEPHANIE_MCMAHON","n":"Stephanie McMahon","age":49,"city":"Greenwich","country":"US","state":"CT","region":"ne","nw":0.37,"p":"E","c":0.5,"s":"WWE DEF 14A filed 7 April 2023 (ownership as of 15 March 2023) and the September 2023 WWE Endeavor merger, one TKO share per WWE share; TKO close 193.14 dollars, 21 August 2026","m":"WWE proxy: 1,940,190 shares, being 90,797 Class A held directly and 1,849,393 Class B in the 2008 Vincent McMahon irrevocable trust over which she has sole dispositive power. Converted one for one into TKO, 1,940,190 x 193.14 = 374.7 million dollars; marked to 0.37 for possible post 2023 sales.","sect":"media","origin":"mixed","co":"WWE and TKO Group Holdings","did":"Joined WWE in 1998, ran creative from 2002, was chief brand officer from 2013 and became interim then co-chief executive in 2022 after her father resigned over hush money payments, steering the company through the year it agreed to merge with UFC into TKO; her stake sits in a 2008 family trust.","started":1998,"startAge":21,"toFirst100":20,"why":"WWE value was unlocked when the 2018 and 2019 Fox and USA renewals repriced wrestling as live sports inventory at roughly 470 million dollars a year. Because the family held super voting Class B shares placed in trust in 2008, a small economic stake controlled the company later sold to Endeavor.","comp":["All Elite Wrestling","UFC","Impact Wrestling","Netflix"],"obst":"She took the top job in June 2022 in the middle of a federal investigation and board inquiry into her father undisclosed payments, ran the company for six months, and then had him force his way back onto the board in January 2023 to push a sale; she resigned two weeks later.","turn":"The April 2023 agreement to merge WWE with Endeavor UFC into TKO, which converted the family control stake into liquid shares of a 36 billion dollar sports company.","band":"b2","ageb":"a5","y100":2018,"u45":false,"years":28,"vel":13.2,"ageAt100":41,"since100":8},{"id":"LEE_ROY_MITCHELL","n":"Lee Roy Mitchell","age":89,"city":"Plano","country":"US","state":"TX","region":"tx","nw":0.37,"p":"E","c":0.65,"s":"Cinemark Holdings DEF 14A filed 1 Apr 2026 citing Schedule 13G of 13 Aug 2025: Lee Roy Mitchell and affiliated entities 10,144,031 shares, 8.7 percent","m":"10,144,031 shares held with Button Tree Investments LLC and the Mitchell Special Trust II times the 36.60 dollar CNK close of 21 Aug 2026 = 371 million dollars; counts the disclosed Cinemark position only","sect":"media","origin":"self","co":"Cinemark Holdings","did":"Founded Cinemark in 1984 and built it to roughly 500 theatres and 5,800 screens, deliberately siting multiplexes in small and mid-size American cities the national chains skipped, then taking the same format to Brazil, Chile and Argentina from 1993.","started":1984,"startAge":47,"toFirst100":14,"why":"Screen economics are set by rent and construction cost per seat, not by ticket price. Building in secondary US markets and then in Latin America gave Cinemark the lowest occupancy cost per screen of any major circuit, which is why it stayed solvent through two industry-wide bankruptcies that took its rivals.","comp":["AMC Entertainment","Regal Cinemas","Carmike Cinemas","Loews Cineplex"],"obst":"The 2000-2002 exhibition bust put Loews, United Artists, Carmike, General Cinema and Regal into Chapter 11 as overbuilt stadium-seating megaplexes cannibalised older screens; Cinemark was the only large US chain to come through without a bankruptcy filing, and repeated that in 2020-2022 when Cineworld's Regal failed.","turn":"The 1993 entry into Chile, the start of a Latin American circuit that by 2019 was roughly 200 theatres and a currency-diversified profit stream no US rival had.","band":"b2","ageb":"a7","y100":1998,"u45":false,"years":42,"vel":8.8,"ageAt100":61,"since100":28},{"id":"MIKE_KARANIKOLAS","n":"Mike Karanikolas","age":47,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.36,"p":"E","c":0.75,"s":"Revolve Group DEF 14A filed 24 Apr 2026; RVLV close of 23.76 dollars on 21 Aug 2026","m":"MMMK Development holds 30,107,847 Class B shares and he and Mente are its only two stockholders; half of that plus his 123,000 Class A shares at 23.76 dollars equals 361 million dollars","sect":"retail","origin":"self","co":"Revolve Group","did":"Co-founded the online fashion retailer Revolve in a Los Angeles apartment in 2003 with Michael Mente, writing the merchandising, pricing and returns software himself, and took it to roughly 1.1 billion dollars of net sales and a June 2019 IPO while the two of them still held about 88 percent of the voting power.","started":2003,"startAge":24,"toFirst100":13,"why":"He built the buying system instead of buying it. Revolve reads sell-through and return reasons at SKU level daily, so it orders shallow and reorders fast, which is why it holds full-price margin in a category where Shopbop and Farfetch discount their way through every season.","comp":["Shopbop","Net-a-Porter","Farfetch","Nordstrom"],"obst":"They raised almost no outside capital, so a credit line pulled in 2008 nearly ended the company; and from 2022 the aspirational-luxury slowdown cut Revolve's share price roughly 80 percent from its peak while they held the stock.","turn":"The 2015 decision to move the marketing budget almost entirely into paying influencers in product and travel, starting with the first Revolve Festival at Coachella.","band":"b2","ageb":"a5","y100":2016,"u45":false,"years":23,"vel":15.7,"ageAt100":37,"since100":10},{"id":"MICHAEL_MENTE","n":"Michael Mente","age":45,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.36,"p":"E","c":0.75,"s":"Revolve Group DEF 14A filed 24 Apr 2026; RVLV close of 23.76 dollars on 21 Aug 2026","m":"Half of MMMK Development's 30,107,847 Class B shares, which he and Karanikolas jointly and solely own, plus his 35,331 direct Class B and 73,000 Class A shares, at 23.76 dollars equals 360 million dollars","sect":"retail","origin":"self","co":"Revolve Group","did":"Co-founded Revolve with Mike Karanikolas in 2003, running buying and brand while Karanikolas built the systems; he added the luxury site FWRD in 2018, took the company public in June 2019 at 18 dollars a share, and still owns half of MMMK Development, which holds nearly all of Revolve's Class B stock.","started":2003,"startAge":22,"toFirst100":13,"why":"Revolve stocked hundreds of small emerging labels rather than a few large ones, so no single brand could dictate terms or undercut it elsewhere. Owning the assortment rather than licensing a marketplace is what made the influencer spend actually convert into orders.","comp":["Shopbop","Net-a-Porter","Farfetch","Nordstrom"],"obst":"Revolve began by clearing other retailers' surplus inventory and had to spend years convincing designers it was not a discounter; the 2022 to 2024 downturn then cut growth to near zero and the share price by about 80 percent.","turn":"The June 2019 IPO, which closed its first day up 89 percent and marked the founders' stake in the billions without either of them having sold control.","band":"b2","ageb":"a5","y100":2016,"u45":false,"years":23,"vel":15.7,"ageAt100":35,"since100":10},{"id":"ILAN_TWIG","n":"Ilan Twig","age":52,"city":"Palo Alto","country":"US","state":"CA","region":"bay","nw":0.36,"p":"E","c":0.7,"s":"Navan DEF 14A filed 2026-05-12, ownership as of 2026-03-31 and director age table; NAVN close $29.16 on 2026-08-21","m":"12,920,326 shares on an as-exchanged Class B basis x $29.16 = $377M, less roughly $12M of exercise cost on the 2,989,136 option and RSU shares included","sect":"tech","origin":"self","co":"Navan","did":"Co-founded TripActions in February 2015 as CTO after leading engineering at RockMelt and co-founding StreamOnce, sold to Jive Software in 2013; built the search and booking engine that indexes GDS, direct hotel and low-cost carrier inventory in one place, and ran engineering through the October 2025 IPO.","started":2015,"startAge":41,"toFirst100":4,"why":"Business travel content sat in incompatible silos, so agencies competed on contracts rather than product; a single index that could return a policy-compliant fare in one search is what let the company sell control to CFOs instead of negotiating agency margin.","comp":["SAP Concur","American Express Global Business Travel","Egencia","Ramp"],"obst":"GDS content agreements restricted what a startup could display, so the engine had to be built against direct supplier connections and NDC at a time when airlines were still refusing to open them.","turn":"The 2023 rebrand to Navan, which repositioned a travel booking engine as a travel-and-expense spend platform and set up the 2025 Nasdaq listing.","band":"b2","ageb":"a5","y100":2019,"u45":false,"years":11,"vel":32.7,"ageAt100":45,"since100":7},{"id":"KISHORE_SEENDRIPU","n":"Kishore Seendripu","age":56,"city":"Carlsbad","country":"US","state":"CA","region":"socal","nw":0.36,"p":"E","c":0.85,"s":"MaxLinear DEF 14A filed 2 Apr 2026: Seendripu beneficially owned 5,434,243 shares as of 23 Mar 2026, 6.0 percent; MXL closed 66.61 dollars on 21 Aug 2026 (stockanalysis.com)","m":"Beneficial ownership times market close: 5,434,243 x 66.61 = 362 million dollars. Includes 370,061 common, 296,084 options, 66,200 RSUs and 604,899 deferred vested units per proxy footnote 1.","sect":"tech","origin":"self","co":"MaxLinear","did":"Co-founded MaxLinear in September 2003 in Carlsbad to build television and broadband tuners in plain CMOS instead of the discrete can tuners then standard, took it public in 2010, and bought Entropic in 2015, Exar in 2017 and Intel's home gateway chip line in 2020.","started":2003,"startAge":33,"toFirst100":14,"why":"Nobody believed a sensitive RF tuner could work in a standard digital CMOS process. Doing it there meant the tuner and demodulator collapsed onto one die and the price fell with every node shrink, while incumbents were stuck selling multi-chip modules built on specialty processes.","comp":["Broadcom","Silicon Labs","Entropic Communications","Intel"],"obst":"The 3.8 billion dollar Silicon Motion acquisition collapsed in July 2023 when Chinese regulatory clearance never arrived and MaxLinear walked, drawing an arbitration claim; revenue then fell from 1.12 billion in 2022 to 361 million in 2024 as broadband customers unwound inventory.","turn":"The 2020 purchase of Intel's Home Gateway Platform Division for about 150 million dollars, which turned a tuner-chip supplier into a full broadband gateway system-on-chip vendor.","band":"b2","ageb":"a6","y100":2017,"u45":false,"years":23,"vel":15.7,"ageAt100":47,"since100":9},{"id":"ROBERT_INGLE_II","n":"Robert P. Ingle II","age":64,"city":"Asheville","country":"US","state":"NC","region":"se","nw":0.36,"p":"E","c":0.6,"s":"Ingles Markets 2025 DEF 14A: 4,278,134 shares, 96.1 percent of Class B and 72.5 percent of total voting power; IMKTA closed 84.94 on 21 Aug 2026","m":"4,278,134 shares convertible one-for-one into Class A x 84.94 = 363M","sect":"retail","origin":"inherited","co":"Ingles Markets","did":"Runs Ingles Markets, the Asheville grocery chain his father Robert Ingle founded in 1963; became chairman and chief executive after his father's death in 2011 and holds 96 percent of the Class B stock, controlling a 5.4B-revenue chain of about 200 supermarkets across the southern Appalachians.","started":1990,"startAge":28,"toFirst100":21,"why":"Ingles owns nearly all its stores and most of the shopping centres around them, plus its own milk plant and fuel stations. In small Appalachian towns there is room for one supermarket, so owning the real estate keeps a national chain from opening across the street.","comp":["Kroger","Publix","Food Lion","Walmart Neighborhood Market"],"obst":"Hurricane Helene devastated western North Carolina in September 2024, flooding stores and the company's Black Mountain headquarters and distribution centre; the chain also carries heavy real-estate debt that public-market investors persistently discount.","turn":"2011, when his father died and he inherited both the Class B control block and a chain that had just finished a decade of rebuilding its stores.","band":"b2","ageb":"a6","y100":2011,"u45":false,"years":36,"vel":10,"ageAt100":49,"since100":15},{"id":"KATY_PERRY","n":"Katy Perry","age":41,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.36,"p":"R","c":0.85,"s":"Forbes profile figure of 360 million dollars, published 3 June 2025","m":"Forbes published figure; anchored on the roughly 225 million dollar September 2023 catalogue sale to Litmus Music plus American Idol earnings","sect":"media","origin":"self","co":"Katy Perry music catalogue","did":"Sold her master recording and publishing rights in five albums to Litmus Music, backed by Carlyle, for about 225 million dollars in September 2023, after earning roughly 25 million a year as an American Idol judge and launching the non-alcoholic aperitif brand De Soi.","started":2007,"startAge":22,"toFirst100":5,"why":"Streaming turned back-catalogue pop into a bond-like annuity with observable cash flows, so private-credit buyers would pay 20-plus times annual royalties in 2023. Selling at that multiple converted a decaying royalty stream into principal at the top of the rate cycle.","comp":["Lady Gaga","Rihanna","Taylor Swift","Justin Bieber catalogue sale"],"obst":"Dropped by two labels before her first hit and spent years writing for other artists; she later spent nearly a decade in litigation over Dark Horse, losing a 2.8 million dollar jury verdict in 2019 before it was overturned on appeal.","turn":"The September 2023 Litmus deal, which crystallised two decades of royalties into cash before streaming multiples compressed.","band":"b2","ageb":"a4","y100":2012,"u45":true,"years":19,"vel":18.9,"ageAt100":27,"since100":14},{"id":"TONI_KO","n":"Toni Ko","age":53,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.36,"p":"R","c":0.8,"s":"Forbes profile figure of 355 million dollars, published 3 June 2025","m":"Forbes published figure; traces to the 500 million dollar 2014 L Oreal purchase of NYX, which she owned outright, plus later real-estate holdings","sect":"consumer","origin":"self","co":"NYX Cosmetics","did":"Emigrated from Korea at 13, worked in her parents beauty-supply stores, and at 25 launched NYX Cosmetics in 1999 with 250,000 dollars from her family, selling 1.99 dollar eye and lip pencils; L Oreal bought the company for about 500 million dollars in 2014.","started":1999,"startAge":26,"toFirst100":15,"why":"She sold through beauty-supply wholesalers rather than department stores, so NYX reached the same shopper as prestige brands at a tenth of the price with no counter staff, no gift-with-purchase and no advertising. She took no outside investment, so the whole exit was hers.","comp":["e.l.f. Beauty","Wet n Wild","Milani","Maybelline"],"obst":"She built the company without venture capital or a bank line while competing against Loreal and Coty budgets; her later venture Perverse Sunglasses failed, and she restarted with Bespoke Beauty Brands in 2019.","turn":"YouTube beauty tutorials from around 2010 recommending NYX as the dupe for prestige products, which created national demand her wholesale channel could suddenly fill.","band":"b2","ageb":"a5","y100":2014,"u45":false,"years":27,"vel":13.3,"ageAt100":41,"since100":12},{"id":"HELMY_ELTOUKHY","n":"Helmy Eltoukhy","age":47,"city":"Palo Alto","country":"US","state":"CA","region":"bay","nw":0.35,"p":"E","c":0.85,"s":"SEC Form 4 filed 12 Aug 2026: 1,995,934 shares in his revocable trust plus 35,000 in the Eltoukhy Foundation; GH closed at $170.69 on 21 Aug 2026","m":"2,030,934 shares x $170.69 = $347M","sect":"health","origin":"self","co":"Guardant Health","did":"Sold his first sequencing company Avantome to Illumina in 2008, then co-founded Guardant Health in 2013 with AmirAli Talasaz to detect cancer from a blood draw rather than a tissue biopsy; the two run it as co-CEOs.","started":2013,"startAge":34,"toFirst100":5,"why":"Liquid biopsy only works if you can find one tumour molecule among tens of thousands of normal ones. Guardant built the error-correction chemistry first and then spent years accumulating the outcome data that payers require, so reimbursement became the moat rather than the assay.","comp":["Foundation Medicine","Natera","Exact Sciences","Illumina Grail"],"obst":"Medicare coverage arrived only after years of evidence generation, Guardant lost a patent fight with Foundation Medicine, and its share price fell roughly 80% from the 2021 peak while the company burned cash proving its Shield colorectal screening test.","turn":"FDA approval of Shield in July 2024 as the first blood test for primary colorectal cancer screening, which moved Guardant from treatment selection into population screening.","band":"b2","ageb":"a5","y100":2018,"u45":false,"years":13,"vel":26.9,"ageAt100":39,"since100":8},{"id":"JOSEPH_BELANO nd the brand crossed from health-food stores into drug chains before any mass competitor had a natural line.","comp":["Johnson and Johnson","Unilever","Tom's of Maine","Kiehl's","The Body Shop"],"obst":"She and Shavitz built the company with no capital while living without electricity, and their partnership ended in a bitter split in which Shavitz was bought out for a fraction of the eventual value, a rupture she has spent decades being asked about.","turn":"The 1993 move of the company from Maine to North Carolina to get near contract manufacturing, which let Burt's Bees scale from a craft operation into a national brand.","band":"b2","ageb":"a7","y100":2004,"u45":false,"years":42,"vel":8.3,"ageAt100":54,"since100":22},{"id":"NAT_TURNER","n":"Nat Turner","age":40,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.35,"p":"E","c":0.5,"s":"Forbes (Nov 2018) reported Turner and Weinberg each netted about $250M from Roche's $1.9B purchase of Flatiron Health in Feb 2018","m":"Reported $250M of deal proceeds plus his equity in Collectors, taken private at $850M in 2021, and the Operator Partners fund","sect":"health","origin":"self","co":"Flatiron Health and Collectors","did":"Sold his first company, ad-targeting startup Invite Media, to Google for $81M in 2010 at 25; founded Flatiron Health in 2012 with Zach Weinberg after a cousin's leukaemia diagnosis and sold it to Roche for $1.9B in 2018; then led the $850M buyout of Collectors, owner of PSA grading.","started":2012,"startAge":26,"toFirst100":6,"why":"About 96% of US cancer patients are treated outside academic trials, so their outcomes existed only as free text in clinic notes. Flatiron paid trained nurses to abstract those notes into structured records, then sold the evidence to drug makers who needed control arms the FDA would accept.","comp":["IQVIA","Tempus","COTA Healthcare","Syapse","Cerner"],"obst":"Building the dataset meant buying and operating an actual electronic health record business - rt. Mallick's operations work made redundancy-and-repair routing and the custom packaging, power and cooling manufacturable at TSMC, turning a physics demo into a product with a delivery schedule.","comp":["Nvidia","Groq","SambaNova Systems","Graphcore"],"obst":"Cerebras filed to go public in September 2024 and then sat for 20 months, hostage to a single customer, G42 of Abu Dhabi, and a CFIUS review of that relationship, before the S-1 was refreshed and the IPO finally priced at $185 in May 2026.","turn":"The December 2025 master relationship agreement with OpenAI, including a $1bn working capital loan and a warrant, which replaced G42 concentration with an anchor inference customer and unlocked the listing.","band":"b2","ageb":"a5","y100":2026,"u45":false,"years":8,"vel":43.8,"ageAt100":54,"since100":0},{"id":"BOB_SIMPSON","n":"Bob Simpson","age":78,"city":"Fort Worth","country":"US","state":"TX","region":"tx","nw":0.35,"p":"E","c":0.55,"s":"SEC Schedule 13D/A of 4 Jun 2026 and Form 4 of 13 Aug 2026: 9,500,000 TXO Partners units, 16.2 percent of class, bought around 14.32 dollars","m":"Disclosed unit count times filed price = 136 million dollars in TXO, plus SEC-reported royalty trust holdings and a minority interest in the Texas Rangers","sect":"energy","origin":"self","co":"XTO Energy","started":1986,"startAge":38,"toFirst100":10,"did":"Cofounded Cross Timbers Oil in Fort Worth in 1986 to buy mature producing properties nobody wanted, renamed it XTO Energy and sold it to ExxonMobil in 2010 in an all-stock deal worth about 41 billion dollars; he then bought into the Texas Rangers and founded TXO Partners, which listed in 2023.","why":"XTO bought proved developed reserves at a discount to their PV-10 during gas price troughs and hedged the production forward, so the arithmetic worked without exploration risk. When shale gas made Exxon want US onshore scale quickly, buying XTO was faster than drilling it.","comp":["Chesapeake Energy","Devon Energy","Burlington Reso n entirely. A brand with no distribution partner and no ad budget showed e.l.f. margins no conventional beauty startup could match.","comp":["Rare Beauty","Kylie Cosmetics","Glossier","Summer Fridays"],"obst":"She launched into a celebrity-beauty field already littered with failures such as KKW Beauty and Item Beauty, and was sued in 2022 by the founders of the fashion label Rhode over the name; a judge denied their injunction and the case later settled.","turn":"The June 2022 launch of the peptide lip treatment, which drew a waitlist in the hundreds of thousands and sold out repeatedly, making scarcity the entire marketing model.","band":"b2","ageb":"a1","y100":2025,"u45":true,"years":4,"vel":75,"ageAt100":28,"since100":1},{"id":"MARK_DONEGAN","n":"Mark Donegan","age":69,"city":"Portland","country":"US","state":"OR","region":"pnw","nw":0.3,"p":"E","c":0.7,"s":"SEC Forms 4, CIK 1236787, 2003-2014; Precision Castparts DEFM14A filed 2015-10-13, merger consideration and golden-parachute tables","m":"224.2M dollars of open-market Form 4 sales 2003-2014 plus 53.2M dollars of shares and 93.0M dollars of options, deferred comp and change-of-control pay at Berkshire's 235 dollar per share close, less roughly 30 percent tax","sect":"industry","origin":"self","co":"Precision Castparts","did":"Ran Precision Castparts as CEO from 2002, buying Special Metals, Titanium Metals and Rolls-Royce parts plants until it was the qualified supplier of forged jet-engine discs, blades and airframe fasteners, then sold it to Berkshire Hathaway in January 2016 at 235 dollars a share, about 37 billion dollars.","started":2002,"startAge":45,"toFirst100":8,"why":"Aerospace castings are qualified part by part by the FAA and the engine makers, so once a foundry is named on a GE or Boeing drawing, switching suppliers takes years. Donegan bought the qualified capacity instead of competing on price, then priced to the switching cost.","comp":["Alcoa and Howmet Aerospace","Carpenter Technology","Alleg he deal closed in October and locked in the value the stock had already given back.","band":"b2","ageb":"a5","y100":2013,"u45":false,"years":17,"vel":17.6,"ageAt100":40,"since100":13},{"id":"WILLIAM_MARSHALL","n":"Will Marshall","age":47,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.3,"p":"E","c":0.8,"s":"Planet Labs DEF 14A filed 27 May 2026 (ownership as of 15 May 2026); PL close 22.29 on 21 Aug 2026","m":"12,561,847 shares held (814,949 Class A plus 11,746,898 Class B) times the PL close of 22.29 on 21 Aug 2026, excluding 4,488,288 exercisable options","sect":"tech","origin":"self","co":"Planet Labs","did":"Left NASA Ames in 2010 with Robbie Schingler and Chris Boshuizen to build Earth-imaging satellites out of consumer phone parts, shrinking a 300M dollar imaging spacecraft to a 5kg Dove; Planet now photographs the whole landmass daily and listed via SPAC in December 2021.","started":2010,"startAge":31,"toFirst100":11,"why":"Rivals built one exquisite satellite that could see anywhere occasionally. Planet built hundreds of cheap ones that see everywhere every day, so the product is a time series rather than a photograph - and a time series sells as a subscription to agriculture, insurance and defence.","comp":["Maxar","Airbus Defence and Space","BlackSky","Satellogic"],"obst":"Planet lost 26 satellites in the Antares launch explosion of October 2014 and eight more in the Falcon 9 failure of June 2015, and had to convince customers that a constellation model is precisely one in which individual losses do not matter.","turn":"The December 2021 SPAC merger with dMY Technology IV, which put roughly 590M dollars on the balance sheet and made an eleven-year-old founder stake marketable.","band":"b2","ageb":"a5","y100":2021,"u45":false,"years":16,"vel":18.8,"ageAt100":42,"since100":5},{"id":"JIMMY_DONALDSON","n":"Jimmy Donaldson","age":28,"city":"Greenville","country":"US","state":"NC","region":"se","nw":0.3,"p":"R","c":0.8,"s":"Forbes 2026 T n with Lyric Capital against his catalogue while retiring the stage name.","started":2010,"startAge":20,"toFirst100":5,"why":"He built demand anonymously before any label was involved, so he signed from a position where he could keep masters and imprint control. Financing the catalogue with convertible debt instead of selling it kept the upside while extracting the cash a sale would have paid.","comp":["Drake","Frank Ocean","Post Malone","Bruno Mars"],"obst":"He was homeless in Toronto at 17 and released the first mixtapes with no name attached and no industry contacts; he later boycotted the Grammys entirely in 2021 after After Hours was shut out of nominations.","turn":"The 2015 crossover of Cant Feel My Face and The Hills, which moved him from an alternative-R and B cult act to a mainstream pop asset with catalogue value.","band":"b2","ageb":"a3","y100":2015,"u45":true,"years":16,"vel":18.8,"ageAt100":25,"since100":11},{"id":"MILAN_GALIK","n":"Milan Galik","age":59,"city":"Greenwich","country":"US","state":"CT","region":"ne","nw":0.29,"p":"E","c":0.6,"s":"Interactive Brokers Group DEF 14A filed 11 March 2026 and Form 10-K filed 27 February 2026 (age 59); IBKR close 93.87 dollars, 21 August 2026","m":"Proxy ownership table: 2,730,868 shares (2,188,242 held plus 542,626 vesting), 0.61 percent of Class A. 2,730,868 x 93.87 = 256.3 million dollars. Proxy also attributes 5.64 million dollars of 2025 entity taxes to his retained IBG Holdings units, so rounded to 0.29.","sect":"finance","origin":"self","co":"Interactive Brokers Group","did":"Joined Interactive Brokers in 1990 as a software developer straight out of the Technical University of Budapest, wrote much of the order routing and risk code, became president in 2014 and chief executive in 2019, and now runs a broker with more than 4 million accounts and 60 billion dollars of equity capital.","started":1990,"startAge":23,"toFirst100":24,"why":"Interactive Brokers automated work rivals staffed with people, so accounts grew roughly tenfold while headcount barely moved and pretax margin sat near 75 percent. The engineers who built that automation were paid in IBG Holdings units, so the code writers, not the salespeople, took the equity.","comp":["Charles Schwab","Robinhood","Fidelity","E*Trade","Tastytrade"],"obst":"The options market making arm that had funded the firm was being destroyed by penny quoting and high frequency competition through 2012 to 2017; he had to shut the market maker that was the company original business and bet everything on the lower margin brokerage.","turn":"The 2017 exit from options market making, after which brokerage account growth compounded above 20 percent a year and the share price rose about eightfold.","band":"b2","ageb":"a6","y100":2014,"u45":false,"years":36,"vel":8.1,"ageAt100":47,"since100":12},{"id":"JESSICA_ICLISOY","n":"Jessica Iclisoy","age":60,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.29,"p":"I","c":0.5,"s":"Forbes America's Richest Self-Made Women 2021, rank 91, the last edition in which she was ranked","m":"Dated Forbes list figure for a wholly owned private company; carried forward unchanged because California Baby has neither raised outside capital nor been sold since","sect":"consumer","origin":"self","co":"California Baby","did":"Started making shampoo in her Los Angeles kitchen in 1995 after reading the ingredient label on her infant son's bath products, built California Baby into a natural baby-care line sold through Whole Foods and Target, and still owns it outright including its own Los Angeles manufacturing plant.","started":1995,"startAge":29,"toFirst100":18,"why":"She took no outside capital and built her own factory, so she controlled formulation and could certify claims contract manufacturers could not. That made California Baby the default paediatrician and eczema-forum recommendation years before mass brands had a clean-label answer.","comp":["Johnson & Johnson","Burt's Bees","Aveeno ore, the stock fell under $12, and the family had to come back seven years later and buy the same company at half its own rejected price.","turn":"December 23, 2024, when the independent committee accepted $24.25 and the Liverpool partnership, ending 53 years of Nordstrom as a public company.","band":"b2","ageb":"a6","y100":2001,"u45":false,"years":26,"vel":11.2,"ageAt100":37,"since100":25},{"id":"JURE_SOLA","n":"Jure Sola","age":75,"city":"San Jose","country":"US","state":"CA","region":"bay","nw":0.29,"p":"E","c":0.85,"s":"Sanmina DEF 14A filed 23 Jan 2026, ownership as of 31 Dec 2025; SANM implied price $188.81 from $10.12bn market cap on 53.60m shares, 21 Aug 2026","m":"1,533,369 shares beneficially owned, including 212,870 in the Sola Family Trust, x $188.81 = $289M, plus a $12.9M non-qualified deferred compensation balance disclosed in the same proxy","sect":"industry","origin":"self","co":"Sanmina","did":"Co-founded Sanmina in San Jose in 1980 as a printed circuit board shop and built it into a contract manufacturer with 35,000 employees in 20 countries and $8.1bn of fiscal 2025 revenue; he was CEO 1991-2017 and returned as chairman and CEO in August 2020.","started":1980,"startAge":29,"toFirst100":17,"why":"Sanmina kept the vertically integrated pieces - backplanes, cables, enclosures, PCB fabrication - that every other contract manufacturer outsourced to chase asset-light margins. When supply chains broke in 2020-2022, owning those steps let Sanmina quote lead times rivals could not.","comp":["Flex","Jabil","Celestica","Benchmark Electronics"],"obst":"The $6bn all-stock merger with SCI Systems in December 2001 doubled the company straight into the telecom equipment collapse; Sanmina spent years closing plants and writing down goodwill, and the shares never regained their 2000 peak until the AI infrastructure cycle.","turn":"The 2020 return to the CEO chair, which reoriented Sanmina toward cloud and AI infrastructure, medical and defence work and took non-GAA ton in 2012 with Matt Kalish and Paul Liberman out of a Vistaprint cubicle, built daily fantasy sports into a mass product, took the company public via SPAC in 2020 and turned it into the second-largest US sportsbook after the Supreme Court struck down the federal betting ban.","started":2012,"startAge":31,"toFirst100":5,"why":"Daily fantasy was legal under a 2006 carve-out for games of skill, so DraftKings spent six years acquiring a database of millions of verified, funded, sports-betting-inclined accounts while sportsbooks were illegal. When Murphy legalised betting in 2018, it converted that file rather than starting from zero.","comp":["FanDuel","BetMGM","Caesars","ESPN Bet","Fanatics"],"obst":"New York's attorney general declared daily fantasy illegal gambling in 2015 and other states followed, nearly killing the company; a proposed 2016 merger with FanDuel was blocked by the FTC in 2017, and DraftKings has burned billions on customer acquisition without consistent profitability.","turn":"The Supreme Court's May 2018 Murphy v NCAA decision striking down PASPA, which turned DraftKings' fantasy user file into a sportsbook customer list overnight.","band":"b2","ageb":"a5","y100":2017,"u45":false,"years":14,"vel":20,"ageAt100":36,"since100":9},{"id":"SPENCER_KIRK","n":"Spencer Kirk","age":66,"city":"Salt Lake City","country":"US","state":"UT","region":"mtn","nw":0.28,"p":"E","c":0.4,"s":"Extra Space Storage DEF 14A, April 2026: 874,197 shares, worth $128M at the $146.81 close of 21 Aug 2026, plus the 1995 sale of Megahertz to U.S. Robotics","m":"Disclosed EXR share count times fetched price, plus an inferred residual from the Megahertz stock merger; deliberately conservative","sect":"realestate","origin":"self","co":"Megahertz Corporation / Extra Space Storage","did":"Co-founded Megahertz Corporation in Utah in 1985, the maker of the PCMCIA modems that first put laptops online, and sold it to U.S. Robotics in 1995. He then backed Extra Space Storage and ran it as chief executive from 2009 to 2017, taking a regional operator into the second-largest US self-storage REIT.","started":1985,"startAge":25,"toFirst100":10,"why":"Self-storage rents reset monthly, so a national operator can push rates on sitting tenants faster than inflation because moving out costs more than the increase. Extra Space grew mostly by managing other owners buildings for a fee, taking scale and acquisition rights without putting up capital.","comp":["Public Storage","CubeSmart","Life Storage","U-Haul"],"obst":"Megahertz shipped into a modem market where speeds doubled annually and inventory went obsolete in months. Extra Space then took heavy leverage buying Storage USA's portfolio in 2005 and had to carry that debt through the 2008 credit freeze.","turn":"The 2009 launch of the third-party management platform, which let Extra Space add scale without buying the buildings.","band":"b2","ageb":"a7","y100":1995,"u45":false,"years":41,"vel":6.8,"ageAt100":35,"since100":31},{"id":"AMBER_VENZ_BOX","n":"Amber Venz Box","age":39,"city":"Dallas","country":"US","state":"TX","region":"tx","nw":0.28,"p":"I","c":0.55,"s":"Forbes, 22 Nov 2021: 315 million dollars, her stake at the 2 billion dollar valuation set by SoftBank Vision Fund's 300 million dollar investment; her age given as 34 in the same piece","m":"Forbes stake-times-valuation figure of 315 million, marked down about 10 percent for the compression in 2021-vintage private growth valuations since; no newer round has been disclosed","sect":"tech","origin":"self","co":"LTK","did":"A Dallas personal shopper and fashion blogger, she and Baxter Box built rewardStyle in 2011 to pay bloggers commission when readers bought through their links, launched LIKEtoKNOW.it in 2014 so a screenshot of an Instagram photo returned shoppable links, and rebranded the whole thing LTK in 2021.","started":2011,"startAge":24,"toFirst100":8,"why":"She solved attribution, not content. rewardStyle sat between dozens of retailer affiliate feeds and the creators, took a cut from both sides and kept the purchase data, so brands had to come through LTK to learn which creators actually sold. Instagram banning outbound links made her screenshot hack the only route.","comp":["ShopStyle Collective","Amazon Influencer Program","MagicLinks","ShareASale"],"obst":"For the first years retailers would not pay commission on blogger traffic at all and she signed them one contract at a time; then from 2021 Instagram and TikTok shipped native affiliate and checkout tools aimed straight at LTK's reason to exist, forcing a rebuild from link plumbing into a standalone shopping app.","turn":"The 2014 launch of LIKEtoKNOW.it, which turned an email-receipt hack around Instagram's no-links policy into a consumer product with millions of users.","band":"b2","ageb":"a3","y100":2019,"u45":true,"years":15,"vel":18.7,"ageAt100":32,"since100":7},{"id":"BRIAN_LANE","n":"Brian Lane","age":69,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.28,"p":"E","c":0.6,"s":"Comfort Systems USA DEF 14A filed 9 Apr 2026 (ownership as of 1 Mar 2026); NYSE close 21 Aug 2026","m":"171,523 shares x $1,655.61 close = $284M; holdings basis, excludes proceeds of prior sales","sect":"industry","origin":"self","co":"Comfort Systems USA","did":"Joined Comfort Systems USA in Houston in October 2003 as a regional vice president and has been chief executive since December 2011; turned a roll-up of local mechanical contractors into the main builder of the cooling and electrical plant inside US chip fabs and data centres.","started":2003,"startAge":46,"toFirst100":21,"why":"Comfort Systems kept its acquired contractors as independent local operators with their own customer relationships while centralising bonding, insurance and capital. That let it staff several billion-dollar fab and data-centre jobs at once, a scale no single regional mechanical contractor could match.","comp":["EMCOR Group","APi Group","Limbach Holdings"],"obst":"Lane took over in 2011 with the company still shrinking from the commercial construction bust; he sold off underperforming operating units and rebuilt around industrial and technology customers rather than office buildings.","turn":"The 2019 acquisition of Walker Engineering, which took Comfort Systems into large-scale electrical work and opened the semiconductor fab and hyperscale data-centre projects that drove the share price past $1,000.","band":"b2","ageb":"a7","y100":2024,"u45":false,"years":23,"vel":12.2,"ageAt100":67,"since100":2},{"id":"OGUZHAN_ATAY","n":"Oguzhan Atay","age":38,"city":"Menlo Park","country":"US","state":"CA","region":"bay","nw":0.28,"p":"E","c":0.75,"s":"BillionToOne DEF 14A filed 2026-04-21, ownership as of 2026-03-31; age from the 424B4 prospectus of 2025-11-06; BLLN close $95.03 on 2026-08-21","m":"2,227,542 Class B shares plus 765,387 exercisable options x $95.03 = $284M, less a small option exercise cost; the 200,000 spouse shares he disclaims are excluded","sect":"health","origin":"self","co":"BillionToOne","did":"Co-founded BillionToOne in 2016 out of a Stanford biology PhD and built quantitative counting, which tags each DNA template with a unique molecular identifier so a blood draw can count single-gene disorders; launched the UNITY prenatal screen and listed on Nasdaq in November 2025.","started":2016,"startAge":28,"toFirst100":9,"why":"Existing prenatal screening could only detect whole-chromosome dosage, so single-gene conditions like sickle cell and cystic fibrosis needed a separate paternal sample; counting molecules rather than reading ratios opened a reimbursed category with no direct rival, billed through the companys own CLIA lab.","comp":["Natera","Illumina","Labcorp","Quest Diagnostics","Myriad Genetics"],"obst":"US life-science funds passed on the single-gene claim, so early money came from Hummingbird in Europe; the company then had to build its own CLIA lab and win payer coverage indication by indication before it had meaningful revenue.","turn":"The November 2025 Nasdaq IPO, which repriced a privately held diagnostics lab into a multi-billion-dollar public company and marked the founders stakes.","band":"b2","ageb":"a3","y100":2025,"u45":true,"years":10,"vel":28,"ageAt100":37,"since100":1},{"id":"DAVID_TSAO","n":"David Tsao","age":37,"city":"Menlo Park","country":"US","state":"CA","region":"bay","nw":0.28,"p":"E","c":0.75,"s":"BillionToOne DEF 14A filed 2026-04-21, ownership as of 2026-03-31; age from the 424B4 prospectus of 2025-11-06; BLLN close $95.03 on 2026-08-21","m":"2,325,108 Class B shares plus 1,000 Class A and 702,693 exercisable options x $95.03 = $288M, less a small option exercise cost","sect":"health","origin":"self","co":"BillionToOne","did":"Co-founded BillionToOne with Oguzhan Atay in 2016 after a Stanford PhD and serves as President and Chief Technology Officer, building the assay chemistry and bioinformatics behind the UNITY prenatal screen and the Northstar oncology line on the same molecular counting platform.","started":2016,"startAge":27,"toFirst100":9,"why":"Keeping probes, chemistry, bioinformatics and the CLIA lab in-house meant every new indication reused one validated platform instead of paying a sequencing vendor per run, so gross margin improved with each product rather than being capped by a licensed instrument.","comp":["Natera","Invitae","Labcorp","Guardant Health"],"obst":"The counting claim had to be validated head to head against Nateras entrenched Panorama test in payer-facing studies before any insurer would cover UNITY, which meant years of clinical spend with no reimbursement.","turn":"Winning broad commercial payer coverage for UNITY, which converted a validated assay into billable volume and made the 2025 IPO possible.","band":"b2","ageb":"a3","y100":2025,"u45":true,"years":10,"vel":28,"ageAt100":36,"since100":1},{"id":"RICH_FRANK","n":"Rich Frank","age":83,"city":"Calistoga","country":"US","state":"CA","region":"bay","nw":0.28,"p":"E","c":0.6,"s":"Variety, Napa Valley Register and Arnold & Porter deal announcement on the $315M Treasury Wine Estates purchase of Frank Family Vineyards, closed 13 Dec 2021 (he was 78)","m":"$315M all-cash sale in Dec 2021 of a winery he and Leslie Frank controlled, about $210M net of California and federal capital gains, plus the retained Winston Hill and Lewis vineyards in Rutherford and Napa and prior Disney-era equity","sect":"agri","origin":"self","co":"Frank Family Vineyards","did":"Ran Walt Disney Studios as president through the animation revival and chaired Disney Television, then in 1992 bought Hanns Kornell's bankrupt Larkmead property in Calistoga and built Frank Family into a 100,000-case Chardonnay and Cabernet house sold to Treasury for $315 million.","started":1992,"startAge":49,"toFirst100":26,"why":"He treated the tasting room as a hospitality business with a managed club list years before Napa took direct-to-consumer seriously, so Treasury was buying a named customer file and a Chardonnay brand at volume rather than acreage it could have bought cheaper.","comp":["Duckhorn Portfolio","Jackson Family Wines","Constellation Brands","Trinchero Family Estates"],"obst":"The site was a wrecked sparkling-wine facility from a bankruptcy and he entered Napa as a Hollywood outsider with no growing background; the 2020 Glass Fire burned to the edge of Napa's Calistoga vineyards the year before he sold.","turn":"Abandoning sparkling wine in the late 1990s and making Carneros Chardonnay the flagship, which became the volume engine and the specific asset Treasury wanted.","band":"b2","ageb":"a7","y100":2018,"u45":false,"years":34,"vel":8.2,"ageAt100":75,"since100":8},{"id":"SUNNY_GUPTA","n":"Sunny Gupta","age":55,"city":"Bellevue","country":"US","state":"WA","region":"pnw","nw":0.28,"p":"E","c":0.7,"s":"Apptio DEFM14A filed 2018-12-11, merger consideration table; Apptio DEF 14A 2018 (age 47)","m":"$199,966,984 total merger consideration at $38.00 a share: 4,271,810 shares ($162.3M), 1,086,400 options ($31.6M), 127,000 RSUs and 31,000 PSUs. Net of tax, plus rollover equity realised when IBM bought Apptio from Vista for $4.6B in 2023.","sect":"tech","origin":"self","co":"Apptio","did":"Founded Apptio in Bellevue in 2007 to sell technology business management software that tells a CIO what each IT service actually costs. Took it public in 2016, sold it to Vista Equity in January 2019 at $38 a share where his stake cashed out at $200.0M, stayed on as CEO, and sold Apptio again to IBM for $4.6B in 2023.","started":2007,"startAge":36,"toFirst100":9,"why":"Apptio reconciled general-ledger cost data to IT services, a mapping no ERP vendor maintained. Once three years of a company's cost history lived in that model, it became the CIO's budget system of record and switching meant rebuilding the history, so renewal rates ran above 100 percent of prior-year value.","comp":["ServiceNow","VMware/Digital Fuel","Nicus Software","in-house spreadsheets"],"obst":"The category did not exist, so Apptio had to fund a TBM Council standards body to manufacture buyers. It then IPO'd in 2016 at $16 into a market punishing slow-growth SaaS and traded below the offer price for much of two years before Vista bid.","turn":"November 2018, when Vista offered $38 a share, a 53 percent premium, ending the public discount and letting Gupta rebuild under private ownership for a second, larger exit to IBM.","band":"b2","ageb":"a6","y100":2016,"u45":false,"years":19,"vel":14.7,"ageAt100":45,"since100":10},{"id":"BILL_SMITH","n":"Bill Smith","age":41,"city":"Birmingham","country":"US","state":"AL","region":"se","nw":0.28,"p":"I","c":0.35,"s":"Target's disclosed 550M all-cash acquisition of Shipt, announced 6 Dec 2017, against roughly 65M of venture funding raised","m":"Estimated majority founder stake of the 550M price, net of tax and dilution; the exact ownership share was never disclosed, so this is a modelled figure","sect":"tech","origin":"self","co":"Shipt / Landing","did":"Founded Shipt in Birmingham Alabama in 2014, a membership grocery-delivery service that started with Publix in Birmingham and Tampa and grew to 70 US markets; sold it to Target for 550M in cash in December 2017, then founded the furnished-apartment network Landing in 2019.","started":2014,"startAge":29,"toFirst100":3,"why":"Shipt launched in southern cities Instacart ignored, where grocers had no delivery at all and no rival was bidding up shopper pay. It signed regional chains such as Publix and Winn-Dixie as partners rather than scraping them, so the retailer helped market the service instead of fighting it.","comp":["Instacart","Amazon Fresh","Peapod","Postmates"],"obst":"He was rejected repeatedly by Silicon Valley investors for building outside a coastal hub and funded early growth himself after an earlier prepaid-card venture; Shipt then had to survive Instacart's entry into the South with far deeper capital.","turn":"December 2017, when Target bought Shipt outright for cash rather than partnering, three years after launch.","band":"b2","ageb":"a4","y100":2017,"u45":true,"years":12,"vel":23.3,"ageAt100":32,"since100":9},{"id":"DRUE_CORBUSIER","n":"Drue Corbusier","age":77,"city":"Little Rock","country":"US","state":"AR","region":"se","nw":0.28,"p":"E","c":0.5,"s":"Dillard's 2025 DEF 14A: 450,373 Class A shares beneficially owned; DDS closed 621.63 on 21 Aug 2026","m":"450,373 Class A shares x 621.63 = 280M; excludes any interest in the W.D. Company holding vehicle","sect":"retail","origin":"inherited","co":"Dillard's","did":"Daughter of the founder William Dillard Sr; joined the company in 1970 and spent five decades as an executive vice president over merchandising and the womens apparel divisions, sitting on the board of the last large family-controlled US department store chain.","started":1970,"startAge":21,"toFirst100":45,"why":"Dillard's buying is centralised in Little Rock and the merchandising executives are family, so markdown discipline is a family decision rather than a quarterly one. That is why the chain could hold price through 2021 while public-market rivals discounted to make rent, and why the share count could be bought in.","comp":["Macy's","Nordstrom","Belk","Von Maur"],"obst":"She spent her career inside a sector written off as terminally declining, in a company that refused analysts' demands to spin off real estate or chase e-commerce, and had to hold family stock through a decade in which the stock badly lagged the market.","turn":"2020-21, when Dillard's deliberately under-bought inventory coming out of the pandemic, sold at full margin and the shares went from about 30 dollars to over 400.","band":"b2","ageb":"a7","y100":2015,"u45":false,"years":56,"vel":5,"ageAt100":66,"since100":11},{"id":"WILL_HICKEY","n":"Will Hickey","age":39,"city":"Midland","country":"US","state":"TX","region":"tx","nw":0.28,"p":"E","c":0.7,"s":"SEC beneficial ownership for Permian Resources (PR) compiled Aug 2026: 12,379,394 shares, 1.48 percent, valued at 285 million dollars","m":"Disclosed share count times the 23.03 dollar implied market price; Hickey and Walter file equal counts, consistent with their 50/50 ownership of Colgate Energy","sect":"energy","origin":"self","co":"Permian Resources","started":2015,"startAge":28,"toFirst100":6,"did":"Left Concho Resources and with James Walter founded Colgate Energy in Midland in 2015 on a small Delaware Basin position, grew it through three private capital rounds, and merged it into Centennial Resource Development in September 2022 to form Permian Resources, taking the co-chief executive seat at 35.","why":"They bought Delaware Basin acreage from 2015 to 2017 while private equity was fleeing the crash, so entry cost per acre was a fraction of the 2018 peak. A two-man co-chief executive structure kept corporate overhead per barrel below larger public peers even after the merger.","comp":["Diamondback Energy","Matador Resources","Devon Energy","Coterra Energy"],"obst":"They started Colgate months into the worst oil price crash since the 1980s and had to fund leasing when banks were cutting borrowing bases; the reverse merger then required persuading a public board to hand the chief executive seat to two operators in their mid-thirties.","turn":"The September 2022 merger with Centennial Resource Development, which created a roughly 7 billion dollar Permian pure play and put them in charge of it.","band":"b2","ageb":"a3","y100":2021,"u45":true,"years":11,"vel":25.5,"ageAt100":34,"since100":5},{"id":"JAMES_WALTER","n":"James Walter","age":38,"city":"Midland","country":"US","state":"TX","region":"tx","nw":0.28,"p":"E","c":0.7,"s":"SEC beneficial ownership for Permian Resources (PR) compiled Aug 2026: 12,379,394 shares, 1.48 percent, valued at 285 million dollars","m":"Disclosed share count times the 23.03 dollar implied market price; Hickey and Walter file equal counts, consistent with their 50/50 ownership of Colgate Energy","sect":"energy","origin":"self","co":"Permian Resources","started":2015,"startAge":27,"toFirst100":6,"did":"Cofounded Colgate Energy in Midland in 2015 with Will Hickey after working in energy investment banking, raised three rounds of private capital against Delaware Basin acreage, doubled the position by buying Luxe Energy in 2021, and merged Colgate into Centennial in 2022 to create Permian Resources.","why":"Colgates edge was underwriting rather than drilling. They bought non-operated and small operated packages too small for public exploration and production land teams to model, then blocked them into drillable units, so acreage bought at non-operated pricing was resold to the market at operated pricing.","comp":["Diamondback Energy","Callon Petroleum","Earthstone Energy","Vital Energy"],"obst":"Their first capital came in 2015 when nearly every Permian dedicated private equity fund was writing down its book, and the 2020 collapse took WTI briefly negative while Colgate carried acquisition debt against undrilled acreage.","turn":"The 2021 acquisition of Luxe Energy, which doubled the Delaware Basin position and made the Centennial merger possible.","band":"b2","ageb":"a3","y100":2021,"u45":true,"years":11,"vel":25.5,"ageAt100":33,"since100":5},{"id":"TODD_PEDERSEN","n":"Todd Pedersen","age":56,"city":"Provo","country":"US","state":"UT","region":"mtn","nw":0.27,"p":"I","c":0.35,"s":"Blackstone acquired APX Group (Vivint) for about $2B in 2012; NRG bought Vivint Smart Home for $2.8B at $12 a share in March 2023","m":"Founder residual across two disclosed sale prices, net of the modest current holdings visible in his Form 4 history; deliberately conservative","sect":"tech","origin":"self","co":"Vivint","did":"Started selling home alarm contracts door to door as a BYU student in 1999, built APX Alarm into the second-largest US residential security company, renamed it Vivint in 2011, sold it to Blackstone for about 2 billion dollars in 2012, listed it via SPAC in 2020 and sold it again to NRG for 2.8 billion in 2023.","started":1999,"startAge":29,"toFirst100":13,"why":"Vivint's summer sales army, thousands of students knocking doors on straight commission, acquired subscribers at a cost the incumbents retail and dealer channels could not match. The monitoring contracts it created were financeable assets that could be securitised to fund the next summer's hiring.","comp":["ADT","SimpliSafe","Ring","Brinks Home Security"],"obst":"The FTC and state regulators pursued the door-to-door channel over deceptive sales and credit-pull practices, and Vivint paid a 20 million dollar FTC settlement in 2021. The SPAC listing left the company carrying heavy subscriber-acquisition debt into a rising-rate market.","turn":"The 2012 Blackstone buyout, which recapitalised a business whose whole model ran on borrowing against future contracts.","band":"b2","ageb":"a6","y100":2012,"u45":false,"years":27,"vel":10,"ageAt100":42,"since100":14},{"id":"EMILY_WEISS","n":"Emily Weiss","age":41,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.27,"p":"E","c":0.3,"s":"Forbes profile: Glossier has raised $266M and was last valued at $1.8B","m":"A founder-CEO who raised $266M across six rounds typically retains roughly 15% of equity; 15% x $1.8B = about $0.27B","sect":"consumer","origin":"self","co":"Glossier","did":"Turned her beauty blog Into The Gloss, started in 2010 while a Vogue assistant, into Glossier in 2014, launching with four products sold direct to readers who had been commenting on the blog for four years; she stepped down as chief executive in June 2022 and remains the largest individual holder.","started":2014,"startAge":29,"toFirst100":5,"why":"She built the audience before the product. Into The Gloss ran interviews asking women what was actually on their bathroom shelves, so Glossier launched with four years of documented demand and a customer list, and the products were specified from comment threads rather than a lab brief.","comp":["Estee Lauder","Fenty Beauty","Drunk Elephant","Milk Makeup","Sephora house brands"],"obst":"Glossier laid off more than a third of its staff in January 2022 after over-hiring into a technology strategy that never shipped and shutting the Glossier Play spinoff; she resigned as chief executive five months later and the brand had to abandon its direct-only doctrine and sell through Sephora.","turn":"The 2016 launch of Boy Brow, a single $16 eyebrow product that sold out repeatedly and became the entry point for millions of customers.","band":"b2","ageb":"a4","y100":2019,"u45":true,"years":12,"vel":22.5,"ageAt100":34,"since100":7},{"id":"PETER_CARLINO","n":"Peter M. Carlino","age":79,"city":"Wyomissing","country":"US","state":"PA","region":"ne","nw":0.27,"p":"E","c":0.7,"s":"Gaming and Leisure Properties DEF 14A 2026, ownership as of 2 April 2026, footnotes 1 and 2; GLPI close 43.55 on stockanalysis.com, 21 Aug 2026","m":"Reported 10,795,408 GLPI shares less 4,708,917 held by the Carlino Family Trust and Residuary Trust for eight siblings = 6,086,491 x 43.55 = 265M. Excludes his residual PENN Entertainment holding.","sect":"realestate","origin":"mixed","co":"Gaming and Leisure Properties","did":"Became CEO of Penn National Gaming in 1994 and took it public that year on the back of a single Pennsylvania racetrack, then rolled up tracks and casinos; in November 2013 he split the real estate out as Gaming and Leisure Properties, the first gaming REIT, and ran it as chairman and CEO.","started":1994,"startAge":47,"toFirst100":10,"why":"Casino real estate trapped inside an operating company traded at gaming EBITDA multiples; moving it into a REIT let the same rent streams trade at real estate cap rates and escape corporate tax, while triple-net leases to Penn, Boyd, Bally's and Caesars pushed operating and capex risk onto the tenants.","comp":["VICI Properties","MGM Growth Properties","Realty Income","Boyd Gaming"],"obst":"No gaming company had ever converted to a REIT and the IRS had never ruled on whether slot floors and casino buildings were qualifying real property; Carlino spent two years obtaining a private letter ruling and splitting 20 years of accounts into opco and propco.","turn":"The 1 November 2013 spin-off of Gaming and Leisure Properties from Penn National Gaming.","band":"b2","ageb":"a7","y100":2004,"u45":false,"years":32,"vel":8.4,"ageAt100":57,"since100":22},{"id":"TONY_THENE","n":"Tony R. Thene","age":65,"city":"Philadelphia","country":"US","state":"PA","region":"ne","nw":0.27,"p":"E","c":0.7,"s":"Carpenter Technology DEF 14A filed August 2025, ownership table for the 2025 annual meeting; CRS close 492.38 on stockanalysis.com, 21 Aug 2026","m":"501,267 shares beneficially owned plus 55,539 exercisable options = 556,806 x 492.38 = 274M, gross of option strikes.","sect":"industry","origin":"self","co":"Carpenter Technology","did":"Spent 22 years in finance at Alcoa, joined Carpenter Technology as CFO in 2013 and became CEO in July 2015; he rebuilt the specialty-alloy maker around aerospace and medical grades and its shares went from about 20 dollars in 2020 to 492 in August 2026.","started":2015,"startAge":54,"toFirst100":9,"why":"Carpenter melts nickel, cobalt and titanium alloys qualified into specific jet-engine part numbers, and requalifying a new melter takes years; when air traffic returned after 2022 and engine makers could not get material, Carpenter could price a constrained melt capacity instead of chasing tonnage.","comp":["ATI","Haynes International","Universal Stainless","Aperam"],"obst":"COVID grounded aviation and Carpenter posted operating losses through fiscal 2021 and 2022 while customers destocked; Thene idled plants and cut headcount rather than fill furnaces with low-margin industrial bar, which meant defending negative earnings to shareholders for two years.","turn":"The fiscal 2023 decision to allocate scarce melt capacity by margin per pound rather than by volume.","band":"b2","ageb":"a7","y100":2024,"u45":false,"years":11,"vel":24.5,"ageAt100":63,"since100":2},{"id":"ROBBIE_SCHINGLER","n":"Robbie Schingler","age":47,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.27,"p":"E","c":0.8,"s":"Planet Labs DEF 14A filed 27 May 2026 (ownership as of 15 May 2026); PL close 22.29 on 21 Aug 2026","m":"12,089,980 shares held (92,911 plus 250,171 Class A and 11,746,898 Class B via the Ulysses Trust) times the PL close of 22.29 on 21 Aug 2026, excluding 1,317,379 exercisable options","sect":"tech","origin":"self","co":"Planet Labs","did":"Co-founded Planet Labs in 2010 after nine years at NASA, where he helped run the agency's small-spacecraft and open-source programmes; as chief strategy officer he built the government side of the business, including the NGA and NRO imagery contracts and the European civil-agency deals.","started":2010,"startAge":31,"toFirst100":11,"why":"Daily global imagery only pays if a buyer with a budget is allowed to purchase it. Schingler assembled the licences, export approvals and contracting vehicles that let a commercial constellation sell to defence and intelligence customers who otherwise bought only from Maxar.","comp":["Maxar","BlackSky","Satellogic","ICEYE"],"obst":"US commercial remote-sensing rules were written for a handful of satellites; Planet had to get NOAA to licence hundreds at once, and to persuade intelligence buyers that unclassified medium-resolution imagery refreshed daily was worth a contract at all.","turn":"The February 2017 purchase of Google's Terra Bella, which added the high-resolution SkySat fleet plus a multi-year Google imagery contract and turned Planet from a single-resolution provider into a two-tier one.","band":"b2","ageb":"a5","y100":2021,"u45":false,"years":16,"vel":16.9,"ageAt100":42,"since100":5},{"id":"RANDOLPH_MARTEN","n":"Randolph Marten","age":74,"city":"Mondovi","country":"US","state":"WI","region":"mw","nw":0.26,"p":"E","c":0.8,"s":"SEC Form 4 filed 30 Jul 2026: 17,742,900 Marten Transport shares held directly; MRTN closed $14.93 on 21 Aug 2026","m":"Disclosed beneficial share count x closing price; includes unvested performance award shares as reported","sect":"logistics","origin":"inherited","co":"Marten Transport","did":"Took over the refrigerated trucking company his father Roger started in Mondovi, Wisconsin, joining full time in 1972, becoming president in 1986 and chairman and chief executive since. He holds about 17.7 million shares of a carrier now running reefer truckload, intermodal and dedicated fleets.","started":1972,"startAge":20,"toFirst100":25,"why":"Refrigerated freight is a niche the big dry van carriers avoid because reefer units fail, product spoils and claims are expensive. Marten specialised in it, ran newer equipment to cut breakdowns, and signed long dedicated contracts with food shippers so it priced off reliability rather than spot rates.","comp":["Prime Inc","KLLM Transport Services","Werner Enterprises","Schneider National"],"obst":"Trucking deregulation in 1980 wiped out most of the carriers the family had grown up alongside and forced a small Wisconsin firm to compete on cost with national fleets; the post-2022 freight recession then cut reefer spot rates and produced the company's first losing quarters in decades.","turn":"The 1986 initial public offering and the choice to stay entirely in temperature-controlled freight rather than follow rivals into general dry van.","band":"b2","ageb":"a7","y100":1997,"u45":false,"years":54,"vel":4.8,"ageAt100":45,"since100":29},{"id":"JOSHUA_BOGER","n":"Joshua Boger","age":75,"city":"Concord","country":"US","state":"MA","region":"ne","nw":0.26,"p":"E","c":0.5,"s":"SEC insider holdings, 359,711 Vertex Pharmaceuticals shares worth about 176 million dollars, August 2026","m":"359,711 VRTX shares at the August 2026 price plus other disclosed public holdings, roughly 246 million dollars in aggregate, net of decades of Form 4 sales and large charitable gifts","sect":"health","origin":"self","co":"Vertex Pharmaceuticals","did":"Left Merck in 1989 to found Vertex in Cambridge on structure-based rational drug design, ran it as CEO until 2009, and stayed on the board until 2017; the company he started now dominates cystic fibrosis therapy with Trikafta and is worth well over 100 billion dollars.","started":1989,"startAge":38,"toFirst100":12,"why":"Vertex designed molecules against a solved protein structure rather than screening compound libraries, letting it attack targets big pharma had ruled undruggable. Cystic fibrosis, a small population with a single known genetic cause, gave it a defined patient set and orphan pricing that funded everything after.","comp":["Merck","Gilead Sciences","Abbott","Boehringer Ingelheim"],"obst":"Vertex went nearly two decades without a self-discovered approved drug and burned through repeated financing rounds; its HIV protease programme was beaten to market and its hepatitis C drug Incivek, briefly a blockbuster, was obsoleted within two years by Gilead's Sovaldi.","turn":"The 2012 approval of Kalydeco, the first drug to treat the underlying cause of cystic fibrosis rather than its symptoms, which validated twenty years of rational design.","band":"b2","ageb":"a7","y100":2001,"u45":false,"years":37,"vel":7,"ageAt100":50,"since100":25},{"id":"THOMAS_PRIORE","n":"Thomas Priore","age":52,"city":"Alpharetta","country":"US","state":"GA","region":"se","nw":0.26,"p":"E","c":0.7,"s":"Priority Technology Holdings Form 4 filed 9 Feb 2026: 34,002,878 shares held directly plus 12,500,000 indirect; PRTH closed 5.61 on 21 Aug 2026","m":"46,502,878 beneficially owned shares x 5.61 = 261M","sect":"finance","origin":"self","co":"Priority Technology Holdings","did":"Recapitalised the Georgia merchant acquirer Priority Payment Systems in 2014, took it public through a SPAC in 2018 and rebuilt it as Priority Technology, combining card acquiring with banking-as-a-service and B2B payables; the company now runs about 1B in revenue from Alpharetta.","started":2014,"startAge":40,"toFirst100":7,"why":"Priority sells through independent software vendors and payment facilitators rather than a direct sales force, so distribution cost is someone else's. Adding a bank-account layer under the acquiring business lets it hold merchant balances and earn on the float as well as the interchange spread.","comp":["Global Payments","Fiserv","Shift4 Payments","Repay Holdings"],"obst":"His previous firm ICP Asset Management settled SEC charges in 2012 over CDO trades, and he came into payments with that record; Priority's 2018 SPAC listing left it heavily indebted and the stock has fallen more than a quarter over the past year.","turn":"2021, when the 425M purchase of Finxera added licensed money-transmission and banking rails on top of a commodity card-acquiring business.","band":"b2","ageb":"a5","y100":2021,"u45":false,"years":12,"vel":21.7,"ageAt100":47,"since100":5},{"id":"JULIA_CHEEK","n":"Julia Cheek","age":45,"city":"Austin","cou t":"media","origin":"mixed","co":"Sinclair Broadcast Group","did":"Turned his fathers single Baltimore UHF station into the largest owner of local television stations in America, using local marketing agreements to control two stations where FCC rules allowed one, buying the Allbritton and Tribune groups, and paying 9.6 billion dollars for the Bally regional sports networks in 2019.","started":1986,"startAge":36,"toFirst100":8,"why":"The local marketing agreement was a structure nobody else industrialised: Sinclair sold a licence to a nominal third party then bought back the advertising and programming, effectively running two stations per market. That doubled the retransmission fees it could extract per market at little extra cost.","comp":["Nexstar Media","Gray Television","Tegna","Scripps"],"obst":"The FCC and Justice Department killed his 3.9 billion dollar Tribune Media acquisition in 2018 over alleged misrepresentation of divestitures, costing a 1 billion dollar break fee; the Diamond Sports subsidiary then filed for bankruptcy in 2023, writing off most of the 9.6 billion purchase.","turn":"The 2019 purchase of 21 regional sports networks from Disney, a bet on cable carriage that went badly and defines the current valuation.","band":"b2","ageb":"a7","y100":1994,"u45":false,"years":40,"vel":6.3,"ageAt100":44,"since100":32},{"id":"CHRISTOPHER_J_SWIFT","n":"Christopher J. Swift","age":65,"city":"Hartford","country":"US","state":"CT","region":"ne","nw":0.25,"p":"E","c":0.5,"s":"The Hartford Insurance Group DEF 14A filed 9 April 2026 (ownership as of 23 March 2026, age 65); HIG close 136.10 dollars, 21 August 2026","m":"Beneficial ownership 2,395,003 shares of which 1,937,189 are exercisable options. Shares: 457,814 x 136.10 = 62.3 million dollars. Options: proxy tables show strikes of 48.89 to 95.74 dollars, giving roughly 155 million dollars of intrinsic value, about 100 million after exercise tax.","sect":"finance","origin":"self","co":"The Hartford Insurance Group","did":"Joined The Hartford as chief financial officer in 2010 while it was still repaying crisis era capital, became chief executive in 2014, sold the Japan annuity book and the Talcott run off life business, bought Navigators for 2.1 billion dollars in 2019, and rebuilt it as a small commercial property casualty underwriter.","started":2010,"startAge":49,"toFirst100":12,"why":"The Hartford traded at a discount because a variable annuity book with tens of billions of guarantees sat behind a good property casualty franchise. Selling that tail removed the equity risk capping the multiple, and his pay was ten year options struck between 2015 and 2020, so the re-rating is the wealth.","comp":["Travelers","Chubb","CNA Financial","Hanover Insurance"],"obst":"He inherited a company that had taken 3.4 billion dollars of TARP money and still carried variable annuity guarantees that could move billions with the equity market, then fought off an unsolicited 23 billion dollar approach from Chubb in 2020 while arguing the standalone plan was worth more.","turn":"The May 2018 sale of Talcott Resolution, the run off annuity unit, which finally severed the 2008 legacy and let the company be valued as a pure property casualty underwriter.","band":"b2","ageb":"a7","y100":2022,"u45":false,"years":16,"vel":15.6,"ageAt100":61,"since100":4},{"id":"STEPHEN_ALTEMUS","n":"Stephen Altemus","age":62,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.25,"p":"E","c":0.75,"s":"Intuitive Machines DEF 14A filed 24 Apr 2026 (ownership as of 10 Apr 2026); Nasdaq close 21 Aug 2026","m":"1,176,246 Class A plus 12,342,213 Class C paired one-for-one with LLC units = 13,518,459 x $18.32 close = $248M","sect":"industry","origin":"self","co":"Intuitive Machines","did":"Left his job as deputy director of NASA Johnson Space Center to co-found Intuitive Machines in Houston in 2013 with Kam Ghaffarian and Tim Crain; as chief executive he landed Odysseus on the Moon in February 2024, the first US soft landing since 1972 and the first ever by a private company.","started":2013,"startAge":49,"toFirst100":11,"why":"NASA's Commercial Lunar Payload Services programme paid fixed-price for delivery rather than cost-plus for development, which suited a small team next door to Johnson that could hire experienced flight controllers and build its own lander instead of subcontracting it.","comp":["Astrobotic Technology","Firefly Aerospace","ispace"],"obst":"Odysseus caught a landing leg and tipped over on touchdown in February 2024, cutting the mission short; the follow-up Athena lander also toppled in March 2025, and Altemus had to keep NASA contracts and investors while fixing the landing sensor and geometry.","turn":"The February 2023 SPAC merger that listed Intuitive Machines, followed twelve months later by the Odysseus landing, which converted a Houston contractor into the reference name in commercial lunar delivery.","band":"b2","ageb":"a6","y100":2024,"u45":false,"years":13,"vel":19.2,"ageAt100":60,"since100":2},{"id":"PAUL_MARCIANO","n":"Paul Marciano","age":74,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.25,"p":"E","c":0.85,"s":"Guess?, Inc. DEFM14A filed 21 Oct 2025; Authentic Brands take-private at 16.75 dollars per share","m":"14,876,944 shares beneficially owned at the 20 Oct 2025 record date times the 16.75 dollar merger price equals 249 million dollars; he rolled the equity into the buyer rather than cashing out","sect":"consumer","origin":"self","co":"Guess?, Inc.","did":"Left Marseille for Los Angeles and founded Guess with his brothers in 1981 around a stonewashed three-zip Marilyn jean, then ran creative and advertising for four decades, shooting the black-and-white campaigns that launched Claudia Schiffer and Anna Nicole Smith. He held 28 percent at the 2025 take-private.","started":1981,"startAge":29,"toFirst100":15,"why":"Guess kept advertising in-house and shot denim like fashion editorial, so a commodity garment rved five months in federal prison, and had to hold the family company and its distributor relationships together through it.","turn":"The April 2016 sale of The Prisoner for $285 million, which turned a $40 million bet into the capital base that now carries Quintessa and the rest of the portfolio.","band":"b2","ageb":"a6","y100":2016,"u45":false,"years":21,"vel":11.9,"ageAt100":50,"since100":10},{"id":"GEORGES_DAOU","n":"Georges Daou","age":64,"city":"Paso Robles","country":"US","state":"CA","region":"socal","nw":0.25,"p":"E","c":0.4,"s":"Treasury Wine Estates announcement 31 Oct 2023: acquisition of DAOU Vineyards for US 900 million upfront plus up to 100 million earn-out; age from DAOU Systems DEF 14A filed 21 Apr 1998, which lists Georges J. Daou at 36","m":"Announced 900 million dollar upfront price for a business the founding brothers owned, split evenly, less an assumed 30 percent long-term capital gains and vineyard debt: 900 / 2 x 0.7 is about 315 million; held to 250 million as a conservative floor.","sect":"agri","origin":"self","co":"DAOU Vineyards","did":"Fled Lebanon's civil war as a teenager, co-founded healthcare IT firm DAOU Systems in San Diego in 1987 and took it public on Nasdaq in 1997, then bought the 212-acre former Hoffman Mountain Ranch above Paso Robles in 2007 and built DAOU Vineyards, sold to Treasury Wine Estates in 2023.","started":2007,"startAge":45,"toFirst100":16,"why":"Paso Robles Cabernet land cost roughly a tenth of Napa's. Selling 90-point Cabernet at 20 to 40 dollars through national chain distribution built a 400,000-case luxury brand on cheap dirt, and Treasury needed exactly that price tier to fill the gap between Beringer and Penfolds.","comp":["Justin Vineyards","Caymus Vineyards","Duckhorn Portfolio","Austin Hope"],"obst":"A shell hit the family home in Beirut and the family fled to France with nothing; two decades later DAOU Systems collapsed after 1998 revenue restatements and shareholder suits, and the brothers left the ux varieties.","band":"b2","ageb":"a6","y100":2023,"u45":false,"years":19,"vel":13.2,"ageAt100":57,"since100":3},{"id":"JENNIFER_WONG","n":"Jennifer Wong","age":51,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.25,"p":"E","c":0.65,"s":"Reddit DEF 14A filed 23 Apr 2026 (ownership as of 31 Mar 2026); RDDT close 150.31 on 21 Aug 2026","m":"629,473 shares held plus 1,633,975 exercisable options struck before the Mar 2024 IPO, valued at the RDDT close of 150.31 on 21 Aug 2026","sect":"tech","origin":"self","co":"Reddit","did":"Joined Reddit as chief operating officer in April 2018, when the 13-year-old site had almost no advertising business, and built the revenue organisation and self-serve ad platform that carried Reddit from under 100M dollars of annual revenue to 1.3B dollars in 2024 and through its March 2024 IPO.","started":2018,"startAge":43,"toFirst100":6,"why":"Reddit held two decades of the highest-intent conversation on the internet and no way to sell it. Wong built ad products keyed to subreddit context, so advertisers bought declared interest communities directly instead of bidding on inferred demographics as they did on Meta.","comp":["Meta","Snap","Pinterest","X"],"obst":"She inherited an ad surface brands actively avoided over Reddit's reputation for unmoderated content, and had to hold advertisers through the June 2023 API pricing revolt, when thousands of moderators took their subreddits private months before the IPO filing.","turn":"The March 2024 IPO at 34 dollars a share, which turned six years of pre-IPO options into a marketable stake and priced the ad business she had built.","band":"b2","ageb":"a5","y100":2024,"u45":false,"years":8,"vel":31.3,"ageAt100":49,"since100":2},{"id":"KRIS_RASMUSSEN","n":"Kris Rasmussen","age":43,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.25,"p":"E","c":0.8,"s":"Figma Form 4 filed 6 Aug 2026 reporting 9,234,587 Class A shares held; FIG close 27.31 on 21 Aug 2026; ag
