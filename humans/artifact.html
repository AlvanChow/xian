,"region":"bay","nw":0.12,"p":"E","c":0.5,"s":"Stitch Fix market cap 445.6M USD on 21 Aug 2026; Forbes last listed her at 760M in August 2021","m":"Residual low-double-digit founder stake at current market cap plus roughly 47M USD of disclosed share sales","sect":"retail","origin":"self","co":"Stitch Fix","did":"Founded Stitch Fix in 2011 from her Harvard Business School apartment, mailing five garments at a time picked by human stylists working off a sizing model, and took it public in November 2017 as the youngest woman ever to lead a US IPO.","started":2011,"startAge":33,"toFirst100":6,"why":"Buying clothes online was a discovery problem, not a logistics one. A styling fee collected before shipping meant revenue arrived ahead of inventory risk, and every kept-or-returned item fed a fit dataset that made the next box cheaper to fill correctly.","comp":["Trunk Club (Nordstrom)","Rent the Runway","Amazon Personal Shopper","Nordstrom"],"obst":"Most Silicon Valley investors who had never shopped for womens clothes passed on the round; her co-founder departed in 2012 and later litigated over equity, and the stock has fallen more than 95 percent from its 2021 high, erasing most of her paper fortune.","turn":"The November 2017 IPO, priced below range at 15 dollars after a brutal roadshow, which closed up and forced the market to price the model.","state":"CA","band":"b1","ageb":"a5","y100":2017,"u45":false,"years":15,"vel":8,"ageAt100":39,"since100":9},{"id":"CHRIS_WRIGHT","n":"Chris Wright","age":61,"city":"Denver","country":"US","state":"CO","region":"mtn","nw":0.12,"p":"I","c":0.55,"s":"Forbes, August 2025: a fortune of roughly $100 million on entering the cabinet, including a 1.6% Liberty Energy stake worth about $50M that ethics rules required him to sell","m":"Published Forbes estimate built from his OGE Form 278e disclosure; SEC-derived third-party estimates run higher","sect":"energy","origin":"self","co":"Liberty Energy","did":"Founded Pinnacle Technologies in 1992 and commercialised the fracture mapping that let operators see where a hydraulic fracture actually went, then founded Liberty Resources and Liberty Energy in Denver in 2011 and built one of the largest North American pressure-pumping companies. Sworn in as US Energy Secretary in February 2025.","started":1992,"startAge":27,"toFirst100":22,"why":"Liberty entered pressure pumping with its own engineering rather than as a fleet renter, so it designed the frac job and was paid for the result instead of by the hour. It then bought Schlumberger's entire North American fracturing business in 2020 for stock, at the bottom of the cycle, and came out of covid as the scale player.","comp":["Halliburton","SLB","ProPetro","NexTier Oilfield Solutions"],"obst":"Liberty listed in January 2018 straight into the shale service collapse; the 2020 oil crash took the stock under two dollars and the dividend was suspended weeks after it agreed to absorb Schlumberger's loss-making frac fleet.","turn":"The August 2020 all-stock deal to take over Schlumberger's North American fracturing business at the cycle low.","band":"b1","ageb":"a6","y100":2014,"u45":false,"years":34,"vel":3.5,"ageAt100":49,"since100":12},{"id":"FRANK_SULLIVAN","n":"Frank C. Sullivan","age":65,"city":"Medina","country":"US","state":"OH","region":"mw","nw":0.12,"p":"E","c":0.8,"s":"SEC Form 4 filed 7 Aug 2026: 1,086,869 RPM International shares held directly, via the Thomas C. Sullivan Irrevocable Trust and the 401(k); RPM closed $108.63 on 21 Aug 2026","m":"Disclosed beneficial share count x closing price; excludes stock appreciation rights","sect":"industry","origin":"mixed","co":"RPM International","did":"Third-generation chief executive of RPM International in Medina, Ohio, the specialty coatings group behind Rust-Oleum, DAP, Zinsser and Tremco. He joined in 1987, became CEO in 2002 and took revenue past 7 billion dollars through more than 100 acquisitions.","started":1987,"startAge":26,"toFirst100":25,"why":"RPM buys small niche coatings and sealant firms and leaves their brands, managers and sales forces alone, supplying only purchasing scale and capital. Coatings are a low share of a project's cost but high consequence, so specification stickiness protects price and founders sell for less than to an integrator.","comp":["Sherwin-Williams","PPG Industries","H B Fuller","Sika"],"obst":"Asbestos liability from the Bondex subsidiary nearly sank the company; he put it into Chapter 11 in 2010 and spent four years negotiating before a 797 million dollar trust settlement in 2014. Elliott Management then ran an activist campaign in 2018 forcing margin targets and board changes.","turn":"The 2014 Bondex asbestos trust settlement, which capped a liability that had frozen the stock for a decade and let him resume buying companies.","band":"b1","ageb":"a7","y100":2012,"u45":false,"years":39,"vel":3.1,"ageAt100":51,"since100":14},{"id":"GARY_SHIFFMAN","n":"Gary Shiffman","age":72,"city":"Bloomfield Hills","country":"US","state":"MI","region":"mw","nw":0.12,"p":"E","c":0.7,"s":"SEC Form 4 filed 25 Jun 2026: 950,839 Sun Communities shares held directly, by spouse and an irrevocable trust; SUI closed $121.66 on 21 Aug 2026","m":"Disclosed common share count x closing price; excludes operating partnership units not reported on the Form 4","sect":"realestate","origin":"self","co":"Sun Communities","did":"Built Sun Communities from his family's Michigan manufactured-housing parks into the largest US owner of manufactured-home and RV communities, taking it public in 1993 and buying Safe Harbor Marinas for 2.1 billion dollars in 2020. He stepped back from the CEO role in 2025.","started":1975,"startAge":21,"toFirst100":20,"why":"A manufactured-home community is effectively a land lease: the resident owns a house that cannot be moved economically, so turnover is low, rents rise steadily and capital spending stays small. Local zoning has blocked nearly all new communities for decades, so supply is fixed and he could roll up the class.","comp":["Equity LifeStyle Properties","UMH Properties","Blackstone Real Estate","Legacy Communities"],"obst":"The company carried heavy leverage into the 2008 crash, when manufactured-home lending vanished and occupancy fell; Land and Buildings then ran an activist campaign in 2024 attacking the marina purchase and the UK holiday-park business, and he left the CEO job in 2025.","turn":"The 2020 purchase of Safe Harbor Marinas, which applied the same fixed-supply land-lease logic to boat slips and opened a second asset class.","band":"b1","ageb":"a7","y100":1995,"u45":false,"years":51,"vel":2.4,"ageAt100":41,"since100":31},{"id":"TOBY_RICE","n":"Toby Z. Rice","age":44,"city":"Pittsburgh","country":"US","state":"PA","region":"ne","nw":0.12,"p":"E","c":0.7,"s":"SEC insider holdings for EQT Corporation, 2,157,865 shares as of 14 August 2026","m":"2,157,865 EQT shares at about 55 dollars per share, the price of his 14 August 2026 disclosed sale, roughly 119 million dollars","sect":"energy","origin":"mixed","co":"EQT Corporation","did":"Co-founded Rice Energy with his brothers in 2007 to drill Marcellus shale, sold it to EQT for 6.7 billion dollars in 2017, then ran a proxy campaign in 2019 that removed EQT's board and installed him as CEO of the company that had bought his; he now runs the largest US natural gas producer on a one dollar salary.","started":2007,"startAge":25,"toFirst100":6,"why":"The Rice brothers competed on drilling cycle time, not acreage. Their well costs per lateral foot were the lowest in Appalachia, which is why EQT paid up and why the 2019 activist pitch, that EQT was destroying value by not adopting Rice's operating model, was checkable from public well data.","comp":["Chesapeake Energy","Range Resources","Antero Resources","Southwestern Energy","CNX"],"obst":"Rice Energy was launched in 2007 with family money into the worst gas price collapse in a generation; the 2019 EQT proxy fight was a hostile campaign against a 130-year-old Pittsburgh institution's own board, which he won with over 80 percent shareholder support.","turn":"The July 2019 shareholder vote that installed the Rice team and made him CEO of EQT, two years after selling them his company.","band":"b1","ageb":"a4","y100":2013,"u45":true,"years":19,"vel":6.3,"ageAt100":31,"since100":13},{"id":"CHRIS_DIORIO","n":"Chris Diorio","age":64,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.12,"p":"E","c":0.75,"s":"Impinj DEF 14A of 16 Apr 2026: 752,164 shares, 2.5 percent; PI closed 165.54 dollars on 21 August 2026","m":"Disclosed beneficial share count times market price","sect":"tech","origin":"self","co":"Impinj","did":"A Caltech-trained researcher and University of Washington professor, he co-founded Impinj in 2000 to commercialise low-power silicon for passive RFID tags, wrote much of the UHF Gen2 standard the industry adopted, took the company public in 2016 and has run it since as chief executive.","started":2000,"startAge":38,"toFirst100":16,"why":"Impinj sells both the tag chip and the reader chip, so it earns on every item tagged and every gate that reads it. Writing the Gen2 standard meant interoperability rules were built around its silicon, and once Walmart, Zara and the airlines mandated item-level tagging the ramp became regulatory.","comp":["NXP Semiconductors","Alien Technology","Zebra Technologies","STMicroelectronics","Honeywell"],"obst":"Impinj spent sixteen years and several near-death funding rounds waiting for RFID adoption after the 2003 Walmart mandate failed to materialise; a long patent war with NXP ran from 2019 to 2024, and the shares halved in 2022 on an inventory correction at its largest customers.","turn":"The 2020s apparel and logistics mandates from Walmart, Zara owner Inditex and the airlines, which finally moved tag volumes from hundreds of millions to tens of billions a year.","band":"b1","ageb":"a6","y100":2016,"u45":false,"years":26,"vel":4.6,"ageAt100":54,"since100":10},{"id":"JOSHUA_HUG","n":"Joshua Hug","age":47,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.12,"p":"E","c":0.75,"s":"Remitly DEF 14A of 24 Apr 2026: 4,386,668 shares, 2.1 percent; RELY closed 26.67 dollars on 21 August 2026","m":"Disclosed beneficial share count times market price","sect":"finance","origin":"self","co":"Shelfari / Remitly","did":"Co-founded the social book-cataloguing site Shelfari, sold it to Amazon in 2008 and ran it there, then co-founded Remitly in Seattle in 2011 as chief product officer, later chief operating officer and vice chair, building the customer-facing side of a remittance app now handling more than 10 million active users.","started":2011,"startAge":32,"toFirst100":13,"why":"Remittance customers are choosing under fear, not price alone: a failed transfer means a family does not eat. Hug built the product around delivery certainty and status transparency rather than the lowest headline rate, which produced retention that let the company spend more to acquire each sender than rivals could.","comp":["Western Union","MoneyGram","Wise","WorldRemit","Xoom"],"obst":"Shelfari was bought by Amazon and eventually shut down in 2016, an exit that produced no fortune; at Remitly the early product lost money on fraud in the Philippine corridor and had to be rebuilt corridor by corridor under state money-transmitter licensing.","turn":"The 2016 shift from a single corridor to a licensed multi-corridor platform, which made every new country an incremental build rather than a new company.","band":"b1","ageb":"a5","y100":2024,"u45":false,"years":15,"vel":8,"ageAt100":45,"since100":2},{"id":"TIM_LATIMER","n":"Tim Latimer","age":36,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.12,"p":"E","c":0.8,"s":"Fervo Energy 424B4 IPO prospectus dated 12 May 2026 (ownership as of 29 Apr 2026); NYSE close 21 Aug 2026","m":"6,297,923 Class B shares held plus 1,402,830 exercisable options = 7,700,753 x $16.92 close = $130M; option strikes not deducted","sect":"energy","origin":"self","co":"Fervo Energy","did":"A drilling engineer at BHP who quit for business school and co-founded Fervo Energy in Houston in 2017 with Jack Norbeck, applying shale horizontal drilling and fibre-optic sensing to geothermal; Fervo built Project Red in Nevada and the 500MW Cape Station in Utah, and IPO'd in May 2026 raising $1.89B.","started":2017,"startAge":27,"toFirst100":9,"why":"Geothermal had been limited to rare natural hot-water reservoirs. Horizontal wells with multi-stage stimulation create the permeability instead of finding it, which makes the resource ubiquitous, and each Fervo well drilled faster and cheaper than the last on the same learning curve shale followed after 2010.","comp":["Ormat Technologies","Sage Geosystems","Eavor"],"obst":"Investors treated geothermal as a dead category and drilling costs were the reason; Fervo had to prove the learning curve in public, cutting Cape Station well times from about 70 days to under 20 while pre-selling power to Google and Southern California Edison.","turn":"The 2023 Project Red demonstration in Nevada, which delivered continuous power to Google under the first corporate enhanced-geothermal PPA and unlocked the capital for Cape Station.","band":"b1","ageb":"a3","y100":2026,"u45":true,"years":9,"vel":13.3,"ageAt100":36,"since100":0},{"id":"BRYAN_DEBOER","n":"Bryan B. DeBoer","age":59,"city":"Medford","country":"US","state":"OR","region":"pnw","nw":0.12,"p":"E","c":0.7,"s":"SEC Form 4 dated 2026-01-09, CIK 1170767 (204,845 shares); Lithia Motors DEF 14A filed 2026-03-11 (age 59); LAD close 370.73 dollars on 2026-08-21","m":"204,845 LAD shares at 370.73 dollars = 75.9M dollars, plus 53.3M dollars of Form 4 sales 2004-2024 less roughly 25 percent tax","sect":"retail","origin":"mixed","co":"Lithia Motors","did":"Joined his father's Lithia Motors in 1989, ran the acquisition machine through the 1996 IPO roll-up, and as CEO since 2012 took revenue from about 3 billion to 37.9 billion dollars while building Driveway, the online used-car channel, and buying Britain's Jardine and Pendragon networks.","started":1989,"startAge":22,"toFirst100":35,"why":"The model is an arbitrage on private dealership multiples: pay three to five times earnings for a family store, refinance the real estate, and run it on shared inventory and finance systems. He industrialised the diligence so Lithia could close roughly a store a week.","comp":["AutoNation","Carvana","Penske Automotive Group"],"obst":"He launched Driveway straight into Carvana's 2020-2021 capital advantage, then had to defend the spend when the used-vehicle price bubble burst in 2022 and Lithia stock roughly halved.","turn":"2021, when Lithia bought Michigan's Suburban Collection and set a 50 billion dollar revenue target, turning a regional roll-up into a national one.","band":"b1","ageb":"a6","y100":2024,"u45":false,"years":37,"vel":3.2,"ageAt100":57,"since100":2},{"id":"CHRIS_HULLS","n":"Chris Hulls","age":42,"city":"San Mateo","country":"US","state":"CA","region":"bay","nw":0.12,"p":"E","c":0.7,"s":"Life360 DEF 14A filed 2026-04-16, ownership as of 2026-03-31 and age table as of April 2026; LIF close $44.66 on 2026-08-21","m":"811,884 shares held directly and in three childrens trusts x $44.66 = $36M, plus 1,710,364 exercisable options at the $5.66 plan weighted-average strike = $67M intrinsic; about $104M plus prior sales","sect":"tech","origin":"self","co":"Life360","did":"Co-founded Life360 in 2007 at age 23 after a Berkeley degree and Air Force service, entering a Google-sponsored contest for a family locator built for disaster response; grew it to roughly 96 million monthly users, listed it on the ASX in 2019 and on Nasdaq in 2022, and bought Tile in 2021.","started":2007,"startAge":23,"toFirst100":17,"why":"Every install recruits the rest of the household, so customer acquisition cost is near zero and the install base compounds without paid marketing 2025 clinical data that its half-life extension actually delivered the dosing interval, against a class where AbbVie already books billions.","turn":"The August 2024 reverse merger into ARCA biopharma with a concurrent private placement, which took a four-month-old company public and funded the programs to human data.","band":"b1","ageb":"a4","y100":2026,"u45":true,"years":2,"vel":60,"ageAt100":43,"since100":0},{"id":"DEREK_A_RICE","n":"Derek A. Rice","age":41,"city":"Canonsburg","country":"US","state":"PA","region":"ne","nw":0.12,"p":"I","c":0.3,"s":"EQT DFAN14A filed 13 Feb 2019 by Toby Z. Rice and Derek A. Rice; Rice Energy DEF 14A of 17 Apr 2017; EQT close 53.72 on 21 Aug 2026","m":"272,651 EQT shares held directly and indirectly = 14.6M, plus a beneficiary share of the Rice Energy 2016 Irrevocable Trust holding 5,676,000 EQT shares (305M) split among the Rice brothers, plus Rice Investment Group carry; age 32 as of April 2017 per Rice Energy proxy","sect":"energy","origin":"mixed","co":"Rice Energy","did":"Co-founded Rice Energy with his father and brothers in 2007 and ran exploration and geology as executive vice president, assembling the Marcellus and Utica position in Greene and Washington counties that EQT bought in November 2017 for about 6.7B; now a partner at Rice Investment Group in Canonsburg.","started":2007,"startAge":22,"toFirst100":7,"why":"The brothers drilled longer laterals than anyone in southwestern Pennsylvania and owned the midstream that moved their own gas, so they captured the gathering margin as well as the wellhead one; that made the acreage worth more to EQT as a contiguous block than the sum of its wells.","comp":["Range Resources","Antero Resources","Cabot Oil and Gas","CNX Resources","Chesapeake Energy"],"obst":"Appalachian gas fell below 1.50 per million BTU in 2015 and 2016, forcing the family to take Rice Midstream Partners public to fund drilling, and after selling to EQT they had to run a 2019 proxy fight to unseat the board of the company that had bought them.","turn":"The November 2017 sale of Rice Energy to EQT for cash and stock, followed by the July 2019 proxy win that put his brother Toby in charge of the buyer.","band":"b1","ageb":"a4","y100":2014,"u45":true,"years":19,"vel":6.3,"ageAt100":29,"since100":12},{"id":"KEN_SONG","n":"Ken Song","age":51,"city":"San Diego","country":"US","state":"CA","region":"socal","nw":0.12,"p":"E","c":0.6,"s":"RayzeBio SC 14D-9 filed 25 Jan 2024: Song held 1,622,095 shares worth 101,380,938 dollars and 1,353,370 in-the-money options with 70,029,751 of spread at Bristol Myers Squibb's 62.50 dollar tender price; age 48 in the 424B4 of 15 Sep 2023","m":"171.4 million dollars gross at the tender price. Net of long-term capital gains on founder shares and ordinary rates on 392,073 restricted shares and the option spread, about 100 million, plus retained founder equity in Candid Therapeutics.","sect":"health","origin":"self","co":"RayzeBio","did":"Co-founded RayzeBio in San Diego in 2020 to build actinium-225 targeted radiopharmaceuticals, listed it at 18 dollars in September 2023 in the worst biotech IPO window in fifteen years, and sold it to Bristol Myers Squibb for 4.1 billion dollars three months later.","started":2020,"startAge":45,"toFirst100":4,"why":"The binding constraint in alpha-emitter therapy was not biology but isotope: world actinium-225 supply ran to a few curies a year. Contracting that supply and building his own Indianapolis radiopharmacy first made RayzeBio the only buyable asset once Novartis proved the market with Pluvicto.","comp":["Novartis","Point Biopharma","Fusion Pharmaceuticals","Perspective Therapeutics"],"obst":"He had to commit to isotope supply and a manufacturing plant before RB-1 had any pivotal data, and then price an IPO into a market where biotech listings were being pulled; the stock broke issue within weeks.","turn":"26 December 2023, when Bristol Myers Squibb agreed to pay 62.50 dollars a share in cash, 247 percent above the IPO price set three months earlier.","band":"b1","ageb":"a5","y100":2024,"u45":false,"years":6,"vel":20,"ageAt100":49,"since100":2},{"id":"BRENT_FREI","n":"Brent Frei","age":60,"city":"Bellevue","country":"US","state":"WA","region":"pnw","nw":0.12,"p":"E","c":0.75,"s":"Smartsheet DEF 14A filed 2024-05-01 (2,128,860 shares, 1.55%); Smartsheet DEF 14A 2021-05-05 (age 55); merger closed 2025-01-22 at $56.50 per share","m":"2,128,860 shares, of which 1,999,459 are outright Class A stock, x $56.50 cash merger price = $120.3M. Cash-settled, so no valuation modelling needed; small deduction for tax offsets prior sales.","sect":"tech","origin":"self","co":"Smartsheet","did":"Founded Smartsheet in 2005 and wrote its first version, after building Onyx Software into a CRM vendor that IPO'd in 1999. Was a Smartsheet employee to 2016 and a director to 2024, and held 2,128,860 shares taken out for $120.3M cash when Blackstone and Vista bought the company in January 2025.","started":2005,"startAge":39,"toFirst100":13,"why":"Frei's bet was that business software fails when it asks people to abandon the grid. Smartsheet put a database and a workflow engine behind a spreadsheet UI, so it needed no training, spread horizontally inside companies, and did not compete for the IT budget that Microsoft Project already owned.","comp":["Asana","Monday.com","Atlassian","Microsoft Project"],"obst":"His first company, Onyx Software, went public in 1999 near the top and then collapsed in the dot-com bust, eventually selling in 2006 for roughly $92M. Frei started Smartsheet in that wreckage and ran it on almost no outside money for its first seven years.","turn":"2006, when Frei recruited Mark Mader from Onvia to take the CEO seat while he stayed on product; the handoff is what let Smartsheet build an enterprise sales organisation he had no appetite to run.","band":"b1","ageb":"a6","y100":2018,"u45":false,"years":21,"vel":5.7,"ageAt100":52,"since100":8},{"id":"JUSTIN_ROSENSTEIN","n":"Justin Rosenstein","age":42,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":0.12,"p":"E","c":0.85,"s":"Asana DEF 14A filed 20 Apr 2026 (ownership as of 23 Mar 2026); ASAN close 9.50 on 21 Aug 2026","m":"12,096,018 shares held (3,773,293 Class A plus 8,898,709 Class B, less 575,984 exercisable options) times the ASAN close of 9.50 on 21 Aug 2026","sect":"tech","origin":"self","co":"Asana","did":"Built Google's Drive precursor and Gmail chat as a Google product manager, prototyped the Facebook Like button at a 2007 hackathon, then left Facebook in 2008 with Dustin Moskovitz to found Asana; he was its CEO to 2010 and president to 2019 and remains a director.","started":2008,"startAge":24,"toFirst100":12,"why":"Work-management software had always been sold to project managers as a reporting tool. Asana gave it away at the bottom to the people doing the work, so it spread through a company before procurement was ever involved - Atlassian's bottom-up motion applied to non-engineers.","comp":["Atlassian","Monday.com","Smartsheet","Wrike"],"obst":"Asana direct-listed in September 2020 with no capital raised and no underwriter support, then fell from over 140 dollars in November 2021 to under 10 dollars, with Moskovitz personally buying stock and lending the company money to fund it through the collapse.","turn":"The September 2020 direct listing on the NYSE, which made a twelve-year-old private founder stake tradeable without diluting it.","band":"b1","ageb":"a4","y100":2020,"u45":true,"years":18,"vel":6.7,"ageAt100":36,"since100":6},{"id":"KENNETH_PANZER","n":"Kenneth Panzer","age":65,"city":"Santa Monica","country":"US","state":"CA","region":"socal","nw":0.12,"p":"E","c":0.85,"s":"Douglas Emmett DEF 14A filed 2026: Kenneth M. Panzer beneficially owned 9,863,381 shares and OP units, 5.6 percent; DEI closed 11.79 dollars on 21 Aug 2026","m":"Disclosed beneficial ownership including 8,293,965 operating-partnership units times market close, 9,863,381 x 11   if(to<0 || to>=order.length || from===to) return;
  order.splice(to, 0, order.splice(from, 1)[0]);
  saveOrder(); render();
}

function filtered(){
  const q = F.q.trim().toLowerCase();
  return ROWS.filter((r)=>{
    if(F.bin!=null && binOf(r.nw)!==F.bin) return false;
    if(F.ageb.size && !F.ageb.has(r.ageb)) return false;
    if(F.band.size && !F.band.has(r.band)) return false;
    if(F.region.size && !F.region.has(r.region)) return false;
    if(F.sect.size && !F.sect.has(r.sect)) return false;
    if(F.origin.size && !F.origin.has(r.origin)) return false;
    if(F.p.size && !F.p.has(r.p)) return false;
    if(q && !(r.n+' '+r.co+' '+r.city+' '+r.state+' '+r.did).toLowerCase().includes(q)) return false;
    return true;
  });
}
function sorted(rs){
  const c = COLS.find((x)=>x.k===sortKey);
  if(!c || !c.get) return rs;
  return [...rs].sort((a,b)=>{ const x=c.get(a), y=c.get(b);
    return (x<y?-1:x>y?1:0)*sortDir; });
}

/* ---- charts ---- */
const TXT='#8a98ad', MUT='#828fa6', GRID='#1c2536';
function barChart(el, items, opt){
  const {label, value, color, w=430} = opt;
  const rowH=opt.rowH||21, padL=opt.padL||104, padR=42, h=items.length*rowH+6;
  const max = Math.max(1, ...items.map(value));
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  items.forEach((d,i)=>{
    const y=i*rowH+3, bw=Math.max(2,(value(d)/max)*(w-padL-padR)), c=color?color(d):'var(--accent)';
    s+=`<text x="${padL-9}" y="${y+11}" text-anchor="end" font-size="11" fill="${TXT}">${esc(label(d))}</text>`;
    s+=`<rect x="${padL}" y="${y+3}" width="${bw}" height="11" rx="4" fill="${c}"></rect>`;
    s+=`<text x="${padL+bw+7}" y="${y+12}" font-size="11" fill="${MUT}" font-variant-numeric="tabular-nums">${value(d)}</text>`;
  });
  el.innerHTML = s+'</svg>';
}

/* Stacked bar, two series: under 45 and 45+. A 2px surface gap sits between the
   segments so the boundary reads without a stroke. */
function stackChart(el, items, opt){
  const {label, w=430} = opt, rowH=21, padL=opt.padL||132, padR=46, h=items.length*rowH+6;
  const max = Math.max(1, ...items.map((d)=>d.a+d.b));
  const span = w-padL-padR;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  items.forEach((d,i)=>{
    const y=i*rowH+6, aw=(d.a/max)*span, bw=(d.b/max)*span;
    s+=`<text x="${padL-9}" y="${y+8}" text-anchor="end" font-size="11" fill="${TXT}">${esc(label(d))}</text>`;
    if(d.a>0) s+=`<rect x="${padL}" y="${y}" width="${Math.max(2,aw)}" height="11" rx="4" fill="${U45C}"></rect>`;
    if(d.b>0) s+=`<rect x="${padL+aw+(d.a>0?2:0)}" y="${y}" width="${Math.max(2,bw-(d.a>0?2:0))}" height="11" rx="4" fill="${O45C}"></rect>`;
    s+=`<text x="${padL+aw+bw+7}" y="${y+9}" font-size="11" fill="${MUT}" font-variant-numeric="tabular-nums">${d.a+d.b}</text>`;
  });
  el.innerHTML = s+'</svg>';
}

function scatter(el, rs){
  const w=430,h=224,padL=40,padB=34,padT=10,padR=10;
  const xs = rs.filter((r)=>r.age!=null);
  const maxX = 85, minX = 20;
  // log y: the band spans 50x, and a linear axis buries the whole sub-$1B half
  const ly=(v)=>Math.log10(v), y0=ly(0.1), y1=ly(5);
  const X=(v)=>padL+((v-minX)/(maxX-minX))*(w-padL-padR);
  const Y=(v)=>padT+(1-(ly(v)-y0)/(y1-y0))*(h-padT-padB);
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  [0.1,0.25,0.5,1,2.5,5].forEach((v)=>{
    s+=`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${w-padR}" y2="${Y(v).toFixed(1)}" stroke="${GRID}" stroke-width="1"></line>`;
    s+=`<text x="${padL-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${MUT}">${v>=1?'$'+v+'B':'$'+v*1000+'M'}</text>`;
  });
  for(let t=20;t<=maxX;t+=10){
    s+=`<text x="${X(t).toFixed(1)}" y="${h-padB+15}" text-anchor="middle" font-size="10" fill="${MUT}">${t}</text>`;
  }
  // the 45 line — the cut the census is organised around, drawn not implied
  s+=`<line x1="${X(45).toFixed(1)}" y1="${padT}" x2="${X(45).toFixed(1)}" y2="${h-padB}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"></line>`;
  s+=`<text x="${(X(45)-5).toFixed(1)}" y="${padT+9}" text-anchor="end" font-size="9.5" fill="var(--accent)">under 45</text>`;
  s+=`<text x="${(padL+(w-padR))/2}" y="${h-2}" text-anchor="middle" font-size="10" fill="${MUT}">age</text>`;
  xs.forEach((r)=>{
    s+=`<circle cx="${X(r.age).toFixed(1)}" cy="${Y(r.nw).toFixed(1)}" r="4.2" fill="${OCOL[r.origin]}" fill-opacity=".82" stroke="var(--bg)" stroke-width="2" data-id="${r.id}"></circle>`;
  });
  el.innerHTML = s+'</svg>';
}

const split = (rs,fn,k)=>({a:rs.filter((r)=>fn(r)===k&&r.u45).length, b:rs.filter((r)=>fn(r)===k&&!r.u45).length});

/* Log-spaced net-worth bins. The band spans 50x, so equal-width bins would put
   two thirds of the census in one bar; equal ratios put the same multiplicative
   distance in every bar, which is what makes the shape readable. */
const NB = 10, LO = Math.log10(0.1), HI = Math.log10(5);
const BINS = Array.from({length:NB}, (_,i)=>({
  i, lo: Math.pow(10, LO+(HI-LO)*i/NB), hi: Math.pow(10, LO+(HI-LO)*(i+1)/NB) }));
const binOf = (nw)=>Math.min(NB-1, Math.floor((Math.log10(nw)-LO)/((HI-LO)/NB)));
const SCOL = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

/* Seven named sectors plus Other. Eight is the ceiling for distinguishable
   categorical hues — a ninth would have to be a generated colour, and a legend
   whose swatches cannot be told apart is a legend that has stopped working. */
function sectorSlots(rs){
  const n = {}; rs.forEach((r)=>n[r.sect]=(n[r.sect]||0)+1);
  const ranked = Object.entries(n).sort((a,b)=>b[1]-a[1]);
  const top = ranked.slice(0,7).map(([k])=>k);
  const slots = top.map((k,i)=>({k, n:SECTORS[k], c:n[k], col:SCOL[i]}));
  const restC = ranked.slice(7).reduce((a,[,v])=>a+v,0);
  if(restC) slots.push({k:'__other', n:'Other', c:restC, col:SCOL[7],
    members:ranked.slice(7).map(([k])=>k)});
  return slots;
}

function distChart(el, rs, slots){
  const w=1000, h=330, padL=52, padR=14, padT=14, padB=92;
  const cols = BINS.map((b)=>{
    const inB = rs.filter((r)=>binOf(r.nw)===b.i);
    return {...b, total:inB.length, seg: slots.map((s)=>({...s,
      v: inB.filter((r)=> s.k==='__other' ? s.members.includes(r.sect) : r.sect===s.k).length}))};
  });
  const max = Math.max(1, ...cols.map((c)=>c.total));
  // a round tick ceiling reads better than a ragged max
  const step = max<=20?5:max<=60?10:max<=150?25:50, top = Math.ceil(max/step)*step;
  const bw = (w-padL-padR)/NB, gap = Math.min(14, bw*0.22);
  const Y=(v)=>padT+(1-v/top)*(h-padT-padB);
  const fmt=(v)=> v>=1 ? '$'+(+v.toFixed(1))+'B' : '$'+Math.round(v*1000)+'M';
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">`;
  for(let g=0; g<=top; g+=step){
    s+=`<line x1="${padL}" y1="${Y(g).toFixed(1)}" x2="${w-padR}" y2="${Y(g).toFixed(1)}" stroke="${GRID}" stroke-width="1" stroke-dasharray="${g?'2 4':'0'}"></line>`;
    s+=`<text x="${padL-8}" y="${(Y(g)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="${MUT}" font-variant-numeric="tabular-nums">${g}</text>`;
  }
  cols.forEach((c)=>{
    const x = padL + c.i*bw + gap/2, cw = bw-gap;
    let yTop = Y(0);
    const on = F.bin===c.i;
    if(on) s+=`<rect x="${(x-3).toFixed(1)}" y="${padT}" width="${(cw+6).toFixed(1)}" height="${h-padT-padB}" fill="var(--panel)" rx="4"></rect>`;
    c.seg.forEach((sg)=>{
      if(!sg.v) return;
      const sh=(sg.v/top)*(h-padT-padB);
      // 2px surface gap between segments so the boundary reads without a stroke
      s+=`<rect x="${x.toFixed(1)}" y="${(yTop-sh).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1,sh-2).toFixed(1)}" fill="${sg.col}" data-bin="${c.i}" data-sect="${sg.k}"></rect>`;
      yTop -= sh;
    });
    if(c.total) s+=`<text x="${(x+cw/2).toFixed(1)}" y="${(Y(c.total)-7).toFixed(1)}" text-anchor="middle" font-size="11" fill="${on?'var(--txt)':MUT}" font-variant-numeric="tabular-nums" font-weight="600">${c.total}</text>`;
    s+=`<text x="${(x+cw/2).toFixed(1)}" y="${h-padB+16}" text-anchor="end" font-size="10.5" fill="${on?'var(--txt)':MUT}" font-family="var(--mono)" transform="rotate(-38 ${(x+cw/2).toFixed(1)} ${h-padB+16})">${fmt(c.lo)}-${fmt(c.hi)}</text>`;
  });
  s+=`<text x="${padL+(w-padL-padR)/2}" y="${h-6}" text-anchor="middle" font-size="11" fill="${MUT}" font-family="var(--mono)">net worth, log scale</text>`;
  s+=`<text x="14" y="${padT+(h-padT-padB)/2}" text-anchor="middle" font-size="11" fill="${MUT}" transform="rotate(-90 14 ${padT+(h-padT-padB)/2})">individuals</text>`;
  el.innerHTML = s+'</svg>';
}

/* Five-year cohorts, positioned on a real year axis rather than as equal-width
   categories — the spacing is proportional to time, so a gap in the record shows
   as a gap. Cohort = the year the fortune crossed $100M. */
const CO_LO = 1980, CO_HI = 2030, CO_W = 5;
const COHORTS = Array.from({length:(CO_HI-CO_LO)/CO_W}, (_,i)=>({lo:CO_LO+i*CO_W, hi:CO_LO+(i+1)*CO_W}));
const cohortOf = (y)=> y==null ? null : Math.min(CO_HI-CO_W, Math.max(CO_LO, Math.floor(y/CO_W)*CO_W));
let timeMode = 'share';

function timeChart(el, rs, slots){
  const w=1000, h=320, padL=54, padR=14, padT=14, padB=54;
  const cells = COHORTS.map((c)=>{
    const inC = rs.filter((r)=>cohortOf(r.y100)===c.lo);
    return {...c, n:inC.length, worth:inC.reduce((a,r)=>a+r.nw,0),
      seg: slots.map((s)=>{
        const m = inC.filter((r)=> s.k==='__other' ? s.members.includes(r.sect) : r.sect===s.k);
        return {...s, n:m.length, worth:m.reduce((a,r)=>a+r.nw,0)};
      })};
  });
  const val = (c)=> timeMode==='people' ? c.n : timeMode==='worth' ? c.worth : (c.n?1:0);
  const segVal = (sg,c)=> timeMode==='people' ? sg.n : timeMode==='worth' ? sg.worth
    : (c.n ? (sg.n/c.n) : 0);
  const max = timeMode==='share' ? 1 : Math.max(1, ...cells.map(val));
  const step = timeMode==='share' ? 0.25 : max<=20?5:max<=60?20:25;
  const top = timeMode==='share' ? 1 : Math.ceil(max/step)*step;
  const X=(y)=>padL+((y-CO_LO)/(CO_HI-CO_LO))*(w-padL-padR);
  const Y=(v)=>padT+(1-v/top)*(h-padT-padB);
  const yfmt=(v)=> timeMode==='share' ? Math.round(v*100)+'%' : timeMode==='worth' ? '$'+v+'B' : v;
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  for(let g=0; g<=top+1e-9; g+=step){
    s+=`<line x1="${padL}" y1="${Y(g).toFixed(1)}" x2="${w-padR}" y2="${Y(g).toFixed(1)}" stroke="${GRID}" stroke-width="1" stroke-dasharray="${g?'2 4':'0'}"></line>`;
    s+=`<text x="${padL-8}" y="${(Y(g)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="${MUT}" font-variant-numeric="tabular-nums">${yfmt(g)}</text>`;
  }
  const bw=(X(CO_LO+CO_W)-X(CO_LO)), gap=Math.min(10,bw*0.16);
  const MIN_SHARE = 5;   // a share bar drawn from one or two people reads as 100% of nothing
  cells.forEach((c)=>{
    if(!c.n) return;
    if(timeMode==='share' && c.n<MIN_SHARE){
      const x0=X(c.lo)+gap/2;
      s+=`<rect x="${x0.toFixed(1)}" y="${Y(1).toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${(h-padT-padB).toFixed(1)}" fill="none" stroke="${GRID}" stroke-width="1" stroke-dasharray="3 3"></rect>`;
      s+=`<text x="${(x0+(bw-gap)/2).toFixed(1)}" y="${(padT+(h-padT-padB)/2).toFixed(1)}" text-anchor="middle" font-size="10" fill="${MUT}">n=${c.n}</text>`;
      return;
    }
    const x=X(c.lo)+gap/2, cw=bw-gap;
    let yTop=Y(0);
    c.seg.forEach((sg)=>{
      const v=segVal(sg,c); if(!v) return;
      const sh=(v/top)*(h-padT-padB);
      s+=`<rect x="${x.toFixed(1)}" y="${(yTop-sh).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1,sh-2).toFixed(1)}" fill="${sg.col}" data-co="${c.lo}" data-sect="${sg.k}"></rect>`;
      yTop-=sh;
    });
    const lab = timeMode==='worth' ? '$'+Math.round(c.worth)+'B' : c.n;
    s+=`<text x="${(x+cw/2).toFixed(1)}" y="${(Y(timeMode==='share'?1:val(c))-7).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="${MUT}" font-variant-numeric="tabular-nums" font-weight="600">${lab}</text>`;
  });
  for(let y=CO_LO; y<=CO_HI-CO_W; y+=10)
    s+=`<text x="${X(y+CO_W/2).toFixed(1)}" y="${h-padB+18}" text-anchor="middle" font-size="11" fill="${MUT}" font-family="var(--mono)">${y}</text>`;
  s+=`<text x="${padL+(w-padL-padR)/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="${MUT}" font-family="var(--mono)">year the fortune crossed $100M</text>`;
  el.innerHTML=s+'</svg>';
  return cells;
}

/* Median years to the first $100M, by cohort. A falling line means fortunes are
   arriving faster; it is also the measure most exposed to the survivorship caveat
   below, so it is drawn small and beside its own warning. */
function speedChart(el, rs){
  const w=1000, h=170, padL=54, padR=14, padT=12, padB=42;
  const pts = COHORTS.map((c)=>{
    const v=rs.filter((r)=>cohortOf(r.y100)===c.lo).map((r)=>r.toFirst100).filter((x)=>x!=null).sort((a,b)=>a-b);
    return {lo:c.lo, n:v.length, med: v.length ? (v.length%2 ? v[v.length>>1] : (v[(v.length>>1)-1]+v[v.length>>1])/2) : null};
  }).filter((p)=>p.n>=3);
  const max=Math.max(10,...pts.map((p)=>p.med));
  const topv=Math.ceil(max/5)*5;
  const X=(y)=>padL+((y+CO_W/2-CO_LO)/(CO_HI-CO_LO))*(w-padL-padR);
  const Y=(v)=>padT+(1-v/topv)*(h-padT-padB);
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  for(let g=0; g<=topv; g+=5){
    s+=`<line x1="${padL}" y1="${Y(g).toFixed(1)}" x2="${w-padR}" y2="${Y(g).toFixed(1)}" stroke="${GRID}" stroke-width="1" stroke-dasharray="${g?'2 4':'0'}"></line>`;
    s+=`<text x="${padL-8}" y="${(Y(g)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="${MUT}" font-variant-numeric="tabular-nums">${g}</text>`;
  }
  s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(p.lo).toFixed(1)+' '+Y(p.med).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>`;
  pts.forEach((p)=>{
    s+=`<circle cx="${X(p.lo).toFixed(1)}" cy="${Y(p.med).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"></circle>`;
    s+=`<text x="${X(p.lo).toFixed(1)}" y="${(Y(p.med)-11).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="${MUT}" font-variant-numeric="tabular-nums">${p.med}</text>`;
  });
  for(let y=CO_LO; y<=CO_HI-CO_W; y+=10)
    s+=`<text x="${X(y).toFixed(1)}" y="${h-padB+18}" text-anchor="middle" font-size="11" fill="${MUT}" font-family="var(--mono)">${y}</text>`;
  s+=`<text x="14" y="${padT+(h-padT-padB)/2}" text-anchor="middle" font-size="11" fill="${MUT}" transform="rotate(-90 14 ${padT+(h-padT-padB)/2})">median yrs</text>`;
  el.innerHTML=s+'</svg>';
}

function drawCharts(rs){
  const slots = sectorSlots(ROWS);
  distChart($('#cDist'), rs, slots);
  $('#distSub').innerHTML = `${rs.length} of ${ROWS.length} records shown &middot; bars stack by sector &middot; <b style="color:var(--dim)">click a bar to filter the table</b>`;
  $('#lDist').innerHTML = slots.map((s,i)=>{
    const shown = rs.filter((r)=> s.k==='__other' ? s.members.includes(r.sect) : r.sect===s.k).length;
    const off = F.sect.size && !(s.k==='__other' ? s.members.some((m)=>F.sect.has(m)) : F.sect.has(s.k));
    return `<button data-s="${s.k}" class="${off?'off':''}${!off&&F.sect.size?' on':''}">`
      + `<span class="rk">${i+1}</span><i style="background:${s.col}"></i>${esc(s.n)}<span class="ct">${shown}</span></button>`;
  }).join('');
  $('#lDist').querySelectorAll('button').forEach((b)=>b.onclick=()=>{
    const k=b.dataset.s;
    const keys = k==='__other' ? (slots.find((x)=>x.k==='__other').members) : [k];
    const allOn = keys.every((x)=>F.sect.has(x));
    keys.forEach((x)=> allOn ? F.sect.delete(x) : F.sect.add(x));
    render();
  });
  barChart($('#cAge'), AGEBANDS.map((b)=>({...b, c:rs.filter((r)=>r.ageb===b.id).length})),
    {label:(d)=>d.n, value:(d)=>d.c, rowH:22, padL:74,
     color:(d)=>U45.includes(d.id)?U45C:O45C});
  const nu=rs.filter((r)=>r.u45).length;
  $('#lAge').innerHTML = `<span><i style="background:${U45C}"></i>Under 45 <span style="color:var(--mut)">${nu}</span></span>`
    + `<span><i style="background:${O45C}"></i>45 and over <span style="color:var(--mut)">${rs.filter((r)=>r.u45===false).length}</span></span>`
    + (rs.length?`<span style="color:var(--mut)">${Math.round(nu/rs.length*100)}% under 45</span>`:'');
  scatter($('#cScat'), rs);
  $('#lScat').innerHTML = Object.entries(ORIGINS).map(([k,v])=>
    `<span><i style="background:${OCOL[k]}"></i>${v} <span style="color:var(--mut)">${rs.filter((r)=>r.origin===k).length}</span></span>`).join('');
  const sec = Object.entries(SECTORS).map(([k,n])=>({n, ...split(rs,(r)=>r.sect,k)}))
    .filter((d)=>d.a+d.b).sort((x,y)=>(y.a+y.b)-(x.a+x.b));
  stackChart($('#cSect'), sec, {label:(d)=>d.n});
  $('#lSect').innerHTML = `<span><i style="background:${U45C}"></i>Under 45</span><span><i style="background:${O45C}"></i>45 and over</span>`;
  /* over time */
  const cells = timeChart($('#cTime'), rs, slots);
  speedChart($('#cSpeed'), rs);
  $('#lTime').innerHTML = $('#lDist').innerHTML;
  $('#lTime').querySelectorAll('button').forEach((b)=>b.onclick=()=>{
    const k=b.dataset.s, keys = k==='__other' ? slots.find((x)=>x.k==='__other').members : [k];
    const allOn = keys.every((x)=>F.sect.has(x));
    keys.forEach((x)=> allOn ? F.sect.delete(x) : F.sect.add(x));
    render();
  });
  // a sentence the data writes for itself, comparing the newest full cohort to the oldest
  // only complete cohorts, and never let the Other bucket be the headline sector —
  // naming an actual industry is the whole point of the sentence
  const full = cells.filter((c)=>c.n>=10 && c.hi<=ASOF_YEAR);
  if(full.length>=2){
    const a=full[0], z=full[full.length-1];
    const nameOf=(s)=> s.k==='__other' ? 'other industries' : SECTORS[s.k].toLowerCase();
    const topZ=[...z.seg].filter((s)=>s.k!=='__other').sort((x,y)=>y.n-x.n)[0];
    const thenS=a.seg.find((s)=>s.k===topZ.k);
    const then=thenS ? Math.round(thenS.n/a.n*100) : 0;
    const now=Math.round(topZ.n/z.n*100);
    const B=(x)=>`<b style="color:var(--txt)">${x}</b>`;
    $('#timeSub').innerHTML =
      `Fortunes that crossed $100M in ${B(z.lo+'\u2013'+(z.hi-1))} are worth ${B('$'+Math.round(z.worth)+'B')} today, `
      + `and ${B(now+'%')} of them came out of ${B(nameOf(topZ))} \u2014 against ${then}% of the ${a.lo}\u2013${a.hi-1} cohort. `
      + `Each bar is a five-year cohort placed on a real year axis.`;
  }
  $('#timeCaveat').innerHTML = `<b>What this can and cannot show.</b> A person's era here is the year they first crossed $100M, `
    + `derived from when they started plus how long it took. The bar heights in <em>$B held today</em> are current net worth, not money booked in that year &mdash; `
    + `an older cohort has had decades to compound. The <em>share</em> view is the robust one: it asks what kind of business each era's fortunes came out of. `
    + `Two biases run the other way and both flatter the recent past. This census only holds people currently worth $100M&ndash;$5B, so anyone who crossed the line in the 1980s `
    + `and then passed $5B, lost it, or died is simply absent &mdash; older cohorts are survivors, not samples. Cohorts of fewer than five people are left as an outline in the share view rather than drawn as a percentage, because a share computed from one person is not a share. And the newest bar is a partial cohort: it can only hold fortunes that crossed the line by ${ASOF_YEAR}, so it is short by construction.`;
  const reg = Object.entries(REGIONS).map(([k,n])=>({n, ...split(rs,(r)=>r.region,k)}))
    .filter((d)=>d.a+d.b).sort((x,y)=>(y.a+y.b)-(x.a+x.b));
  stackChart($('#cRegion'), reg, {label:(d)=>d.n});
}

/* ---- table ---- */
function drawHead(){
  $('#tableScroll').style.setProperty('--gt', gridTemplate());
  $('#hdRow').innerHTML = cols().map((c,i)=>{
    const on = sortKey===c.k;
    const inner = c.nosort ? c.h
      : `<button class="${on?'srt':''}" data-k="${c.k}">${c.h}${on?(sortDir<0?' ↓':' ↑'):''}</button>`;
    return `<div class="${c.r?'r':''}" draggable="true" data-i="${i}" title="Drag to reorder. Alt+Left or Alt+Right to move with the keyboard.">${inner}</div>`;
  }).join('');
  $('#hdRow').querySelectorAll('button').forEach((b)=>b.onclick=()=>{
    const k=b.dataset.k;
    if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=(k==='n'||k==='co'||k==='city'||k==='sect'||k==='origin')?1:-1;}
    render();
  });
  let from=null;
  $('#hdRow').querySelectorAll('[data-i]').forEach((el)=>{
    el.ondragstart=(e)=>{ from=+el.dataset.i; el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(from));}catch(_){} };
    el.ondragend=()=>{ from=null; $('#hdRow').querySelectorAll('[data-i]').forEach((x)=>x.classList.remove('dragging','dropL','dropR')); };
    el.ondragover=(e)=>{ if(from===null) return; e.preventDefault(); e.dataTransfer.dropEffect='move';
      const to=+el.dataset.i;
      $('#hdRow').querySelectorAll('[data-i]').forEach((x)=>x.classList.remove('dropL','dropR'));
      if(to!==from) el.classList.add(to>from?'dropR':'dropL'); };
    el.ondrop=(e)=>{ e.preventDefault(); if(from===null) return; moveCol(from, +el.dataset.i); };
    // keyboard path, so reordering is not mouse-only
    el.querySelectorAll('button').forEach((b)=>b.addEventListener('keydown',(e)=>{
      if(!e.altKey || (e.key!=='ArrowLeft' && e.key!=='ArrowRight')) return;
      e.preventDefault();
      const i=+el.dataset.i;
      moveCol(i, e.key==='ArrowLeft' ? i-1 : i+1);
      const nb=$('#hdRow').querySelector(`[data-i="${e.key==='ArrowLeft'?i-1:i+1}"] button`);
      if(nb) nb.focus();
    }));
  });
}
function drawRows(rs){
  $('#rows').innerHTML = rs.map((r,i)=>
    `<div class="grid row${sel===r.id?' on':''}" data-id="${r.id}">${cols().map((c)=>c.cell(r,i)).join('')}</div>`).join('')
    || `<div class="empty"><b>Nothing matches those filters</b>Clear one and try again.</div>`;
  $('#rows').querySelectorAll('.row').forEach((el)=>el.onclick=()=>{ sel=el.dataset.id; render(); });
}

/* ---- dossier ---- */
function timeline(r){
  if(!r.started) return '';
  const born = r.age!=null ? ASOF_YEAR-r.age : null;
  const t0 = born ?? r.started, t1 = ASOF_YEAR, span = Math.max(1, t1-t0);
  const at = (y)=>((y-t0)/span*100);
  const c100 = r.toFirst100!=null ? r.started+r.toFirst100 : null;
  // labels are centred on their point, so one at 0% or 100% would hang off the
  // panel — pin the end ones to their edge instead of centring them
  const lb=(pct,cls,txt)=>{ const p=at(pct);
    const st = p<10 ? 'left:0;transform:none' : p>90 ? 'right:0;transform:none' : `left:${p.toFixed(1)}%`;
    return `<div class="lb ${cls}" style="${st}">${txt}</div>`; };
  let s = `<div class="tl"><div class="ax"></div>`;
  s += `<div class="fill" style="left:${at(r.started).toFixed(1)}%;right:0"></div>`;
  if(born){ s+=`<div class="pt" style="left:${at(born).toFixed(1)}%;background:var(--mut)"></div>`+lb(born,'t',`born ${born}`); }
  s += `<div class="pt" style="left:${at(r.started).toFixed(1)}%;background:var(--accent)"></div>`+lb(r.started,'b',`started ${r.started}, age ${r.startAge}`);
  if(c100) s+=`<div class="pt" style="left:${at(c100).toFixed(1)}%;background:var(--estimated)"></div>`+lb(c100,'t',`$100M ${c100}`);
  s += `<div class="pt" style="left:100%;background:var(--reported)"></div><div class="lb b" style="right:0;transform:none">${money(r.nw)}</div>`;
  return s+'</div>';
}
function drawDossier(){
  const r = ROWS.find((x)=>x.id===sel);
  if(!r){ $('#dossier').innerHTML = `<div class="empty"><b>Select a person</b>Every row opens a dossier: what they built, how long it took, why it worked, who they beat, and what nearly stopped them.</div>`; return; }
  const sec = (h,b)=>b?`<div class="ds"><h5>${h}</h5>${b}</div>`:'';
  $('#dossier').innerHTML =
    `<div class="dh">
       <h2>${esc(r.n)}</h2>
       <div class="meta">${r.age!=null?'Age '+r.age+' &middot; ':''}${esc(r.city)}, ${esc(r.state)} &middot; ${esc(SECTORS[r.sect])}<br>${esc(r.co)} &middot; ${ORIGINS[r.origin]}</div>
       <div class="big"><b>${money(r.nw)}</b><span><span class="tag ${r.p}">${r.p}</span> ${PROV[r.p]} &middot; as of ${ASOF}</span></div>
       ${timeline(r)}
     </div>
     <div class="kpi">
       <div><div class="k">Years to today</div><div class="v">${r.years??'-'}</div></div>
       <div><div class="k">To first $100M</div><div class="v">${r.toFirst100??'-'} <small>yrs</small></div></div>
       <div><div class="k">Rate</div><div class="v">${r.vel!=null?'$'+r.vel+'M':'-'}<small>/yr</small></div></div>
     </div>
     ${sec('What they did', `<p>${esc(r.did)}</p>`)}
     ${sec('Why it worked', `<p>${esc(r.why)}</p>`)}
     ${sec('The turning point', `<p>${esc(r.turn)}</p>`)}
     ${sec('What they overcame', `<p>${esc(r.obst)}</p>`)}
     ${sec('Who they were up against', `<div class="rival">${(r.comp||[]).map((c)=>`<span>${esc(c)}</span>`).join('')}</div>`)}
     ${sec('Provenance', `<table class="pv">
        <tr><td>Tier</td><td><span class="tag ${r.p}">${r.p}</span> ${PROV[r.p]}, confidence ${r.c}</td></tr>
        <tr><td>Method</td><td>${esc(r.m)}</td></tr>
        <tr><td>Source</td><td>${esc(r.s)}</td></tr>
        <tr><td>Began</td><td>${r.started}, at age ${r.startAge}</td></tr>
        ${r.ageAt100!=null?`<tr><td>Hit $100M</td><td>at age ${r.ageAt100}, then compounded ${r.since100} more years</td></tr>`:''}
      </table>`)}`;
}

/* ---- filters ---- */
function drawFilters(){
  const grp = (el, set, items) => {
    $(el).innerHTML = items.map((it)=>
      `<button class="chip${set.has(it.k)?' on':''}" data-k="${it.k}"><span>${esc(it.n)}</span><span class="ct">${it.c}</span></button>`).join('');
    $(el).querySelectorAll('.chip').forEach((b)=>b.onclick=()=>{
      const k=b.dataset.k; set.has(k)?set.delete(k):set.add(k); render(); });
  };
  const cnt = (fn,k)=>ROWS.filter((r)=>fn(r)===k).length;
  grp('#fAge', F.ageb, AGEBANDS.map((b)=>({k:b.id, n:b.n, c:cnt((r)=>r.ageb,b.id)})));
  grp('#fBand', F.band, BANDS.map((b)=>({k:b.id, n:b.n, c:cnt((r)=>r.band,b.id)})));
  grp('#fRegion', F.region, Object.entries(REGIONS).map(([k,n])=>({k,n,c:cnt((r)=>r.region,k)})).sort((a,b)=>b.c-a.c));
  grp('#fSect', F.sect, Object.entries(SECTORS).map(([k,n])=>({k,n,c:cnt((r)=>r.sect,k)})).filter((x)=>x.c).sort((a,b)=>b.c-a.c));
  grp('#fOrigin', F.origin, Object.entries(ORIGINS).map(([k,n])=>({k,n,c:cnt((r)=>r.origin,k)})));
  grp('#fProv', F.p, Object.entries(PROV).map(([k,n])=>({k,n,c:cnt((r)=>r.p,k)})));
}

function render(){
  const rs = sorted(filtered());
  drawFilters(); drawHead(); drawCharts(rs); drawRows(rs); drawDossier();
  $('#tCount').textContent = rs.length;
  $('#tMed').textContent = rs.length ? money(med(rs.map((r)=>r.nw))) : '-';
  const ys = rs.map((r)=>r.years).filter((v)=>v!=null);
  $('#tYrs').textContent = ys.length ? med(ys)+' yrs' : '-';
  const as = rs.map((r)=>r.startAge).filter((v)=>v!=null);
  $('#tAge').textContent = as.length ? med(as) : '-';
  const nu = rs.filter((r)=>r.u45).length;
  $('#tU45').textContent = rs.length ? `${nu} (${Math.round(nu/rs.length*100)}%)` : '-';
}

$('#q').oninput = (e)=>{ F.q=e.target.value; render(); };
$('#reset').onclick = ()=>{ F.bin=null; [F.ageb,F.band,F.region,F.sect,F.origin,F.p].forEach((s)=>s.clear()); F.q=''; $('#q').value=''; render(); };
$('#only45').onclick = ()=>{ const on=U45.every((k)=>F.ageb.has(k)) && F.ageb.size===4;
  F.ageb.clear(); if(!on) U45.forEach((k)=>F.ageb.add(k)); render(); };
$('#hU45').textContent = ROWS.filter((r)=>r.u45).length;
$('#colReset').onclick = ()=>{ order = COLS.map((c)=>c.k); saveOrder(); render(); };
$('#hAsof').textContent = ASOF;
$('#hCount').textContent = ROWS.length;
$('#hStates').textContent = new Set(ROWS.map((r)=>r.state)).size;
$('#hTotal').textContent = '$'+Math.round(ROWS.reduce((a,r)=>a+r.nw,0))+'B';
$('#note').innerHTML = `<b>What this is, and what it is not.</b> There is no complete list of America&rsquo;s $100M&ndash;$5B fortunes, and there cannot be: on the standard estimates something like 12,000&ndash;15,000 US households hold more than $100M, no public source enumerates them, and privately-held wealth is by construction undocumented. This is a deliberately spread census of ${ROWS.length} people &mdash; sampled across every band, region and sector so the <em>shape</em> of the population is legible &mdash; not a ranking and not a complete roster. Every figure carries a provenance tag: <span class="tag R">R</span> published by Forbes or a comparable named list, <span class="tag E">E</span> modelled from an SEC-disclosed stake times a fetched price, <span class="tag I">I</span> third-party or dated estimate. Treat E and I as directional. <b>Two known artifacts.</b> The published sub-$1B cohort skews female, because Forbes&rsquo; Self-Made Women list is nearly the only publisher that verifies figures below $1B &mdash; that skew measures publishing, not wealth. And private industrial and family fortunes are systematically under-represented against listed-equity ones, because they surface only when a company sells. Figures move daily with share prices; this snapshot is ${ASOF}.`;

const tip=$('#tip');

/* tabs */
$('#tabs').querySelectorAll('button').forEach((b)=>b.onclick=()=>{
  $('#tabs').querySelectorAll('button').forEach((x)=>x.classList.toggle('on', x===b));
  document.querySelectorAll('.pane').forEach((p)=>p.classList.toggle('on', p.id==='p-'+b.dataset.p));
  render();
});

$('#timeModes').querySelectorAll('button').forEach((b)=>b.onclick=()=>{
  timeMode=b.dataset.m;
  $('#timeModes').querySelectorAll('button').forEach((x)=>x.classList.toggle('on', x===b));
  render();
});

/* click a bar to filter the table to that net-worth bin */
$('#cDist').addEventListener('click',(e)=>{
  const b=e.target.dataset && e.target.dataset.bin;
  if(b==null) return;
  F.bin = (F.bin===+b) ? null : +b;
  render();
});
$('#cDist').addEventListener('mousemove',(e)=>{
  const t2=e.target, b=t2.dataset && t2.dataset.bin;
  if(b==null){ tip.style.opacity=0; return; }
  const bin=BINS[+b], k=t2.dataset.sect;
  const inB=ROWS.filter((r)=>binOf(r.nw)===+b);
  const nm = k==='__other' ? 'Other' : SECTORS[k];
  const cnt = inB.filter((r)=> k==='__other' ? !sectorSlots(ROWS).slice(0,7).some((s)=>s.k===r.sect) : r.sect===k).length;
  const fmt=(v)=> v>=1 ? '$'+(+v.toFixed(1))+'B' : '$'+Math.round(v*1000)+'M';
  tip.innerHTML=`<b>${esc(nm)}</b><br><span>${cnt} of ${inB.length} in ${fmt(bin.lo)}-${fmt(bin.hi)}</span>`;
  tip.style.opacity=1; tip.style.left=Math.min(innerWidth-244,e.clientX+13)+'px'; tip.style.top=(e.clientY+13)+'px';
});
$('#cDist').addEventListener('mouseleave',()=>tip.style.opacity=0);

/* hover tooltips on the scatter */
$('#cScat').addEventListener('mousemove',(e)=>{
  const t=e.target;
  if(t.tagName==='circle'){ const r=ROWS.find((x)=>x.id===t.dataset.id);
    tip.innerHTML=`<b>${esc(r.n)}</b><br><span>${money(r.nw)} &middot; ${r.years} yrs &middot; ${ORIGINS[r.origin]}</span><br><span>${esc(r.co)}</span>`;
    tip.style.opacity=1; tip.style.left=Math.min(innerWidth-244,e.clientX+13)+'px'; tip.style.top=(e.clientY+13)+'px';
  } else tip.style.opacity=0;
});
$('#cScat').addEventListener('mouseleave',()=>tip.style.opacity=0);
$('#cScat').addEventListener('click',(e)=>{ if(e.target.tagName==='circle'){ sel=e.target.dataset.id; render();
  const el=document.querySelector(`.row[data-id="${sel}"]`); if(el) el.scrollIntoView({block:'center'}); }});

render();
</script>
