<title>The $100M Census</title>
<style>
:root{
  --bg:#0a0e16; --bg2:#0d121d; --panel:#101725; --panel2:#0c121e; --line:#1c2536;
  --txt:#e8eef7; --dim:#8a98ad; --mut:#828fa6;
  --accent:#5b8cff; --glow:#6ea8ff; --accent-fill:#3056c4;
  --reported:#3fd68a; --estimated:#f5b042; --inferred:#ff6b7a;
  /* Categorical slots for origin. Validated all-pairs on --bg2 in dark mode:
     lightness band PASS, chroma PASS, CVD worst dE 8.4, normal-vision worst
     dE 19.8, contrast PASS. Every use also carries a text label, so identity
     is never colour-alone. */
  --self:#5b8cff; --inherited:#c98500; --mixed:#199e70;
  /* Eight stacked-segment slots. Validated as a set against --bg in dark mode on the
     adjacent pairlist, which is what a stack is: lightness band, chroma, CVD worst
     dE 8.4, normal-vision worst dE 19.3, contrast — all pass. Eight is the ceiling,
     so the sector list folds to the top seven plus Other rather than cycling hues. */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:236px 1fr 372px;grid-template-rows:58px 1fr;height:100vh}
.cell{position:relative;overflow:hidden;min-width:0;min-height:0}

#top{grid-column:1/4;display:flex;align-items:center;gap:20px;padding:0 22px;background:linear-gradient(180deg,#0e1422,#0a0e16);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;margin:0}
.logo .mk{width:22px;height:22px;border-radius:6px;background:radial-gradient(circle at 30% 30%,var(--glow),#2a5bd0);box-shadow:0 0 14px rgba(91,140,255,.5)}
.logo small{color:var(--mut);font-weight:400;font-size:12px}
.hstat{color:var(--dim);font-size:12px}.hstat b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.hsep{width:1px;height:24px;background:var(--line)}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--mut);font-size:12px}

#left,#right{background:var(--bg2);overflow-y:auto}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
.sec{padding:15px 15px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.srch{width:100%;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-family:var(--sans);font-size:13px;outline:none}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.12)}
.chip{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 9px;margin:2px 0;background:none;border:0;border-left:2px solid transparent;cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--dim);text-align:left;transition:.12s}
.chip:hover{color:var(--txt)}
.chip.on{color:var(--txt);border-left-color:var(--accent);font-weight:600}
.chip .ct{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.clr{background:none;border:0;color:var(--accent);cursor:pointer;font-size:11px;font-family:var(--sans);padding:0}

#main{overflow-y:auto;padding:0}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:13px 14px 11px;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--mut);margin-bottom:-1px}
.tabs button:hover{color:var(--dim)}
.tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pane{display:none}.pane.on{display:block}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.fig.wide{grid-column:1/-1}
.slgd{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.slgd button{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:5px 10px;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--dim);transition:.12s}
.slgd button:hover{border-color:var(--dim);color:var(--txt)}
.slgd button.on{border-color:var(--accent);color:var(--txt);background:var(--panel)}
.slgd button.off{opacity:.42}
.slgd i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.slgd .rk{color:var(--mut);font-size:10.5px}
.slgd .ct{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:600}
.hint{color:var(--mut);font-size:11.5px;margin:0 0 10px;font-family:var(--mono)}
.modes{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;margin:0 0 14px;width:fit-content}
.modes button{background:none;border:0;padding:6px 12px;cursor:pointer;font-family:var(--sans);font-size:12px;color:var(--dim);border-radius:6px}
.modes button.on{background:var(--accent-fill);color:#fff;font-weight:600}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.caveat{margin:12px 0 0;font-size:11.5px;line-height:1.6;color:var(--mut);border-left:2px solid var(--line);padding-left:11px}
.caveat b{color:var(--dim)}
.fig{background:var(--bg);padding:14px 16px 12px;min-width:0}
.fig h3{margin:0 0 2px;font-size:12.5px;font-weight:600;color:var(--txt)}
.fig p.sub{margin:0 0 10px;font-size:11.5px;color:var(--mut);line-height:1.45}
/* Each chart SVG carries width/height attributes as well as a viewBox. Without
   them an SVG has no intrinsic aspect ratio, height:auto resolves to the CSS
   default 150px, and the content letterboxes inside its own box. Do not remove. */
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dim)}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tbar .n{font-size:12px;color:var(--dim)}.tbar .n b{color:var(--txt);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:var(--gt);gap:9px;align-items:center;padding:0 16px;min-width:1010px}
#tableScroll{overflow-x:auto}
.hd{position:sticky;top:44px;background:var(--bg);border-bottom:1px solid var(--line);z-index:4;height:32px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.hd button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.hd > div{cursor:grab;position:relative}
.hd > div[draggable="true"]:active{cursor:grabbing}
.hd .dragging{opacity:.4}
.hd .dropL::before,.hd .dropR::after{content:'';position:absolute;top:2px;bottom:2px;width:2px;background:var(--accent);border-radius:1px}
.hd .dropL::before{left:-5px}.hd .dropR::after{right:-5px}
.hd button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.colreset{background:none;border:0;color:var(--accent);cursor:pointer;font-size:11px;font-family:var(--sans);padding:0}
.hd button:hover{color:var(--txt)}
.hd button.srt{color:var(--accent)}
.hd .r,.row .r{text-align:right}
.row{height:34px;border-bottom:1px solid #131a28;cursor:pointer;font-size:12.5px}
.row:hover{background:var(--panel2)}
.row.on{background:var(--panel);box-shadow:inset 2px 0 0 var(--accent)}
.row .rk{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.row .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cy{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the company is what the person actually built — it reads as content, not metadata */
.row .co{color:var(--txt);font-weight:450}
.row .num{font-variant-numeric:tabular-nums;text-align:right}
.row .nw{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:4px;font-size:9.5px;font-weight:700;font-family:var(--mono)}
.tag.R{background:rgba(63,214,138,.16);color:var(--reported)}
.tag.E{background:rgba(245,176,66,.16);color:var(--estimated)}
.tag.I{background:rgba(255,107,122,.16);color:var(--inferred)}
.od{display:inline-block;width:8px;height:8px;border-radius:2px}
.sbar{height:4px;border-radius:2px;background:var(--accent);min-width:2px}

#right{padding:0}
.dh{padding:16px 17px 13px;border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 3px;font-size:17px;font-weight:650;line-height:1.25}
.dh .meta{color:var(--dim);font-size:12px;line-height:1.6}
.dh .big{margin-top:11px;display:flex;align-items:baseline;gap:9px}
.dh .big b{font-size:27px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.dh .big span{color:var(--mut);font-size:11.5px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi div{background:var(--bg2);padding:11px 12px}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:4px}
.kpi .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;color:var(--mut);font-weight:400}
.ds{padding:14px 17px;border-bottom:1px solid var(--line)}
.ds h5{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.ds p{margin:0;line-height:1.62;color:var(--txt);font-size:12.5px}
.ds ul{margin:0;padding-left:16px;line-height:1.7;color:var(--txt);font-size:12.5px}
.rival{display:flex;flex-wrap:wrap;gap:6px}
.rival span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;color:var(--dim)}
.tl{position:relative;margin:14px 0 4px;height:46px}
.tl .ax{position:absolute;left:0;right:0;top:19px;height:2px;background:var(--line)}
.tl .fill{position:absolute;top:19px;height:2px;background:var(--accent)}
.tl .pt{position:absolute;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);transform:translateX(-50%)}
.tl .lb{position:absolute;font-size:10px;color:var(--mut);white-space:nowrap;transform:translateX(-50%)}
.tl .lb.t{top:0}.tl .lb.b{top:33px}
.pv{width:100%;border-collapse:collapse;font-size:11.5px}
.pv td{padding:5px 0;border-bottom:1px solid #131a28;color:var(--dim);vertical-align:top}
.pv td:first-child{color:var(--mut);width:74px;padding-right:10px}
.empty{padding:44px 24px;text-align:center;color:var(--mut);line-height:1.7;font-size:12.5px}
.empty b{display:block;color:var(--dim);font-size:13.5px;margin-bottom:7px;font-weight:600}
.tip{position:fixed;pointer-events:none;background:#0b1220;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:11.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:99;opacity:0;transition:opacity .1s;max-width:230px}
.tip b{color:var(--txt)}.tip span{color:var(--mut)}
.note{padding:12px 16px;color:var(--mut);font-size:11.5px;line-height:1.6;border-top:1px solid var(--line)}
.note b{color:var(--dim)}
@media(max-width:1180px){#app{grid-template-columns:196px 1fr 310px}.charts{grid-template-columns:1fr}}
@media(max-width:900px){
  body{overflow:auto}
  #app{display:block;height:auto}
  #top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;padding:10px 14px;height:auto}
  .logo{font-size:14px}
  #left,#right{border:0;border-top:1px solid var(--line);overflow:visible;max-height:none}
  #left{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:start}
  .sec{border-bottom:0;border-right:1px solid var(--line)}
  #main{overflow:visible}
  .charts{grid-template-columns:1fr}
  .tbar{position:static;flex-wrap:wrap;gap:8px 14px}
  /* the table is the one thing that must not reflow — let it scroll in its own box */
  .hd{position:static}
}
</style>
<div id="app">
  <header id="top">
    <h1 class="logo"><span class="mk"></span>ValueGrid <small>/ humans</small></h1>
    <div class="hsep"></div>
    <div class="hstat"><b id="hCount">0</b> people</div>
    <div class="hstat"><b id="hStates">0</b> states</div>
    <div class="hstat"><b id="hTotal">$0B</b> combined</div>
    <div class="hstat"><b id="hU45">0</b> under 45</div>
    <div class="hright"><span>United States &middot; the $100M-$5B band &middot; as of <span id="hAsof"></span></span></div>
  </header>

  <aside id="left" class="cell">
    <div class="sec">
      <h4>Search <button class="clr" id="reset">reset all</button></h4>
      <input class="srch" id="q" placeholder="Name, company, city&hellip;" autocomplete="off">
    </div>
    <div class="sec"><h4>Age <button class="clr" id="only45">only under 45</button></h4><div id="fAge"></div></div>
    <div class="sec"><h4>Wealth band</h4><div id="fBand"></div></div>
    <div class="sec"><h4>Region</h4><div id="fRegion"></div></div>
    <div class="sec"><h4>Sector</h4><div id="fSect"></div></div>
    <div class="sec"><h4>Origin</h4><div id="fOrigin"></div></div>
    <div class="sec"><h4>Provenance</h4><div id="fProv"></div></div>
  </aside>

  <main id="main" class="cell">
    <nav class="tabs" id="tabs">
      <button data-p="dist" class="on">Distribution</button>
      <button data-p="age">Age &amp; speed</button>
      <button data-p="time">Over time</button>
      <button data-p="geo">Geography</button>
    </nav>

    <section class="pane on" id="p-dist">
      <div class="charts">
        <figure class="fig wide">
          <h3>Individuals by net worth</h3>
          <p class="sub" id="distSub"></p>
          <div id="cDist" role="img" aria-label="Individuals by net worth band, stacked by sector"></div>
          <div class="slgd" id="lDist"></div>
        </figure>
      </div>
    </section>

    <section class="pane" id="p-age">
      <div class="charts">
        <figure class="fig">
          <h3>How old they are</h3>
          <p class="sub">People per age band. Everything left of the 45 line reached $100M+ in under half a working life.</p>
          <div id="cAge" role="img" aria-label="Distribution of people across age bands"></div>
          <div class="lgd" id="lAge"></div>
        </figure>
        <figure class="fig">
          <h3>Age against fortune</h3>
          <p class="sub">Every person, by age and net worth. The left wall is the interesting edge &mdash; how young a $100M+ fortune gets, and what kind.</p>
          <div id="cScat" role="img" aria-label="Age against net worth, by origin of wealth"></div>
          <div class="lgd" id="lScat"></div>
        </figure>
        <figure class="fig wide">
          <h3>Which routes are fast</h3>
          <p class="sub">Sector, split by the 45 line. A sector that is mostly blue is a fast route to $100M; mostly amber means it takes a career.</p>
          <div id="cSect" role="img" aria-label="People by sector, split under and over 45"></div>
          <div class="lgd" id="lSect"></div>
        </figure>
      </div>
    </section>

    <section class="pane" id="p-time">
      <div class="charts">
        <figure class="fig wide">
          <h3>What kind of wealth each era made</h3>
          <p class="sub" id="timeSub"></p>
          <div class="modes" id="timeModes">
            <button data-m="share" class="on">Share of cohort</button>
            <button data-m="people">People</button>
            <button data-m="worth">$B held today</button>
          </div>
          <div id="cTime" role="img" aria-label="Sector composition of each five-year cohort, by the year each fortune crossed 100 million dollars"></div>
          <div class="slgd" id="lTime"></div>
          <p class="caveat" id="timeCaveat"></p>
        </figure>
        <figure class="fig wide">
          <h3>How long each era took</h3>
          <p class="sub">Median years from starting out to the first $100M, by the era the fortune crossed it. Falling means fortunes are arriving faster.</p>
          <div id="cSpeed" role="img" aria-label="Median years to first 100 million dollars by cohort"></div>
        </figure>
      </div>
    </section>

    <section class="pane" id="p-geo">
      <div class="charts">
        <figure class="fig wide">
          <h3>Where they are</h3>
          <p class="sub">US region, split by the 45 line. Coverage tracks what is publicly documented, and disclosure is uneven by region &mdash; see the note below the table.</p>
          <div id="cRegion" role="img" aria-label="People by region, split under and over 45"></div>
        </figure>
      </div>
    </section>

    <div class="tbar">
      <span class="n"><b id="tCount">0</b> shown</span>
      <span class="n"><b id="tU45">-</b> under 45</span>
      <span class="n">median <b id="tMed">-</b></span>
      <span class="n">median years to fortune <b id="tYrs">-</b></span>
      <span class="n">median age started <b id="tAge">-</b></span>
      <span class="n" style="margin-left:auto"><button class="colreset" id="colReset">reset columns</button></span>
    </div>
    <div id="tableScroll">
      <div class="grid hd" id="hdRow"></div>
      <div id="rows"></div>
    </div>
    <p class="note" id="note"></p>
  </main>

  <aside id="right" class="cell"><div id="dossier"></div></aside>
</div>
<div class="tip" id="tip"></div>

<script>
const DB = {"asof":"2026-08","rows":[{"id":"MATEI_ZAHARIA","n":"Matei Zaharia","age":41,"city":"Berkeley","country":"US","state":"CA","region":"bay","nw":5,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time figure against the $134B Databricks round priced by private investors in Feb 2026","sect":"tech","origin":"self","co":"Databricks","did":"Wrote Apache Spark as a Berkeley PhD student in 2009 as a faster in-memory replacement for Hadoop MapReduce, then in 2013 co-founded Databricks with six other Berkeley AMPLab people to sell a managed Spark service; he is CTO.","started":2013,"startAge":28,"toFirst100":4,"why":"Spark was already the default engine inside enterprises before Databricks existed, because the AMPLab open-sourced it. The company sold the hosted version to buyers who had standardised on it for free, so distribution was won before the first invoice.","comp":["Cloudera","Hortonworks","Snowflake","Amazon EMR"],"obst":"Databricks had to survive the collapse of the Hadoop vendors that were its nearest comparables - Cloudera and Hortonworks merged in 2019 and were taken private in 2021 - while convincing investors that an open-source engine could carry a proprietary business.","turn":"The 2017 pivot from selling Spark clusters to selling the lakehouse - unifying warehouse and data-lake workloads - which put Databricks in Snowflake's market instead of Cloudera's dying one.","band":"b5","ageb":"a4","y100":2017,"u45":true,"years":13,"vel":384.6,"ageAt100":32,"since100":9},{"id":"PALMER_LUCKEY","n":"Palmer Luckey","age":33,"city":"Newport Beach","country":"US","state":"CA","region":"socal","nw":5,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time figure; Anduril marked at the 61B USD valuation set in its May 2026 round","sect":"industry","origin":"self","co":"Anduril Industries","did":"Built the first Oculus Rift VR headset in his parents Long Beach garage at 16, sold Oculus to Facebook for 2 billion dollars in 2014, then founded Anduril in 2017 to sell autonomous towers, drones and the Lattice command software to the Pentagon on a fixed-price product model.","started":2012,"startAge":19,"toFirst100":2,"why":"Defense primes bill cost-plus on decade-long programs, so nobody funded hardware before a contract existed. Anduril built products on venture money first and sold them finished, which let it undercut program-of-record timelines and win border and counter-drone work the primes could not bid fast enough.","comp":["Lockheed Martin","Northrop Grumman","General Atomics","RTX"],"obst":"Fired from Facebook in 2017 after a political donation became public, which he called a firing over politics; Anduril then spent years being told by investors that selling to the Pentagon was uninvestable and by the Pentagon that a startup could not hold a clearance.","turn":"The 2020 US Customs and Border Protection award for autonomous surveillance towers, the first program where Anduril displaced an incumbent prime on delivered hardware rather than a study contract.","band":"b5","ageb":"a2","y100":2014,"u45":true,"years":14,"vel":357.1,"ageAt100":21,"since100":12},{"id":"PAUL_FOSTER","n":"Paul Foster","age":68,"city":"El Paso","country":"US","state":"TX","region":"tx","nw":5,"p":"R","c":0.95,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time list figure","sect":"energy","origin":"self","co":"Western Refining","started":1992,"startAge":34,"toFirst100":8,"did":"An accountant for small Southwest refineries, he and partners bought bankrupt El Paso Refining in 1992, took full control five years later, renamed it Western Refining, listed it in 2006 and sold it to Tesoro in 2017 for 6.4 billion dollars.","why":"No new US refinery had been permitted since 1976, so refining capacity was a closed set. Buying a shuttered plant at scrap value and restarting it created capacity nobody could rebuild, and El Paso sat on the only pipeline route into a landlocked market with no competing supply.","comp":["Tesoro","Valero Energy","Holly Corporation","Frontier Oil"],"obst":"The plant he bought had been idled and stripped in bankruptcy and he had never run one. The 2008 crash landed right after he paid 1.5 billion dollars for Giant Industries, and Western Refining traded under 4 dollars a share while carrying that debt.","turn":"The 2003 purchase of the Bloomfield and Ciniza refineries in New Mexico, which turned a single-plant operator into a regional system with pipeline reach.","band":"b5","ageb":"a7","y100":2000,"u45":false,"years":34,"vel":147.1,"ageAt100":42,"since100":26},{"id":"BERT_BEVERIDGE","n":"Bert Beveridge","age":64,"city":"Austin","country":"US","state":"TX","region":"tx","nw":4.9,"p":"R","c":0.95,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time list figure","sect":"consumer","origin":"self","co":"Titos Handmade Vodka","started":1997,"startAge":35,"toFirst100":14,"did":"Welded a pot still out of turkey-fryer pots in a field east of Austin in 1997, took the first legal distilling permit in Texas, and grew Titos Handmade Vodka past 12 million cases a year while never selling a share of it.","why":"He took no outside capital and never sold, so every dollar of a category carrying 60 percent gross margin stayed with one owner. Corn-based and gluten-free let him win shelf space against imports whose only real advantage was European provenance.","comp":["Absolut","Grey Goose","Smirnoff","Ketel One","Svedka"],"obst":"He funded the first years on about 90,000 dollars drawn across 19 credit cards and slept at the distillery; distributors would not return calls until a medal forced them to, and a 2014 class action attacked the handmade wording on the label.","turn":"Winning double gold at the 2001 San Francisco World Spirits Competition against 71 other vodkas, which turned a local curiosity into a brand distributors would carry.","band":"b5","ageb":"a6","y100":2011,"u45":false,"years":29,"vel":169,"ageAt100":49,"since100":15},{"id":"JOSEPH_GRENDYS","n":"Joseph Grendys","age":64,"city":"Chicago","country":"US","state":"IL","region":"mw","nw":4.8,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires, 21 Aug 2026","m":"Published Forbes real-time list figure","sect":"agri","origin":"self","co":"Koch Foods","did":"Joined Koch Foods in the mid-1980s when it was a one-room deboning shop with 13 employees, took founder Fred Koch's offer of 50 percent equity, then bought him out in 1992 and built it into a roughly 5 billion dollar-a-year chicken processor supplying Walmart and Burger King.","started":1992,"startAge":30,"toFirst100":12,"why":"Chicken margin lives in the spread between feed cost and bird price, so he bought the feed mills, hatcheries and slaughterhouses instead of renting them. Owning every step let him bid private-label contracts below integrators who were paying third parties to process.","comp":["Tyson Foods","Pilgrims Pride","Sanderson Farms","Perdue Farms"],"obst":"A 2017 EEOC settlement over harassment and discrimination at his Mississippi plants cost 3.75 million dollars, and the August 2019 immigration raids on Koch Foods sites in Mississippi detained hundreds of workers and forced him to rebuild a production workforce mid-season.","turn":"The 1992 buyout of Fred Koch, which converted a salaried operator holding a minority stake into the sole owner of cash flows he was already generating.","band":"b5","ageb":"a6","y100":2004,"u45":false,"years":34,"vel":141.2,"ageAt100":42,"since100":22},{"id":"WEILI_DAI","n":"Weili Dai","age":64,"city":"Las Vegas","country":"US","state":"NV","region":"mtn","nw":4.8,"p":"R","c":0.9,"s":"Forbes real-time profile, 21 Aug 2026: $4.8B, rank #886","m":"Published list figure","sect":"tech","origin":"self","co":"Marvell Technology","did":"Co-founded Marvell Technology in a Silicon Valley living room in 1995 with her husband Sehat Sutardja, building the read-channel chips inside hard drives and later Wi-Fi and Ethernet controllers; IPO'd in 2000. Forced out in 2016, she moved to Las Vegas, where Nevada levies no income tax, and backed MeetKai and Silicon Box.","started":1995,"startAge":33,"toFirst100":5,"why":"Marvell sold the one mixed-signal chip every disk-drive maker needed and none wanted to design in-house, then reused that analogue expertise in wireless and networking. As the only woman co-founder of a US chip company she ran sales and operations while the Sutardjas designed, so customer and silicon decisions sat in one household.","comp":["Broadcom","Qualcomm","Texas Instruments","LSI Logic"],"obst":"An internal accounting review of revenue recognition pushed her and her husband out of their own company in 2016; no fraud was ever found. Marvell had earlier lost a 1.17 billion dollar patent verdict to Carnegie Mellon. Her husband died in 2024.","turn":"Winning Seagate's read-channel socket in 1997, which made Marvell the default supplier to the entire disk-drive industry.","band":"b5","ageb":"a6","y100":2000,"u45":false,"years":31,"vel":154.8,"ageAt100":38,"since100":26},{"id":"RYAN_COHEN","n":"Ryan Cohen","age":41,"city":"Bal Harbour","country":"US","state":"FL","region":"se","nw":4.8,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published list figure","sect":"retail","origin":"self","co":"Chewy / GameStop","did":"Co-founded Chewy in 2011 and ran it out of Dania Beach Florida, selling pet food online with 1-day shipping and 24-hour human phone support; grew it to 3.5B in sales and sold it to PetSmart for 3.35B in 2017. Bought a 13 percent GameStop stake in 2020 and became chairman.","started":2011,"startAge":26,"toFirst100":6,"why":"Pet food is heavy, low-margin and bought on a fixed refill cycle, so the winner is whoever owns the repeat order. Chewy spent venture money on overbuilt warehouses and staffed phone lines that Amazon would not fund, buying subscription behaviour in a category Amazon treated as a commodity SKU.","comp":["Amazon","PetSmart","Petco","Wag.com"],"obst":"More than 100 venture firms turned him down on the argument that Amazon would kill any online pet retailer; Chewy was still losing money in 2017 and had to sell rather than IPO, into a leveraged PetSmart buyout whose debt later traded at distressed prices.","turn":"2013, when Chewy overbuilt fulfilment capacity ahead of demand to promise 1-day delivery and revenue went from 26M to more than 200M in two years.","band":"b5","ageb":"a4","y100":2017,"u45":true,"years":15,"vel":320,"ageAt100":32,"since100":9},{"id":"HERBERT_WERTHEIM","n":"Herbert Wertheim","age":87,"city":"Coral Gables","country":"US","region":"se","nw":4.7,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires, 21 August 2026","m":"Published real-time figure","sect":"finance","origin":"self","co":"Brain Power Inc / personal portfolio","did":"An optometrist who founded Brain Power Inc in 1969 to make ultraviolet-blocking tints and dyes for eyeglass lenses, holding more than 100 patents, then compounded the profits into a buy-and-never-sell portfolio; he is the largest individual shareholder of aerospace supplier Heico.","started":1969,"startAge":30,"toFirst100":21,"why":"He read patents and annual reports as a technologist rather than trading on price, and he almost never sold, so five decades of compounding ran without realising capital gains. Taking control-adjacent positions in small industrial firms meant he owned the compounding instead of renting it.","comp":["Essilor","Transitions Optical","Corning","Hoya"],"obst":"He was dyslexic, dropped out of high school and served in the Navy before qualifying as an optometrist; Brain Power then had to defend its lens-chemistry patents against optical manufacturers many times its size.","turn":"Buying a large stake in Heico in 1989 and backing the Mendelson familys takeover of it, a position he has held and compounded for more than thirty years.","state":"FL","band":"b5","ageb":"a7","y100":1990,"u45":false,"years":57,"vel":82.5,"ageAt100":51,"since100":36},{"id":"SANJIT_BISWAS","n":"Sanjit Biswas","age":44,"city":"San Francisco","country":"US","state":"CA","region":"bay","nw":4.6,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time figure; cross-checks against Samsara 8-K of 6 Jan 2026 putting Biswas and Bicket at 34.02% of shares","sect":"tech","origin":"self","co":"Samsara","did":"Co-founded Meraki out of an MIT mesh-networking project in 2006 and sold it to Cisco for $1.2B in 2012, then started Samsara in 2015 selling connected dashcams and sensors to trucking and construction fleets; IPO December 2021.","started":2006,"startAge":24,"toFirst100":6,"why":"Both companies attacked industries where the incumbent hardware was sold once and never updated. Cloud-managed devices turned a one-time box sale into a subscription and let a small company out-iterate Cisco and Qualcomm-era telematics vendors.","obst":"Meraki nearly died when Google, an early backer, launched competing municipal Wi-Fi and the founders had to buy out Google's stake; Samsara then faced a 2018 trade-secrets lawsuit from Cisco alleging the founders reused Meraki work.","comp":["Motive","Geotab","Verizon Connect","Trimble"],"turn":"Cisco's $1.2B purchase of Meraki in November 2012, which gave the pair the capital and the credibility to attack a second, larger hardware market rather than take a corporate job.","band":"b5","ageb":"a4","y100":2012,"u45":true,"years":20,"vel":230,"ageAt100":30,"since100":14},{"id":"DAVID_FILO","n":"David Filo","age":60,"city":"Palo Alto","country":"US","state":"CA","region":"bay","nw":4.6,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time figure","sect":"tech","origin":"self","co":"Yahoo","did":"Built Jerry and Davids Guide to the World Wide Web as a hand-curated link directory on a Stanford workstation in 1994, incorporated it as Yahoo in 1995, and stayed as Chief Yahoo through the 2016 sale of the core business to Verizon for $5B.","started":1994,"startAge":28,"toFirst100":2,"why":"In 1994 search engines returned noise, so a human-edited directory was better than an algorithm. That head start bought the traffic that made Yahoo the default homepage, and the cash from it funded the 2005 Alibaba stake that ended up worth more than Yahoo itself.","comp":["Excite","Lycos","Infoseek","AltaVista"],"obst":"Yahoo lost search to Google after outsourcing it to them in 2000, rejected Microsofts $44.6B bid in 2008 and then watched its own market value fall below the value of its Asian holdings, an activist siege that ended in the company being broken up.","turn":"The $1B investment in Alibaba in 2005, which converted a fading portal into a holding company whose Chinese stake dwarfed the operating business.","band":"b5","ageb":"a6","y100":1996,"u45":false,"years":32,"vel":143.8,"ageAt100":30,"since100":30},{"id":"HELEN_JOHNSON_LEIPOLD","n":"Helen Johnson-Leipold","age":69,"city":"Racine","country":"US","state":"WI","region":"mw","nw":4.6,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires, 21 Aug 2026","m":"Published Forbes real-time list figure","sect":"consumer","origin":"inherited","co":"SC Johnson / Johnson Outdoors","did":"Fifth-generation heir to SC Johnson who ran the private company's worldwide consumer products marketing, then in 1999 took the chairman and CEO seat at Johnson Outdoors, the listed spinoff holding Minn Kota trolling motors, Eureka tents and Scubapro, and still runs it.","started":1985,"startAge":28,"toFirst100":6,"why":"The wealth is a dividend claim on a company that never answered to public markets. SC Johnson stayed family-held straight through the consolidation of household cleaning, so Raid, Glade, Ziploc and Windex kept paying about 100 relatives instead of outside shareholders.","comp":["Procter and Gamble","Reckitt Benckiser","Clorox","Garmin"],"obst":"Johnson Outdoors was losing money when she took it over in 1999 and she had to close and sell brands to stop the bleeding; a long inheritance-tax and trust dispute that set her brother Curt against the family spilled into public court filings and federal charges against him.","turn":"The 1999 decision to run Johnson Outdoors herself rather than stay a marketing executive inside the private parent, which put an operating record under an inherited name.","band":"b5","ageb":"a7","y100":1991,"u45":false,"years":41,"vel":112.2,"ageAt100":34,"since100":35},{"id":"THOMAS_DUFF","n":"Thomas Duff","age":69,"city":"Hattiesburg","country":"US","state":"MS","region":"se","nw":4.5,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published list figure","sect":"industry","origin":"mixed","co":"Duff Capital Investors / Southern Tire Mart","did":"With his brother James bought back their late father's Mississippi tire dealership in 2003 and built Southern Tire Mart into the largest US commercial truck-tire dealer and retreader; folded it and 20-odd other operating businesses into Duff Capital Investors in 2007, now about 6B in revenue.","started":2003,"startAge":46,"toFirst100":6,"why":"Fleet tires are a service contract disguised as a product. Owning retread plants plus 24-hour roadside trucks parked inside truck-stop chains made switching costs enormous for a national carrier, and the listed tire makers did not want the low-margin roadside labour that created the lock-in.","comp":["Goodyear Commercial Tire","Bridgestone Bandag","Michelin TCi Tire Centers","Best-One Tire"],"obst":"Their father sold the family tire business in 1998 and the brothers spent five leveraged years buying it back; they then had to keep funding retread capacity straight through the 2008-09 freight collapse when carrier bankruptcies wiped out receivables.","turn":"The 2003 repurchase of Southern Tire Mart, which gave them a platform to roll up a fragmented commercial tire market state by state.","band":"b5","ageb":"a7","y100":2009,"u45":false,"years":23,"vel":195.7,"ageAt100":52,"since100":17},{"id":"WENDY_ABRAMS","n":"Wendy Abrams","age":61,"city":"Libertyville","country":"US","state":"IL","region":"mw","nw":4.4,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires, 21 Aug 2026","m":"Published Forbes real-time list figure. Start dated to the 2021 recapitalisation that first put a valuation on the family stake, since no transfer date is published; as an heir she crossed 100 million dollars on inheritance rather than climbing to it, so time-to-first-100M is zero.","sect":"health","origin":"inherited","co":"Medline Industries","did":"A shareholder in Medline Industries, the medical-supply maker and distributor her father Jon Mills and uncle Jim Mills founded near Chicago in 1966. The family sold 79 percent to Blackstone, Carlyle and Hellman and Friedman in 2021 above a 30 billion dollar valuation and listed on Nasdaq in December 2025.","started":2021,"startAge":56,"toFirst100":0,"why":"Hospitals buy gloves, gowns and exam-table paper on contract, not on brand. Medline kept manufacturing and distribution inside one private company, so it could underprice Cardinal and Owens and Minor on the same item while funding its own warehouses out of cash flow.","comp":["Cardinal Health","Owens and Minor","Henry Schein","McKesson"],"obst":"The family funded three decades of plant and distribution-centre buildout entirely from retained earnings rather than outside capital, and the 2021 recapitalization required roughly 20 relatives to agree to sell control of a business none of them had ever had to put a price on.","turn":"The June 2021 leveraged buyout, which converted an illiquid family holding into cash plus a retained minority and set the mark the December 2025 Nasdaq listing then repriced.","band":"b5","ageb":"a6","y100":2021,"u45":false,"years":5,"vel":880,"ageAt100":56,"since100":5},{"id":"MICHAEL_JORDAN","n":"Michael Jordan","age":63,"city":"Jupiter","country":"US","region":"se","nw":4.3,"p":"R","c":0.95,"s":"Forbes Real-Time Billionaires, 21 August 2026","m":"Published real-time figure","sect":"media","origin":"self","co":"Jordan Brand (Nike) / Charlotte Hornets / 23XI Racing","did":"Signed a royalty-bearing Nike deal as a 1984 rookie instead of a flat endorsement fee, generating roughly 2.4 billion dollars of pretax income from Jordan Brand; bought control of the Charlotte Hornets in 2010 for 275 million dollars and sold the majority in 2023 at a 3 billion valuation.","started":1984,"startAge":21,"toFirst100":9,"why":"His side took a percentage of shoe revenue rather than a signing cheque, so he owned an annuity on a product line instead of a contract. Nike then built an entire sub-brand around one athlete, which is why the cash flow outlived the playing career by three decades.","comp":["Converse","Adidas","Reebok","Puma"],"obst":"Nike was a distant third in basketball in 1984 and he wanted Adidas, which passed; the NBA banned the original black-and-red shoe and fined the team per game, and his 1993 retirement after his fathers murder threatened the brand at its peak.","turn":"The 1984 Nike contract negotiated by Deloris Jordan and David Falk, with a royalty on every pair sold, which converted fame into equity.","state":"FL","band":"b5","ageb":"a6","y100":1993,"u45":false,"years":42,"vel":102.4,"ageAt100":30,"since100":33},{"id":"MAGGIE_HARDY","n":"Maggie Hardy","age":60,"city":"Belle Vernon","country":"US","state":"PA","region":"ne","nw":4.3,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 August 2026","m":"Published real-time figure","sect":"industry","origin":"mixed","co":"84 Lumber","did":"Took over 84 Lumber from her father Joe Hardy in 1992 at age 26 and rebuilt it around contractor supply rather than consumer walk-in, growing it to 320 stores in 34 states and over 5 billion dollars of revenue; also owns the Nemacolin resort in Farmington, Pennsylvania.","started":1992,"startAge":26,"toFirst100":3,"why":"84 Lumber sells to professional builders on credit and stocks components rather than retail SKUs, so it rides housing starts without competing on price with Home Depot. Staying private meant she could keep opening stores through downturns when public rivals had to protect quarterly margins.","comp":["Home Depot","Lowes","Builders FirstSource","ABC Supply"],"obst":"The 2007-2011 housing collapse cut 84 Lumber revenue by roughly two thirds and forced her to close about 250 of 450 stores; she took no outside capital and rebuilt store count over the following decade.","turn":"The 2009 decision to shut half the store base and refocus entirely on professional builders rather than defend consumer retail square footage.","band":"b5","ageb":"a6","y100":1995,"u45":false,"years":34,"vel":126.5,"ageAt100":29,"since100":31},{"id":"DRAYTON_MCLANE_JR","n":"Drayton McLane Jr.","age":90,"city":"Temple","country":"US","state":"TX","region":"tx","nw":4.3,"p":"R","c":0.95,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time list figure","sect":"logistics","origin":"mixed","co":"McLane Company","started":1965,"startAge":29,"toFirst100":20,"did":"Grew his family grocery distributor in Temple about 30 percent a year for three decades into a national convenience-store supply business, sold McLane Company to Sam Walton in 1991 for 50 million dollars plus 10.4 million Walmart shares, then owned the Houston Astros from 1992 to 2011.","why":"He took the 1991 payment in Walmart stock rather than cash exactly as Walmart began its national build-out, so the sale price compounded with the buyer. The distribution business itself won on route density, serving convenience stores too small for grocery wholesalers to reach profitably.","comp":["Fleming Companies","Super Valu","Core-Mark","Eby-Brown"],"obst":"He inherited a thin-margin regional wholesaler with no capital. The Astros lost money in the Astrodome and he threatened to move the franchise to Virginia in 1995 before Houston voters approved a downtown ballpark.","turn":"Structuring the 1991 Walmart sale largely in stock, which converted a 50 million dollar business into a position that compounded for a decade.","band":"b5","ageb":"a7","y100":1985,"u45":false,"years":61,"vel":70.5,"ageAt100":49,"since100":41},{"id":"PATRIZIO_VINCIARELLI","n":"Patrizio Vinciarelli","age":79,"city":"Boston","country":"US","state":"MA","region":"ne","nw":4.2,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 August 2026","m":"Published real-time figure","sect":"tech","origin":"self","co":"Vicor Corporation","did":"A CERN-trained particle physicist who founded Vicor in Andover, Massachusetts in 1981 to build zero-current-switching DC-DC power converters, and still runs it as chairman and CEO with more than 150 patents; he holds roughly 8.8 million shares, about a fifth of the company.","started":1981,"startAge":34,"toFirst100":13,"why":"Vicor patented the high-frequency switching topologies that let a converter shrink by an order of magnitude, then refused to license them cheaply. When AI racks moved to 48-volt power distribution, the vertical power modules Vicor had spent forty years patenting became the only qualified part.","comp":["Infineon","Monolithic Power Systems","Analog Devices","Delta Electronics"],"obst":"Vicor spent the 2000s in patent litigation against SynQor and others over power-converter claims, and its stock lost more than two thirds of its value in 2022-2023 as datacenter customers delayed the 48-volt transition before AI demand reversed it.","turn":"The 2023-2026 AI datacenter buildout, when hyperscaler rack power moved to the 48-volt architecture Vicor had been selling into a market that did not yet exist.","band":"b5","ageb":"a7","y100":1994,"u45":false,"years":45,"vel":93.3,"ageAt100":47,"since100":32},{"id":"OLIVIER_POMEL","n":"Olivier Pomel","age":49,"city":"New York","country":"US","state":"NY","region":"nyc","nw":4.2,"p":"R","c":0.9,"s":"Forbes profile duate student Daniel Lewin out of consistent-hashing algorithms developed for a Tim Berners-Lee challenge; he has been chief executive since 2013 and runs a company with roughly 18 billion dollars of market value.","started":1998,"startAge":41,"toFirst100":1,"why":"Consistent hashing let Akamai map a request to a nearby server without a central directory, so the network could grow to hundreds of thousands of edge machines inside carrier networks. Once carriers hosted Akamai boxes, a competitor had to rebuild that physical footprint, not just write better software.","comp":["Cloudflare","Amazon CloudFront","Limelight","Fastly","Level 3"],"obst":"Co-founder Danny Lewin was killed aboard American Airlines Flight 11 on 11 September 2001; Akamai stock fell from over 300 dollars to about 56 cents in the dot-com collapse and the company was weeks from running out of cash.","turn":"The 2013 shift under his CEO tenure from selling content delivery bandwidth, a commoditising business, to selling security and edge compute, which now carries most of Akamai's revenue growth.","band":"b3","ageb":"a7","y100":1999,"u45":false,"years":28,"vel":25,"ageAt100":42,"since100":27},{"id":"DANNY_MEYER","n":"Danny Meyer","age":68,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.7,"p":"E","c":0.5,"s":"Forbes, Jul 2025, reported Meyer holds about 3.5M Shake Shack shares; SHAK closed $75.82 on 21 Aug 2026","m":"3.5M shares x $75.82 = $265M, plus Union Square Hospitality Group equity and roughly $400M of disclosed prior SHAK share sales since the 2015 IPO","sect":"consumer","origin":"self","co":"Union Square Hospitality Group and Shake Shack","did":"Opened Union Square Cafe in 1985 at 27, built Gramercy Tavern, Eleven Madison Park and Blue Smoke, then turned a 2001 hot dog cart in Madison Square Park into Shake Shack and took it public in January 2015 at $21 a share.","started":1985,"startAge":27,"toFirst100":20,"why":"Shake Shack began as a fundraiser for the Madison Square Park Conservancy, so it launched with a queue and a civic story instead of an advertising budget. He then ran fine-dining hiring and service standards inside a fast-food cost structure, which let him charge $9 for a burger in a $5 category.","comp":["In-N-Out","Five Guys","Chipotle","Sweetgreen","McDonald s"],"obst":"He abolished tipping across all Union Square Hospitality restaurants in 2015 and had to reverse it in 2020 after staff turnover and guest resistance; covid then closed every restaurant and he laid off about 2,000 staff in March 2020.","turn":"The January 2015 Shake Shack IPO, which doubled on the first day and revalued a hot dog cart as a public company.","band":"b3","ageb":"a7","y100":2005,"u45":false,"years":41,"vel":17.1,"ageAt100":47,"since100":21},{"id":"MICHAEL_KORS","n":"Michael Kors","age":67,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.7,"p":"I","c":0.35,"s":"Forbes profile, last published figure $1.0B as of Mar 2014","m":"Forbes last valued him at $1B in 2014; discounted here for his subsequent disclosed Capri Holdings share sales and the stock decline since 2014","sect":"retail","origin":"self","co":"Michael Kors and Capri Holdings","did":"Launched his womenswear label in 1981 selling to Bergdorf Goodman, went bankrupt in 1993, relaunched with Sportswear Holdings backing, designed Celine for LVMH from 1997, launched the accessible-luxury Michael Michael Kors line in 2004 and listed the company in December 2011.","started":1981,"startAge":22,"toFirst100":30,"why":"The diffusion line hit an empty price point: a $300 handbag sat between $80 Coach and $1,500 European luxury exactly as American outlet-mall traffic peaked. Judging Project Runway from 2004 then supplied national brand awareness that no fashion house could have bought at that stage.","comp":["Coach","Kate Spade","Tory Burch","Ralph Lauren","Marc Jacobs"],"obst":"His company filed for bankruptcy in 1993 and the label went dark for two years; a decade after the IP d recycle private buildings into public REIT currency.","band":"b3","ageb":"a7","y100":1990,"u45":false,"years":55,"vel":12.7,"ageAt100":44,"since100":36},{"id":"KEVIN_REILLY_JR","n":"Kevin P. Reilly Jr.","age":71,"city":"Baton Rouge","country":"US","state":"LA","region":"se","nw":0.7,"p":"E","c":0.6,"s":"Lamar Advertising 2026 DEF 14A: 500,183 Class A and 11,362,250 Class B beneficially owned, of which 9,000,000 are held by Reilly Family LLC; LAMR closed 150.77 on 21 Aug 2026","m":"2,862,433 shares held outside the family LLC plus a one-fifth interest in the LLC's 9,000,000 shares, x 150.77 = 703M","sect":"media","origin":"mixed","co":"Lamar Advertising","did":"Took over his father's Baton Rouge billboard company in 1989, took Lamar public in 1996 and rolled up hundreds of small local outdoor operators into the largest US billboard owner; converted Lamar into a REIT in 2014 and chairs it today.","started":1989,"startAge":34,"toFirst100":9,"why":"Billboards are permitted structures on land nobody can add to, because the 1965 Highway Beautification Act froze new roadside signs. Buying an existing operator buys irreplaceable permits, so a rollup in a supply-capped asset compounds pricing power every year without building anything.","comp":["Outfront Media","Clear Channel Outdoor","JCDecaux","Adams Outdoor Advertising"],"obst":"The rollup was debt-financed and Lamar entered the 2001 and 2008 advertising recessions heavily levered, with local ad spend falling faster than the national market; the family had to keep the Class B structure to stop a hostile buyer taking the permit base.","turn":"1996, when the IPO gave him public paper to buy dozens of family billboard companies that would not sell for cash.","band":"b3","ageb":"a7","y100":1998,"u45":false,"years":37,"vel":18.9,"ageAt100":43,"since100":28},{"id":"SELENA_GOMEZ","n":"Selena Gomez","age":34,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.7,"p":"R","c":0.85,"s":"Forbes profile figure of  later ran the company as chairman and CEO, and still holds about 3 million shares of a mill group that ships over 13 million tons a year.","started":1993,"startAge":34,"toFirst100":10,"why":"Electric arc minimills melt scrap instead of ore, so capital cost per ton is a fraction of an integrated mill and a line can be idled without wrecking a blast furnace. Buying scrap processor OmniSource then turned the most volatile input into an owned margin rather than a purchased cost.","comp":["Nucor","Cleveland-Cliffs","United States Steel","Commercial Metals"],"obst":"The three founders financed the first mill in 1993 with no company, no customers and a thin-slab casting technology that nearly failed in start-up; the 2015 and 2016 import surge then pushed US hot-rolled prices below cash cost across the industry.","turn":"The 2007 purchase of scrap processor OmniSource for about 1.1 billion dollars, which put the raw material inside the company and removed its biggest earnings swing.","band":"b3","ageb":"a7","y100":2003,"u45":false,"years":33,"vel":20.9,"ageAt100":44,"since100":23},{"id":"WES_CUMMINS","n":"Wes Cummins","age":46,"city":"Dallas","country":"US","state":"TX","region":"tx","nw":0.68,"p":"E","c":0.5,"s":"SEC Form 4 holdings for Applied Digital (APLD) compiled Aug 2026: 24,083,519 shares, 8.26 percent","m":"Disclosed insider share count times the 28.22 dollar implied share price = 680 million dollars A second independent pass priced this at $0.6B from the same filing (Applied Digital DEF 14A filed 22 Sep 2025: 21,876,070 shares beneficially owned, 7.5 percent, mostly via Cummins Family Ltd; APLD closed 27.21 on 21 Aug 2026); the two disagree by 12% and the higher-confidence read is shown.","sect":"tech","origin":"self","co":"Applied Digital","started":2021,"startAge":41,"toFirst100":3,"did":"A former sell-side semiconductor analyst running the Dallas fund 271 Capital, he took control of a shell called Applied Blockchain in 2021, converted its bitcoin mining sites obst":"Early MongoDB defaulted to fire-and-forget writes and the company spent years answering public accusations of silent data loss, which forced the WiredTiger acquisition in 2014 and a full storage-engine replacement before enterprises would sign.","turn":"The 2009 open-source release, which turned the database into a default choice for a generation of web startups.","band":"b3","ageb":"a5","y100":2017,"u45":false,"years":19,"vel":35.8,"ageAt100":37,"since100":9},{"id":"ANDY_JASSY","n":"Andy Jassy","age":58,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.68,"p":"E","c":0.7,"s":"Amazon DEF 14A of 24 Feb 2026: 2,313,536 shares; AMZN closed 258.63 dollars on 21 August 2026","m":"Disclosed beneficial holding times market price equals 598M, plus disclosed Form 4 sales during two decades as an officer","sect":"tech","origin":"self","co":"Amazon Web Services / Amazon","did":"Joined Amazon in 1997 out of Harvard Business School, became Jeff Bezos's technical assistant, and in 2003 wrote the plan for what became Amazon Web Services; ran AWS from launch in 2006 to more than 100 billion dollars of annual revenue and succeeded Bezos as Amazon chief executive in July 2021.","started":1997,"startAge":29,"toFirst100":18,"why":"Amazon had already paid for the hardest part, running elastic infrastructure for its own retail peaks, so selling the spare capacity carried almost no incremental cost. Launching S3 and EC2 in 2006 gave AWS a seven-year head start during which every startup built on it and enterprises had nowhere else to migrate.","comp":["Microsoft Azure","Google Cloud","IBM","Oracle","Rackspace"],"obst":"Wall Street pressed Amazon for years to stop funding a business it refused to break out; as chief executive he inherited a pandemic-era overbuild and cut more than 27,000 jobs across 2022 and 2023 while AWS growth decelerated and Azure closed the gap.","turn":"The 2015 decision to disclose AWS financials separately, which revealed a high-margin busin ee Trinity University students running a web hosting side business, he became Rackspaces chairman and chief executive, listed it in 2008, and cashed out roughly 19 million shares when Apollo took it private at 32 dollars in 2016.","why":"Hosting was a commodity priced per server, so Rackspace competed on a support guarantee it called Fanatical Support, which let it charge a premium and cut churn. Support labour scales sublinearly with servers, so that premium widened gross margin instead of being competed away.","comp":["Amazon Web Services","GoDaddy","Savvis","Terremark"],"obst":"The company nearly ran out of cash in 2001 when the dot-com bust took its customers and he had to personally guarantee payroll; after the 2008 IPO priced at 12.50 dollars the stock halved within months, and AWS price cuts eventually forced the sale to Apollo.","turn":"The 2001 decision, taken during the cash crisis, to make support the product rather than a cost line.","band":"b3","ageb":"a6","y100":2007,"u45":false,"years":28,"vel":21.4,"ageAt100":43,"since100":19},{"id":"SAM_HAZEN","n":"Sam Hazen","age":65,"city":"Nashville","country":"US","state":"TN","region":"se","nw":0.59,"p":"E","c":0.7,"s":"HCA Healthcare Form 4 filed 12 Feb 2026: 64,842 direct plus 1,317,452 shares held via trusts, GRATs and a limited partnership; HCA closed 429.19 on 21 Aug 2026","m":"1,382,294 beneficially owned shares x 429.19 = 593M; excludes unvested performance awards","sect":"health","origin":"self","co":"HCA Healthcare","did":"Joined HCA in 1983 as a financial analyst in Nashville, ran its Western Group and became chief operating officer, then chief executive in 2019; runs about 190 hospitals and has taken HCA's market value past 90B while buying back roughly a third of the shares.","started":1983,"startAge":22,"toFirst100":32,"why":"HCA's advantage is scale inside chosen metros rather than national coverage. Owning most of the beds in Nashville, Houston or Miami sets the price with commercial insurers, an lvo Construction Equipment","Hitachi Construction Machinery"],"obst":"He took over in 2017 in the middle of a multi-year mining downturn that had already cost Caterpillar tens of thousands of jobs, and inherited a federal tax investigation into the company's Swiss parts subsidiary that had produced a 2017 raid on its Peoria offices.","turn":"The 2017 adoption of a hard services-revenue target, which changed capital allocation and pay in every division and carried margins through the next cycle.","band":"b2","ageb":"a7","y100":2015,"u45":false,"years":46,"vel":10,"ageAt100":57,"since100":11},{"id":"JOHN_M_PIGOTT","n":"John M. Pigott","age":62,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.46,"p":"E","c":0.75,"s":"PACCAR DEF 14A filed 2026-03-18, ownership table as of 2026-03-03; PCAR close 131.03 on 2026-08-21 (stockanalysis.com)","m":"3,490,462 PACCAR shares beneficially owned x $131.03 = $457M. Includes 75,567 deferred stock units in the director plan and shares held by spouse/children he disclaims.","sect":"industry","origin":"inherited","co":"PACCAR Inc / Beta Business Ventures","did":"Fourth-generation holder of the Pigott family block in PACCAR, the Bellevue maker of Kenworth, Peterbilt and DAF trucks. Spent 12 years inside the company, five running truck operations in the UK and US, then became a partner in Beta Capital Group in 2003 and now Beta Business Ventures in Seattle.","started":2003,"startAge":39,"toFirst100":1,"why":"PACCAR sells premium trucks at premium prices and books the credit spread through PACCAR Financial, so it earns twice on the same unit. The family has never diluted, so a sub-2 percent block compounds against a $69B market cap. PACCAR was profitable every year from 1939 except 2009.","comp":["Daimler Truck (Freightliner)","Volvo Group (Mack)","Traton/Navistar"],"obst":"Class 8 trucking is violently cyclical. North American orders fell about 45 percent in 2009 and PACCAR posted its first annual loss in seven decades; the family held the block rather than sell into the trough, and the shares have since risen roughly tenfold.","turn":"2003, when he left operating roles at PACCAR and formed Beta Capital Group, turning an inherited single-stock position into a managed family capital base.","band":"b2","ageb":"a6","y100":2004,"u45":false,"years":23,"vel":20,"ageAt100":40,"since100":22},{"id":"JANICE_BRYANT_HOWROYD","n":"Janice Bryant Howroyd","age":73,"city":"Las Vegas","country":"US","region":"mtn","nw":0.45,"p":"R","c":0.85,"s":"Forbes America's Richest Self-Made Women, June 2025","m":"Published list figure","sect":"other","origin":"self","co":"ActOne Group","did":"Founded ActOne Group in 1978 in a small Beverly Hills office with 900 dollars borrowed from her mother and a rented fax machine, building it into a staffing, screening and workforce-technology firm with about 890 million dollars of revenue across 33 countries.","started":1978,"startAge":25,"toFirst100":22,"why":"Contract labour is bought by corporate procurement departments carrying supplier-diversity targets they cannot fill at scale. Being a certified minority and woman-owned vendor large enough to staff nationally won master service agreements that mid-size rivals could not even bid on.","comp":["ManpowerGroup","Adecco","Randstad","Kelly Services"],"obst":"She grew up one of eleven children in segregated Tarboro, North Carolina, and was among the first Black students to integrate her high school; banks would not lend to a young Black woman in 1978, so ActOne grew for years purely on retained earnings.","turn":"Landing national corporate accounts in the 1980s that demanded coverage in multiple states, which forced her to build a branch network instead of remaining a single Los Angeles agency.","state":"NV","band":"b2","ageb":"a7","y100":2000,"u45":false,"years":48,"vel":9.4,"ageAt100":47,"since100":26},{"id":"RON_OFFUTT","n":"Ron Offutt","age":84,"city":"Fargo","country":"US","state":"ND","region":"mtn","nw":0.45,"p":"I toFirst100":10,"why":"Restaurants lose money the moment a terminal stops working, so Toast built the whole system to run locally and reconcile later. That reliability engineering, not the software features, is why kitchens replaced Micros terminals that had been installed for a decade.","comp":["Oracle Micros","NCR Aloha","Square","Lightspeed","Clover"],"obst":"Toast spent its first years selling to independent restaurants with almost no IT budget, and Grimm had to support thousands of one-off hardware configurations in kitchens; the 2020 pandemic shutdown cut the customer base's volume to near zero overnight.","turn":"The decision to build Toast on commodity Android tablets with a local database rather than on cloud-only web software, which made the system usable in a kitchen with unreliable wifi.","band":"b2","ageb":"a4","y100":2021,"u45":true,"years":15,"vel":30,"ageAt100":36,"since100":5},{"id":"DUKE_AUSTIN","n":"Duke Austin","age":56,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.45,"p":"E","c":0.6,"s":"Quanta Services DEF 14A filed 10 Apr 2026 (ownership as of 26 Mar 2026); NYSE close 21 Aug 2026","m":"707,757 shares beneficially owned x $639.34 close = $452M; holdings basis, excludes proceeds of prior sales","sect":"industry","origin":"self","co":"Quanta Services","did":"Began as a lineman, ran Quanta subsidiary North Houston Pole Line from 2001, became Quanta COO in 2013 and CEO in 2016; grew revenue from $7.6B to over $27B by 2025 by owning the craft labour utilities need for grid, renewables and data-centre work.","started":2001,"startAge":31,"toFirst100":22,"why":"The scarce input in electrification is not equipment but trained linemen. Austin kept and trained crews through downturns and signed multi-year master service agreements, so when utility capex and data-centre load jumped after 2021 Quanta priced on availability rather than on low bid.","comp":["MYR Group","MasTec","Primoris Services"],"obst":"The oil and gas pipeline division ions dragged reported revenue and VERX fell from 26.54 to about 13, halving the family stake.","turn":"The June 2018 South Dakota v. Wayfair decision, which turned tax calculation from an option into a legal requirement for every online seller.","band":"b2","ageb":"a6","y100":2015,"u45":false,"years":33,"vel":13.6,"ageAt100":47,"since100":11},{"id":"JACOB_DEWITTE","n":"Jacob DeWitte","age":40,"city":"Santa Clara","country":"US","state":"CA","region":"bay","nw":0.45,"p":"E","c":0.85,"s":"Oklo Inc. DEF 14A filed 21 Apr 2026, beneficial ownership as of 6 Apr 2026; OKLO close $42.09, 21 Aug 2026","m":"Sum of his own holdings in proxy footnote 3 - 691,533 direct, 656,483 GRAT, 1,000,000 GRAT No.2, 7,851,901 Family Trust, 506,807 GRAT No.3, 28,090 RSUs = 10,734,814 shares x $42.09","sect":"energy","origin":"self","co":"Oklo","did":"Co-founded Oklo in July 2013 out of MIT nuclear engineering to build the Aurora, a 15-75 MWe sodium-cooled fast microreactor that runs on recycled used fuel, and to sell electricity by contract rather than sell reactors; listed via Sam Altman's AltC SPAC in May 2024.","started":2013,"startAge":27,"toFirst100":11,"why":"Oklo skipped the utility sales model that killed every other small-reactor startup. By owning and operating the plants and signing power purchase agreements with data centres, it captured the AI electricity shortage as revenue instead of waiting for a utility customer that never orders.","comp":["NuScale Power","X-energy","TerraPower","Kairos Power"],"obst":"The NRC denied Oklo's Aurora combined licence application in January 2022 for insufficient safety information, the first-ever custom-reactor application rejection, forcing a three-year rebuild of the licensing case before the company had any revenue at all.","turn":"The January 2022 NRC denial: instead of quitting, Oklo re-entered through the DOE fuel-fabrication and Idaho National Laboratory siting route, which by 2024 gave it a site, fuel and a listed currency ahead of ever h Paul Prager in 2021 as chief technology officer, having spent the prior decade building and financing power assets at Beowulf Energy, and designed the Lake Mariner and Nautilus sites that mine bitcoin on zero-carbon nuclear and hydro power.","started":2021,"startAge":45,"toFirst100":1,"why":"The scarce skill was energy project finance, not mining: securing interconnection agreements, negotiating behind-the-meter power purchase deals with a nuclear operator, and permitting substations. Those take years and relationships, which is why better-funded miners could not replicate the sites.","comp":["Riot Platforms","Cipher Mining","Iris Energy","Core Scientific"],"obst":"The Nautilus joint venture with Talen Energy went into difficulty when Talen itself filed for bankruptcy in 2022, freezing TeraWulfs share of the only operating nuclear-powered mining site in America while the company was carrying construction debt through the crash.","turn":"The 2024 Core42 hosting agreement, which validated the sites for AI workloads and repriced the whole asset base.","band":"b2","ageb":"a5","y100":2022,"u45":false,"years":5,"vel":88,"ageAt100":46,"since100":4},{"id":"STEVEN_MADDEN","n":"Steven Madden","age":68,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.44,"p":"E","c":0.8,"s":"WallStreetZen insider ownership table for SHOO: 9,253,888 shares, 12.65% of the company, valued $438.08M","m":"9,253,888 shares x market price on 21 Aug 2026 = $438M; he is the largest individual holder","sect":"retail","origin":"self","co":"Steven Madden Ltd","did":"Started Steve Madden Ltd in Long Island City in 1990 with $1,100, selling chunky platform shoes out of the boot of his car to Manhattan boutiques; took it public in 1993, served 31 months in federal prison from 2005 for securities fraud tied to Stratton Oakmont, and returned as creative chief.","started":1990,"startAge":32,"toFirst100":9,"why":"He compressed design-to-shelf to about six weeks by keeping sample-making in house and using near-shore production, so the company chased a trend that was already happening while Nine West and Nike were committed to forecasts made a year earlier. In fashion footwear, speed is the entire margin.","comp":["Nine West","Skechers","Aldo","Nike","Jessica Simpson footwear"],"obst":"He was convicted in 2001 of securities fraud and money laundering for his role in Stratton Oakmont's IPO manipulation, had to resign as chief executive, and ran the brand's design from a federal prison camp between 2005 and 2007.","turn":"The 1993 IPO underwritten by Stratton Oakmont, which funded the first retail stores and a decade later nearly destroyed him.","band":"b2","ageb":"a7","y100":1999,"u45":false,"years":36,"vel":12.2,"ageAt100":41,"since100":27},{"id":"MATT_EHRLICHMAN","n":"Matt Ehrlichman","age":46,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.44,"p":"E","c":0.75,"s":"Porch Group DEF 14A of 17 Apr 2026: 25,519,591 shares, 24.11 percent; PRCH closed 17.09 dollars on 21 August 2026","m":"Disclosed beneficial share count times market price","sect":"tech","origin":"self","co":"Porch Group","did":"Sold his first company Thriva to Active Network at 24 and became its chief strategy officer through a 2011 IPO, then founded Porch in Seattle that year as a home-services marketplace; took it public by SPAC in 2020 and rebuilt it around homeowners insurance and software sold to inspectors and movers.","started":2011,"startAge":31,"toFirst100":10,"why":"Porch stopped competing for home-improvement leads and instead sold software to the companies that learn a house is changing hands first, inspectors and movers, then used that data to underwrite homeowners insurance. Owning the moment before the sale converts a lead-gen business into a premium stream.","comp":["Angi","Thumbtack","HomeAdvisor","Lemonade","Hippo"],"obst":"The insurance business was hit by Texas and Gulf storm losses that pushed Porch to heavy losses in 2022 and 2023, the shares fell more g to add and upgrades shipped to everyone at once - the economics that made the subscription price possible.","comp":["Siebel Systems","Oracle","SAP","Microsoft Dynamics"],"obst":"The founders were told repeatedly that enterprises would never put customer data on someone elses servers; a multi-day outage in December 2005 and a phishing breach in 2007 each revived that objection at the moment Salesforce was selling to large accounts.","turn":"The 2007 launch of Force.com and the AppExchange, which turned a single application into a platform other vendors built on and made the customer base far harder to dislodge.","band":"b2","ageb":"a6","y100":2004,"u45":false,"years":27,"vel":15.2,"ageAt100":37,"since100":22},{"id":"PHEBE_NOVAKOVIC","n":"Phebe Novakovic","age":69,"city":"Reston","country":"US","state":"VA","region":"dc","nw":0.41,"p":"E","c":0.6,"s":"General Dynamics DEF 14A filed 27 Mar 2026: 802,357 shares owned plus 573,565 options exercisable within 60 days as of 11 Mar 2026; GD closed 384.29 on 21 Aug 2026","m":"Held shares at market plus intrinsic value of options at an estimated 210 dollar average strike, plus 4.4 million dollar deferred-compensation balance","sect":"industry","origin":"self","co":"General Dynamics","did":"A former CIA officer who joined General Dynamics in 2001, became chief executive in 2013 with the company in its worst state in decades, and rebuilt it around Gulfstream business jets, Virginia and Columbia class submarines and the Abrams line, roughly tripling the share price over her tenure.","started":2001,"startAge":44,"toFirst100":18,"why":"She fixed the company by refusing revenue: cutting the IT segment that had bloated through acquisitions, walking away from low-margin bids, and concentrating capital in submarines and Gulfstream, two franchises with multi-decade order books and no new entrants. Margin, not growth, made the equity.","comp":["Lockheed Martin","Raytheon","Northrop Grumman","Huntington Ingalls"],"obst":"She took over i
