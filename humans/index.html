<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The American $100M-$5B census - ValueGrid</title>
<style>
:root{
  --bg:#0a0e16; --bg2:#0d121d; --panel:#101725; --panel2:#0c121e; --line:#1c2536;
  --txt:#e8eef7; --dim:#8a98ad; --mut:#828fa6;
  --accent:#5b8cff; --glow:#6ea8ff; --accent-fill:#3056c4;
  --reported:#3fd68a; --estimated:#f5b042; --inferred:#ff6b7a;
  /* Categorical slots for origin. Validated all-pairs on --bg2 in dark mode:
     lightness band PASS, chroma PASS, CVD worst dE 8.4, normal-vision worst
     dE 19.8, contrast PASS. Every use also carries a text label, so identity
     is never colour-alone. */
  --self:#5b8cff; --inherited:#c98500; --mixed:#199e70;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:236px 1fr 372px;grid-template-rows:58px 1fr;height:100vh}
.cell{position:relative;overflow:hidden;min-width:0;min-height:0}

#top{grid-column:1/4;display:flex;align-items:center;gap:20px;padding:0 22px;background:linear-gradient(180deg,#0e1422,#0a0e16);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;margin:0}
.logo .mk{width:22px;height:22px;border-radius:6px;background:radial-gradient(circle at 30% 30%,var(--glow),#2a5bd0);box-shadow:0 0 14px rgba(91,140,255,.5)}
.logo small{color:var(--mut);font-weight:400;font-size:12px}
.hstat{color:var(--dim);font-size:12px}.hstat b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.hsep{width:1px;height:24px;background:var(--line)}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--mut);font-size:12px}

#left,#right{background:var(--bg2);overflow-y:auto}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
.sec{padding:15px 15px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.srch{width:100%;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-family:var(--sans);font-size:13px;outline:none}
.srch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.12)}
.chip{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 9px;margin:2px 0;background:none;border:0;border-left:2px solid transparent;cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--dim);text-align:left;transition:.12s}
.chip:hover{color:var(--txt)}
.chip.on{color:var(--txt);border-left-color:var(--accent);font-weight:600}
.chip .ct{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.clr{background:none;border:0;color:var(--accent);cursor:pointer;font-size:11px;font-family:var(--sans);padding:0}

#main{overflow-y:auto;padding:0}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.fig{background:var(--bg);padding:14px 16px 12px;min-width:0}
.fig h3{margin:0 0 2px;font-size:12.5px;font-weight:600;color:var(--txt)}
.fig p.sub{margin:0 0 10px;font-size:11.5px;color:var(--mut);line-height:1.45}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dim)}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tbar .n{font-size:12px;color:var(--dim)}.tbar .n b{color:var(--txt);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:22px minmax(140px,1.5fr) 38px minmax(90px,1fr) 68px minmax(78px,.9fr) 52px 44px 46px 52px 60px 30px;gap:10px;align-items:center;padding:0 16px}
.hd{position:sticky;top:44px;background:var(--bg);border-bottom:1px solid var(--line);z-index:4;height:32px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.hd button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.hd button:hover{color:var(--txt)}
.hd button.srt{color:var(--accent)}
.hd .r,.row .r{text-align:right}
.row{height:34px;border-bottom:1px solid #131a28;cursor:pointer;font-size:12.5px}
.row:hover{background:var(--panel2)}
.row.on{background:var(--panel);box-shadow:inset 2px 0 0 var(--accent)}
.row .rk{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.row .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cy{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font-variant-numeric:tabular-nums;text-align:right}
.row .nw{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:4px;font-size:9.5px;font-weight:700;font-family:var(--mono)}
.tag.R{background:rgba(63,214,138,.16);color:var(--reported)}
.tag.E{background:rgba(245,176,66,.16);color:var(--estimated)}
.tag.I{background:rgba(255,107,122,.16);color:var(--inferred)}
.od{display:inline-block;width:8px;height:8px;border-radius:2px}
.sbar{height:4px;border-radius:2px;background:var(--accent);min-width:2px}

#right{padding:0}
.dh{padding:16px 17px 13px;border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 3px;font-size:17px;font-weight:650;line-height:1.25}
.dh .meta{color:var(--dim);font-size:12px;line-height:1.6}
.dh .big{margin-top:11px;display:flex;align-items:baseline;gap:9px}
.dh .big b{font-size:27px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.dh .big span{color:var(--mut);font-size:11.5px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi div{background:var(--bg2);padding:11px 12px}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:4px}
.kpi .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;color:var(--mut);font-weight:400}
.ds{padding:14px 17px;border-bottom:1px solid var(--line)}
.ds h5{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.ds p{margin:0;line-height:1.62;color:var(--txt);font-size:12.5px}
.ds ul{margin:0;padding-left:16px;line-height:1.7;color:var(--txt);font-size:12.5px}
.rival{display:flex;flex-wrap:wrap;gap:6px}
.rival span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11.5px;color:var(--dim)}
.tl{position:relative;margin:14px 0 4px;height:46px}
.tl .ax{position:absolute;left:0;right:0;top:19px;height:2px;background:var(--line)}
.tl .fill{position:absolute;top:19px;height:2px;background:var(--accent)}
.tl .pt{position:absolute;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);transform:translateX(-50%)}
.tl .lb{position:absolute;font-size:10px;color:var(--mut);white-space:nowrap;transform:translateX(-50%)}
.tl .lb.t{top:0}.tl .lb.b{top:33px}
.pv{width:100%;border-collapse:collapse;font-size:11.5px}
.pv td{padding:5px 0;border-bottom:1px solid #131a28;color:var(--dim);vertical-align:top}
.pv td:first-child{color:var(--mut);width:74px;padding-right:10px}
.empty{padding:44px 24px;text-align:center;color:var(--mut);line-height:1.7;font-size:12.5px}
.empty b{display:block;color:var(--dim);font-size:13.5px;margin-bottom:7px;font-weight:600}
.tip{position:fixed;pointer-events:none;background:#0b1220;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:11.5px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:99;opacity:0;transition:opacity .1s;max-width:230px}
.tip b{color:var(--txt)}.tip span{color:var(--mut)}
.note{padding:12px 16px;color:var(--mut);font-size:11.5px;line-height:1.6;border-top:1px solid var(--line)}
.note b{color:var(--dim)}
@media(max-width:1180px){#app{grid-template-columns:200px 1fr 320px}.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1 class="logo"><span class="mk"></span>ValueGrid <small>/ humans</small></h1>
    <div class="hsep"></div>
    <div class="hstat"><b id="hCount">0</b> people</div>
    <div class="hstat"><b id="hStates">0</b> states</div>
    <div class="hstat"><b id="hTotal">$0B</b> combined</div>
    <div class="hstat"><b id="hU45">0</b> under 45</div>
    <div class="hright"><span>United States &middot; the $100M-$5B band &middot; as of <span id="hAsof"></span></span></div>
  </header>

  <aside id="left" class="cell">
    <div class="sec">
      <h4>Search <button class="clr" id="reset">reset all</button></h4>
      <input class="srch" id="q" placeholder="Name, company, city&hellip;" autocomplete="off">
    </div>
    <div class="sec"><h4>Age <button class="clr" id="only45">only under 45</button></h4><div id="fAge"></div></div>
    <div class="sec"><h4>Wealth band</h4><div id="fBand"></div></div>
    <div class="sec"><h4>Region</h4><div id="fRegion"></div></div>
    <div class="sec"><h4>Sector</h4><div id="fSect"></div></div>
    <div class="sec"><h4>Origin</h4><div id="fOrigin"></div></div>
    <div class="sec"><h4>Provenance</h4><div id="fProv"></div></div>
  </aside>

  <main id="main" class="cell">
    <div class="charts">
      <figure class="fig">
        <h3>How old they are</h3>
        <p class="sub">People per age band. Everything left of the 45 line reached $100M+ in under half a working life.</p>
        <svg id="cAge" role="img" aria-label="Distribution of people across age bands"></svg>
        <div class="lgd" id="lAge"></div>
      </figure>
      <figure class="fig">
        <h3>Age against fortune</h3>
        <p class="sub">Every person, by age and net worth. The left wall is the interesting edge &mdash; how young a $100M+ fortune gets, and what kind.</p>
        <svg id="cScat" role="img" aria-label="Age against net worth, by origin of wealth"></svg>
        <div class="lgd" id="lScat"></div>
      </figure>
      <figure class="fig">
        <h3>Which routes are fast</h3>
        <p class="sub">Sector, split by the 45 line. A sector that is mostly blue is a fast route to $100M; mostly amber means it takes a career.</p>
        <svg id="cSect" role="img" aria-label="People by sector, split under and over 45"></svg>
        <div class="lgd" id="lSect"></div>
      </figure>
      <figure class="fig">
        <h3>Where they are</h3>
        <p class="sub">US region, on the same split. Coverage tracks what is publicly documented, and disclosure is uneven by region &mdash; see the note below the table.</p>
        <svg id="cRegion" role="img" aria-label="People by region, split under and over 45"></svg>
      </figure>
    </div>

    <div class="tbar">
      <span class="n"><b id="tCount">0</b> shown</span>
      <span class="n"><b id="tU45">-</b> under 45</span>
      <span class="n">median <b id="tMed">-</b></span>
      <span class="n">median years to fortune <b id="tYrs">-</b></span>
      <span class="n">median age started <b id="tAge">-</b></span>
    </div>
    <div class="grid hd" id="hdRow"></div>
    <div id="rows"></div>
    <p class="note" id="note"></p>
  </main>

  <aside id="right" class="cell"><div id="dossier"></div></aside>
</div>
<div class="tip" id="tip"></div>

<script>
const DB = {"asof":"2026-08","rows":[{"id":"PALMER_LUCKEY","n":"Palmer Luckey","age":33,"city":"Newport Beach","country":"US","state":"CA","region":"socal","nw":5,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time figure; Anduril marked at the 61B USD valuation set in its May 2026 round","sect":"industry","origin":"self","co":"Anduril Industries","did":"Built the first Oculus Rift VR headset in his parents Long Beach garage at 16, sold Oculus to Facebook for 2 billion dollars in 2014, then founded Anduril in 2017 to sell autonomous towers, drones and the Lattice command software to the Pentagon on a fixed-price product model.","started":2012,"startAge":19,"toFirst100":2,"why":"Defense primes bill cost-plus on decade-long programs, so nobody funded hardware before a contract existed. Anduril built products on venture money first and sold them finished, which let it undercut program-of-record timelines and win border and counter-drone work the primes could not bid fast enough.","comp":["Lockheed Martin","Northrop Grumman","General Atomics","RTX"],"obst":"Fired from Facebook in 2017 after a political donation became public, which he called a firing over politics; Anduril then spent years being told by investors that selling to the Pentagon was uninvestable and by the Pentagon that a startup could not hold a clearance.","turn":"The 2020 US Customs and Border Protection award for autonomous surveillance towers, the first program where Anduril displaced an incumbent prime on delivered hardware rather than a study contract.","band":"b5","ageb":"a2","u45":true,"years":14,"vel":357.1,"ageAt100":21,"since100":12},{"id":"PAUL_FOSTER","n":"Paul Foster","age":68,"city":"El Paso","country":"US","state":"TX","region":"tx","nw":5,"p":"R","c":0.95,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time list figure","sect":"energy","origin":"self","co":"Western Refining","started":1992,"startAge":34,"toFirst100":8,"did":"An accountant for small Southwest refineries, he and partners bought bankrupt El Paso Refining in 1992, took full control five years later, renamed it Western Refining, listed it in 2006 and sold it to Tesoro in 2017 for 6.4 billion dollars.","why":"No new US refinery had been permitted since 1976, so refining capacity was a closed set. Buying a shuttered plant at scrap value and restarting it created capacity nobody could rebuild, and El Paso sat on the only pipeline route into a landlocked market with no competing supply.","comp":["Tesoro","Valero Energy","Holly Corporation","Frontier Oil"],"obst":"The plant he bought had been idled and stripped in bankruptcy and he had never run one. The 2008 crash landed right after he paid 1.5 billion dollars for Giant Industries, and Western Refining traded under 4 dollars a share while carrying that debt.","turn":"The 2003 purchase of the Bloomfield and Ciniza refineries in New Mexico, which turned a single-plant operator into a regional system with pipeline reach.","band":"b5","ageb":"a7","u45":false,"years":34,"vel":147.1,"ageAt100":42,"since100":26},{"id":"BERT_BEVERIDGE","n":"Bert Beveridge","age":64,"city":"Austin","country":"US","state":"TX","region":"tx","nw":4.9,"p":"R","c":0.95,"s":"Forbes Real-Time Billionaires profile, 21 Aug 2026","m":"Published Forbes real-time list figure","sect":"consumer","origin":"self","co":"Titos Handmade Vodka","started":1997,"startAge":35,"toFirst100":14,"did":"Welded a pot still out of turkey-fryer pots in a field east of Austin in 1997, took the first legal distilling permit in Texas, and grew Titos Handmade Vodka past 12 million cases a year while never selling a share of it.","why":"He took no outside capital and never sold, so every dollar of a category carrying 60 percent gross margin stayed with one owner. Corn-based and gluten-free let him win shelf space against imports whose only real advantage was European provenance.","comp":["Absolut","Grey Goose","Smirnoff","Ketel One","Svedka"],"obst":"He funded the first years on about 90,000 dollars drawn across 19 credit cards and slept at the distillery; distributors would not return calls until a medal forced them to, and a 2014 class action attacked the handmade wording on the label.","turn":"Winning double gold at the 2001 San Francisco World Spirits Competition against 71 other vodkas, which turned a local curiosity into a brand distributors would carry.","band":"b5","ageb":"a6","u45":false,"years":29,"vel":169,"ageAt100":49,"since100":15},{"id":"HERBERT_WERTHEIM","n":"Herbert Wertheim","age":87,"city":"Coral Gables","country":"US","region":"se","nw":4.7,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires, 21 August 2026","m":"Published real-time figure","sect":"finance","origin":"self","co":"Brain Power Inc / personal portfolio","did":"An optometrist who founded Brain Power Inc in 1969 to make ultraviolet-blocking tints and dyes for eyeglass lenses, holding more than 100 patents, then compounded the profits into a buy-and-never-sell portfolio; he is the largest individual shareholder of aerospace supplier Heico.","started":1969,"startAge":30,"toFirst100":21,"why":"He read patents and annual reports as a technologist rather than trading on price, and he almost never sold, so five decades of compounding ran without realising capital gains. Taking control-adjacent positions in small industrial firms meant he owned the compounding instead of renting it.","comp":["Essilor","Transitions Optical","Corning","Hoya"],"obst":"He was dyslexic, dropped out of high school and served in the Navy before qualifying as an optometrist; Brain Power then had to defend its lens-chemistry patents against optical manufacturers many times its size.","turn":"Buying a large stake in Heico in 1989 and backing the Mendelson familys takeover of it, a position he has held and compounded for more than thirty years.","state":"FL","band":"b5","ageb":"a7","u45":false,"years":57,"vel":82.5,"ageAt100":51,"since100":36},{"id":"MICHAEL_JORDAN","n":"Michael Jordan","age":63,"city":"Jupiter","country":"US","region":"se","nw":4.3,"p":"R","c":0.95,"s":"Forbes Real-Time Billionaires, 21 August 2026","m":"Published real-time figure","sect":"media","origin":"self","co":"Jordan Brand (Nike) / Charlotte Hornets / 23XI Racing","did":"Signed a royalty-bearing Nike deal as a 1984 rookie instead of a flat endorsement fee, generating roughly 2.4 billion dollars of pretax income from Jordan Brand; bought control of the Charlotte Hornets in 2010 for 275 million dollars and sold the majority in 2023 at a 3 billion valuation.","started":1984,"startAge":21,"toFirst100":9,"why":"His side took a percentage of shoe revenue rather than a signing cheque, so he owned an annuity on a product line instead of a contract. Nike then built an entire sub-brand around one athlete, which is why the cash flow outlived the playing career by three decades.","comp":["Converse","Adidas","Reebok","Puma"],"obst":"Nike was a distant third in basketball in 1984 and he wanted Adidas, which passed; the NBA banned the original black-and-red shoe and fined the team per game, and his 1993 retirement after his fathers murder threatened the brand at its peak.","turn":"The 1984 Nike contract negotiated by Deloris Jordan and David Falk, with a royalty on every pair sold, which converted fame into equity.","state":"FL","band":"b5","ageb":"a6","u45":false,"years":42,"vel":102.4,"ageAt100":30,"since100":33},{"id":"MAGGIE_HARDY","n":"Maggie Hardy","age":60,"city":"Belle Vernon","country":"US","state":"PA","region":"ne","nw":4.3,"p":"R","c":0.9,"s":"Forbes Real-Time Billionaires profile, 21 August 2026","m":"Published real-time figure","sect":"industry","origin":"mixed","co":"84 Lumber","did":"Took over 84 Lumber from her father Joe Hardy in 1992 at age 26 and rebuilt it around contractor supply rather than consumer walk-in, growing it to 320 stores in 34 states and over 5 billion dollars of revenue; also owns the Nemacolin st individual shareholder.","why":"They refused mass-merchant distribution for years and sold only through dealers who could explain a 300 dollar cooler, so the price held and the brand captured the guides and tournament anglers who set taste. By the time Walmart carried it the premium was established and could not be undercut.","comp":["Coleman","Igloo","RTIC","Pelican Products"],"obst":"Overseas factories copied the rotomoulded design within two years and YETI fought a long run of patent and trade-dress suits including against RTIC; a 2023 recall of about 1.9 million soft coolers and gear cases over magnet ingestion hit during a wholesale slowdown.","turn":"Taking Cortec Groups investment in 2012, which funded the inventory and advertising that moved YETI from a dealer brand to a national one.","band":"b3","ageb":"a5","u45":false,"years":20,"vel":29.5,"ageAt100":42,"since100":10},{"id":"JUDY_SHEINDLIN","n":"Judy Sheindlin","age":83,"city":"Naples","country":"US","region":"se","nw":0.58,"p":"R","c":0.85,"s":"Forbes America's Richest Self-Made Women, June 2025","m":"Published list figure","sect":"media","origin":"self","co":"Judge Judy / Judy Justice","did":"Spent 25 years in New York family court hearing more than 20,000 cases, then launched Judge Judy in 1996 at 53; it ran 25 seasons paying her about 47 million dollars a year before she moved to Judy Justice on Amazon in 2021.","started":1996,"startAge":53,"toFirst100":9,"why":"She renegotiated every few years holding the only leverage that matters in syndication, which is being the entire show. In 2017 she sold the back catalogue to CBS for roughly 100 million dollars while keeping ownership of the new programme, so library value accrued to her rather than the studio.","comp":["Judge Joe Brown","The Peoples Court","Divorce Court","Dr Phil"],"obst":"CBS shareholders sued over the 2017 library sale, alleging the studio had underpriced her back catalogue to keep her; before that she was a middle-aged family-court judge with no on-camera experience pitching a genre television executives thought was finished.","turn":"A 1993 Los Angeles Times profile that led to a 60 Minutes segment, which producers watched and turned into the Judge Judy pilot.","state":"FL","band":"b3","ageb":"a7","u45":false,"years":30,"vel":19.3,"ageAt100":62,"since100":21},{"id":"CELINE_DION","n":"Celine Dion","age":58,"city":"Las Vegas","country":"US","region":"mtn","nw":0.57,"p":"R","c":0.8,"s":"Forbes America's Richest Self-Made Women, June 2025 (fourth-richest self-made woman in US music)","m":"Published list figure","sect":"media","origin":"self","co":"Les Productions Feeling / Caesars Palace residency","did":"Signed at 12 to manager Rene Angelil, who mortgaged his house to fund her first Quebec record, learned English in her twenties, and built the modern Las Vegas residency with A New Day at Caesars Palace from 2003 to 2007 and a second run through 2019.","started":1981,"startAge":13,"toFirst100":15,"why":"Touring pays once per city and burns the performer. A fixed residency inverts that: the audience travels, the casino funds the venue against hotel and gaming revenue, and the artist plays 4,000 seats a night with no freight, no crew moves and no lost days.","comp":["Mariah Carey","Whitney Houston","Elton John","Britney Spears"],"obst":"Her manager and husband Rene Angelil died in 2016; she was diagnosed with stiff-person syndrome, disclosed in December 2022, which forced cancellation of the Courage world tour and effectively ended live performance.","turn":"The 2003 Caesars Palace deal, a purpose-built 4,100-seat theatre that grossed over 600 million dollars and rewrote how Las Vegas books music.","state":"NV","band":"b3","ageb":"a6","u45":false,"years":45,"vel":12.7,"ageAt100":28,"since100":30},{"id":"HOWARD_JONAS","n":"Howard Jonas","age":70,"city":"Newark","country":"US","state":"NJ","region":"ne","nw":0.56,"p":"E","c":0.6,"s":"SEC insider holdings across IDT Corp, Genie Energy and Rafael Holdings, August 2026","m":"2,859,846 IDT shares worth about 190 million dollars plus holdings in the spun-out Genie Energy and Rafael Holdings, roughly 561 million in aggregate","sect":"tech","origin":"self","co":"IDT Corporation","did":"Founded IDT in 1990 in Newark selling international call-back service, built it into a prepaid calling and money-transfer business, and repeatedly spun out pieces: Straight Path, sold to Verizon for 3.1 billion dollars in 2017, plus Genie Energy, Rafael Holdings and net2phone.","started":1990,"startAge":34,"toFirst100":6,"why":"Jonas arbitraged regulated international settlement rates, routing calls back through the US when foreign monopolies overcharged, then did the same trick with voice over IP. The recurring move is to buy an asset nobody values, hold it inside a public shell, and spin it out when a buyer appears.","comp":["AT and T","MCI","Vonage","Western Union","Remitly"],"obst":"IDT's core calling-card business shrank every year as mobile data killed international long distance, and foreign incumbents fought call-back routing in regulators and courts through the 1990s.","turn":"The 2013 spin-off of Straight Path Communications, whose dormant 39 GHz spectrum licences Verizon bought for 3.1 billion dollars in 2017 after a bidding war with AT and T.","band":"b3","ageb":"a7","u45":false,"years":36,"vel":15.6,"ageAt100":40,"since100":30},{"id":"LUIS_VON_AHN","n":"Luis von Ahn","age":47,"city":"Pittsburgh","country":"US","state":"PA","region":"ne","nw":0.55,"p":"E","c":0.6,"s":"Duolingo Schedule 13G/A, holdings as of 30 June 2026; DUOL at about 138 dollars, August 2026","m":"3,594,120 Class A equivalent shares, 8.2 percent of the class, about 496 million dollars, plus proceeds from the 2009 reCAPTCHA sale to Google and earlier Duolingo sales","sect":"tech","origin":"self","co":"Duolingo","did":"Carnegie Mellon professor who invented CAPTCHA and then reCAPTCHA, sold reCAPTCHA to Google in 2009, and co-founded Duolingo in Pittsburgh in 2011 with his student Severin Hacker; it went public in 2021 and passed 100 million monthly users.","started":2011,"startAge":32,"toFirst100":8,"why":"Duolingo made the free tier good enough that acquisition cost approached zero, then monetised the small share who paid to remove ads and the far larger share who paid for streaks and gamified retention. Competitors charged at the door and never built the funnel.","comp":["Babbel","Rosetta Stone","Busuu","Memrise","Google Translate"],"obst":"Duolingo made almost no revenue for its first six years and von Ahn resisted charging at all; the stock lost roughly 60 percent of its value in the year to August 2026 as investors questioned whether large language models would commoditise language learning.","turn":"The 2017-2018 introduction of Duolingo Plus and the streak mechanic, which converted a free research project used by millions into a subscription business.","band":"b3","ageb":"a5","u45":false,"years":15,"vel":36.7,"ageAt100":40,"since100":7},{"id":"PAIGE_MYCOSKIE","n":"Paige Mycoskie","age":46,"city":"Austin","country":"US","state":"TX","region":"tx","nw":0.52,"p":"R","c":0.8,"s":"Forbes profile and Americas Richest Self-Made Women, figure as of 3 Jun 2025","m":"Published Forbes list figure","sect":"retail","origin":"self","co":"Aviator Nation","started":2007,"startAge":27,"toFirst100":14,"did":"Founded Aviator Nation in 2007 while working at a Venice Beach surf shop, hand-sketching every 1970s-styled hoodie and sweatpant and manufacturing all of it in California; the brand reached about 150 million dollars of sales in 2023 across 20 stores and has never taken outside investment.","why":"She kept 100 percent of the equity and funded growth on expanding bank lines rather than venture money, and California manufacturing let her restock a hit colourway in weeks. That made scarcity a choice rather than a supply failure and held 190 dollar hoodie pricing without markdown cycles.","comp":["Alo Yoga","Free People","Sundry","Vu d replacement; later campaigns at Bristol-Myers Squibb and Papa John's stalled or ended in settlements.","turn":"The October 2014 Darden vote, the first time a public company's entire board was swept out by an activist.","band":"b3","ageb":"a5","u45":false,"years":24,"vel":20.8,"ageAt100":37,"since100":17},{"id":"VERA_WANG","n":"Vera Wang","age":77,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.5,"p":"I","c":0.5,"s":"Forbes profile, $500M as of 4 Aug 2021 (Americas Richest Self-Made Women)","m":"Last published Forbes figure, now five years old; carried forward unchanged","sect":"retail","origin":"self","co":"Vera Wang","did":"After seventeen years as a Vogue editor and two as a Ralph Lauren design director, opened a bridal salon in the Carlyle Hotel in 1990 at 40 because she could not find a wedding dress she liked; built it into a licensing house spanning Zales jewellery, Simply Vera at Kohl's, David's Bridal and fragrance.","started":1990,"startAge":41,"toFirst100":15,"why":"Bridal was a large, fragmented category with no designer name at the top and a customer who buys once and does not price-shop. A $10,000 gown at the Carlyle anchored a pyramid that sold $70 dresses at David's Bridal under the same signature - the top of the pyramid was advertising, the bottom was the business.","comp":["Monique Lhuillier","Amsale","Oscar de la Renta bridal","Pronovias","David s Bridal house labels"],"obst":"She was passed over for the editor-in-chief job at Vogue in 1987, which pushed her out of the only career she had; she then started a company at 40 with no manufacturing experience and no brand.","turn":"Designing Nancy Kerrigan's costumes for the 1994 Winter Olympics, which put the name in front of a national television audience.","band":"b3","ageb":"a7","u45":false,"years":36,"vel":13.9,"ageAt100":56,"since100":21},{"id":"JENNY_JUST","n":"Jenny Just","age":59,"city":"Chicago","country":"US","region":"mw","nw":0.48,"p":"R","c":0.85,"s":"Forbes America's Richest Self-Made Women, June 2025","m":"Published list figure","sect":"finance","origin":"self","co":"PEAK6 Investments / Apex Fintech","did":"Co-founded the options market maker PEAK6 in Chicago in 1997 with 1.5 million dollars and her husband Matt Hulsizer, then used the trading profits to buy or build about fifteen companies, the largest being Apex Fintech, the clearing engine behind SoFi, Webull and eToro.","started":1997,"startAge":30,"toFirst100":10,"why":"Market making throws off cash uncorrelated with the venture cycle, which funded acquisitions when nobody else could raise. Owning the clearing and custody plumbing under consumer brokerages meant PEAK6 collected a toll on the retail trading boom without ever having to win the retail customer.","comp":["Citadel Securities","Susquehanna","Jane Street","DriveWealth"],"obst":"She was one of very few women on the Chicago options floor in the 1990s; the 2021 SPAC merger that would have valued Apex at 4.7 billion dollars was cancelled when the blank-cheque market collapsed, stranding the exit she had built toward.","turn":"Buying Penson Financials clearing business out of its 2012 bankruptcy and rebuilding it as Apex, which turned a proprietary trading firm into market infrastructure.","state":"IL","band":"b2","ageb":"a6","u45":false,"years":29,"vel":16.6,"ageAt100":40,"since100":19},{"id":"JANICE_BRYANT_HOWROYD","n":"Janice Bryant Howroyd","age":73,"city":"Las Vegas","country":"US","region":"mtn","nw":0.45,"p":"R","c":0.85,"s":"Forbes America's Richest Self-Made Women, June 2025","m":"Published list figure","sect":"other","origin":"self","co":"ActOne Group","did":"Founded ActOne Group in 1978 in a small Beverly Hills office with 900 dollars borrowed from her mother and a rented fax machine, building it into a staffing, screening and workforce-technology firm with about 890 million dollars of revenue across 33 countries.","started":1978,"startAge":25,"toFirst100":22,"why":"Contract labour is bought by corporate endent restaurants with almost no IT budget, and Grimm had to support thousands of one-off hardware configurations in kitchens; the 2020 pandemic shutdown cut the customer base's volume to near zero overnight.","turn":"The decision to build Toast on commodity Android tablets with a local database rather than on cloud-only web software, which made the system usable in a kitchen with unreliable wifi.","band":"b2","ageb":"a4","u45":true,"years":15,"vel":30,"ageAt100":36,"since100":5},{"id":"SCOTT_BENDER","n":"Scott Bender","age":68,"city":"Houston","country":"US","state":"TX","region":"tx","nw":0.45,"p":"E","c":0.5,"s":"SEC beneficial ownership for Cactus Inc (WHD) compiled Aug 2026: Cactus WH Enterprises LLC, the Bender family vehicle, held 9,261,249 shares valued at 683 million dollars","m":"Family vehicle value split between the two principal brothers, plus proceeds disclosed in secondary offerings since the 2018 IPO","sect":"energy","origin":"self","co":"Cactus Inc","started":2011,"startAge":53,"toFirst100":7,"did":"With his brother Joel he built Cactus Wellhead in Houston from 2011, renting and servicing frac valve trees rather than selling them, listed the company on the NYSE in 2018, then bought the spoolable pipe maker FlexSteel and Baker Hughes spoolable business to become the dominant US wellhead supplier.","why":"Cactus rents its wellheads and services them with its own field crews, so it earns a day rate on installed iron rather than a one-time sale and the same tree is re-rented across dozens of wells. That converts a capital good into recurring revenue and makes the business far less cyclical than pressure pumping.","comp":["Schlumberger Cameron","TechnipFMC","Weir Group","Halliburton"],"obst":"They launched in 2011 against integrated majors who bundled wellheads free with pumping contracts and had to prove the rental model one operator at a time; the 2020 collapse cut US frac crews by three quarters and the shares fell under 12 dollars.","turn":"The February 2018 NYSE listing, which funded the FlexSteel acquisition and turned a private rental fleet into a consolidator.","band":"b2","ageb":"a7","u45":false,"years":15,"vel":30,"ageAt100":60,"since100":8},{"id":"STEVEN_MADDEN","n":"Steven Madden","age":68,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.44,"p":"E","c":0.8,"s":"WallStreetZen insider ownership table for SHOO: 9,253,888 shares, 12.65% of the company, valued $438.08M","m":"9,253,888 shares x market price on 21 Aug 2026 = $438M; he is the largest individual holder","sect":"retail","origin":"self","co":"Steven Madden Ltd","did":"Started Steve Madden Ltd in Long Island City in 1990 with $1,100, selling chunky platform shoes out of the boot of his car to Manhattan boutiques; took it public in 1993, served 31 months in federal prison from 2005 for securities fraud tied to Stratton Oakmont, and returned as creative chief.","started":1990,"startAge":32,"toFirst100":9,"why":"He compressed design-to-shelf to about six weeks by keeping sample-making in house and using near-shore production, so the company chased a trend that was already happening while Nine West and Nike were committed to forecasts made a year earlier. In fashion footwear, speed is the entire margin.","comp":["Nine West","Skechers","Aldo","Nike","Jessica Simpson footwear"],"obst":"He was convicted in 2001 of securities fraud and money laundering for his role in Stratton Oakmont's IPO manipulation, had to resign as chief executive, and ran the brand's design from a federal prison camp between 2005 and 2007.","turn":"The 1993 IPO underwritten by Stratton Oakmont, which funded the first retail stores and a decade later nearly destroyed him.","band":"b2","ageb":"a7","u45":false,"years":36,"vel":12.2,"ageAt100":41,"since100":27},{"id":"MATT_EHRLICHMAN","n":"Matt Ehrlichman","age":46,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.44,"p":"E","c":0.75,"s":"Porch Group DEF 14A of 17 Apr 2026: 25,519,591 shares, 24.11 percent; PRCH closed 17.09 dollars on 21 August 2026","m":"Disclosed beneficial share count times market price","sect":"tech","origin":"self","co":"Porch Group","did":"Sold his first company Thriva to Active Network at 24, became its chief strategy officer through a 2011 IPO, then founded Porch in Seattle that year as a home-services marketplace; took it public by SPAC in 2020 and rebuilt it around homeowners insurance and software sold to inspectors, moving companies and title firms.","started":2011,"startAge":31,"toFirst100":10,"why":"Porch stopped competing for home-improvement leads and instead sold software to the companies that learn a house is changing hands first, inspectors and movers, then used that data to underwrite homeowners insurance. Owning the moment before the sale converts a lead-gen business into a premium stream.","comp":["Angi","Thumbtack","HomeAdvisor","Lemonade","Hippo"],"obst":"The insurance business was hit by Texas and Gulf storm losses that pushed Porch to heavy losses in 2022 and 2023, the shares fell more than 90 percent from their SPAC peak, and the company had to restructure its carrier into a reciprocal exchange in 2025 to survive.","turn":"The 2025 conversion of Homeowners of America into a reciprocal exchange, which moved underwriting risk off Porch's balance sheet and re-rated the stock.","band":"b2","ageb":"a5","u45":false,"years":15,"vel":29.3,"ageAt100":41,"since100":5},{"id":"JONATHAN_LEVIN","n":"Jonathan Levin","age":38,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.43,"p":"E","c":0.35,"s":"Chainalysis last valued at about $8.6B after raising $538M across nine rounds; Levin is co-founder and, since Dec 2024, chief executive","m":"A founding chief executive's residual stake after nine rounds is typically about 5% of equity; 5% x $8.6B = roughly $0.43B","sect":"crypto","origin":"self","co":"Chainalysis","did":"Co-founded Chainalysis in New York in 2014 after running the bitcoin analytics project Coinometrics as an Oxford economics researcher; the company traces blockchain flows for the FBI, IRS, DEA and Europol as well as exchanges and banks, and he became chief executive in December 2024.","started":2014,"startAge":26,"toFirst100":6,"why":"Bitcoin's ledger is permanent and public, so clustering heuristics can attach real names to pseudonymous addresses - and every subpoena, exchange integration and seizure adds labels to the graph. The dataset compounds and cannot be replicated by a later entrant with better software.","comp":["Elliptic","TRM Labs","CipherTrace","Crystal Blockchain"],"obst":"The company was born out of the 2014 Mt. Gox collapse into a crypto community that saw transaction tracing as a betrayal of the technology's purpose, and had to sell surveillance software to governments while its customers were the exchanges being watched.","turn":"Tracing the coins stolen from Mt. Gox, which won the first US federal law-enforcement contracts.","band":"b2","ageb":"a3","u45":true,"years":12,"vel":35.8,"ageAt100":32,"since100":6},{"id":"ADI_TATARKO","n":"Adi Tatarko","age":55,"city":"Palo Alto","country":"US","region":"bay","nw":0.42,"p":"R","c":0.75,"s":"Forbes America's Self-Made Women, May 2024","m":"Published list figure; she and husband Alon Cohen together own about a quarter of Houzz","sect":"tech","origin":"self","co":"Houzz","did":"Co-founded Houzz in her Palo Alto living room in 2009 with her husband Alon Cohen after failing to find ideas for their own remodel, building a photo-driven marketplace linking homeowners to contractors, architects and products.","started":2009,"startAge":38,"toFirst100":5,"why":"Renovation is a high-ticket, once-a-decade purchase that search engines serve badly because buyers do not know the vocabulary. A tagged photo library let people point at a finished room instead of typing, which converted browsing into qualified leads professionals would pay a subscription to receive.","comp":["Pinterest","Angi","Porch","Thumbtack"],"obst" ion dollars; he then bought into the Texas Rangers and founded TXO Partners, which listed in 2023.","why":"XTO bought proved developed reserves at a discount to their PV-10 during gas price troughs and hedged the production forward, so the arithmetic worked without exploration risk. When shale gas made Exxon want US onshore scale quickly, buying XTO was faster than drilling it.","comp":["Chesapeake Energy","Devon Energy","Burlington Resources","EOG Resources"],"obst":"The 1998 gas price collapse took XTO shares to about 3 dollars and left the company close to breaching its covenants; he and the management team bought stock personally to hold it together.","turn":"ExxonMobils December 2009 agreement to buy XTO for about 41 billion dollars in stock, the largest US onshore deal of the shale era.","band":"b2","ageb":"a7","u45":false,"years":40,"vel":8.8,"ageAt100":48,"since100":30},{"id":"DHARMESH_SHAH","n":"Dharmesh Shah","age":58,"city":"Cambridge","country":"US","state":"MA","region":"ne","nw":0.33,"p":"E","c":0.7,"s":"SEC insider holdings for HubSpot Inc, 1,322,400 HUBS shares as of 30 July 2026","m":"1,322,400 shares at the July 2026 price, about 332 million dollars","sect":"tech","origin":"self","co":"HubSpot","did":"Co-founded HubSpot in Cambridge in 2006 with Brian Halligan while both were at MIT Sloan, coined and productised inbound marketing, and has been chief technology officer since; he wrote the first version of the product himself after selling an earlier company, Pyramid Digital Solutions.","started":2006,"startAge":38,"toFirst100":9,"why":"HubSpot sold the methodology before the software. The free blog, the certification courses and the grader tools created an audience of marketers who had been taught inbound as a discipline and then needed a tool that did it, which meant HubSpot's own marketing was its distribution channel.","comp":["Salesforce","Marketo","Adobe","Mailchimp","Klaviyo"],"obst":"HubSpot's freemium CRM had to be given away against Salesforce's entrenched enterprise position, and the stock fell by more than half in 2025-2026 as investors questioned whether AI agents would collapse seat-based software pricing.","turn":"The 2014 launch of the free HubSpot CRM, which was widely called suicidal and instead became the funnel that pulled small businesses into the paid marketing and sales hubs.","band":"b2","ageb":"a6","u45":false,"years":20,"vel":16.5,"ageAt100":47,"since100":11},{"id":"STRAUSS_ZELNICK","n":"Strauss Zelnick","age":69,"city":"New York","country":"US","state":"NY","region":"nyc","nw":0.33,"p":"E","c":0.7,"s":"Take-Two 2026 proxy statement filed 15 Jul 2026: Zelnick beneficially owns 1,382,568 shares; TTWO closed $239.62 on 21 Aug 2026","m":"1,382,568 shares x $239.62 = $331.3M, including 1,126,165 restricted units held through ZMC Advisors","sect":"media","origin":"self","co":"Take-Two Interactive and ZMC","did":"Ran 20th Century Fox's television arm and then BMG Entertainment, founded ZelnickMedia in 2001, and in 2007 his firm took control of Take-Two Interactive in a shareholder revolt after an options-backdating scandal; he has been chairman and chief executive ever since, through Grand Theft Auto V and NBA 2K.","started":2001,"startAge":44,"toFirst100":9,"why":"ZMC's management agreement paid in Take-Two equity, so he was compensated like an owner of a company he never bought. He then protected Rockstar's schedule - letting Grand Theft Auto titles slip years rather than shipping annually - which kept each release an event instead of a product line.","comp":["Electronic Arts","Activision Blizzard","Ubisoft","Epic Games","Microsoft Game Studios"],"obst":"He inherited Take-Two mid-scandal with the SEC investigating backdated options and the founder indicted, then rejected a hostile $2B bid from Electronic Arts in 2008 with the stock falling; Grand Theft Auto VI slipped repeatedly and the shares fell hard in 2025.","turn":"The March 2007 shareholder meeting that removed the incumbent board and installed ZelnickMedia as management.","band":"b2","ageb":"a7","u45":false,"years":25,"vel":13.2,"ageAt100":53,"since100":16},{"id":"JEFF_WILKE","n":"Jeff Wilke","age":59,"city":"Seattle","country":"US","state":"WA","region":"pnw","nw":0.33,"p":"E","c":0.5,"s":"Last SEC-disclosed Amazon holding of 765,086 shares; AMZN closed 258.63 dollars on 21 August 2026; SEC filings show over 148M dollars of Amazon share sales during his tenure","m":"Disclosed holding times market price equals 198M, plus disclosed lifetime Form 4 sale proceeds","sect":"logistics","origin":"self","co":"Amazon / Re:Build Manufacturing","did":"Left AlliedSignal for Amazon in 1999 to run operations, replaced the distribution-centre model with software-driven fulfilment centres, built the Amazon Marketplace and Prime supply chain, and ran the entire retail business as chief executive of Worldwide Consumer from 2016 until he left in 2021; now chairs Re:Build Manufacturing.","started":1999,"startAge":32,"toFirst100":11,"why":"Amazon's retail advantage was never price, it was the promise date. Wilke rebuilt fulfilment around six-sigma process control borrowed from chemical manufacturing so that delivery time became a controllable variable, which made Prime a credible subscription and made third-party sellers dependent on Amazon logistics.","comp":["Walmart","Target","eBay","Alibaba","FedEx"],"obst":"He arrived after the 1999 holiday season nearly broke Amazon's distribution network and had to rebuild it while the company was burning cash into the dot-com collapse; he later ran the retail business through warehouse-safety investigations, union drives and the 2020 pandemic demand shock.","turn":"The 2005 launch of Prime, which required his fulfilment network to guarantee two-day delivery before the network could actually do it reliably.","band":"b2","ageb":"a6","u45":false,"years":27,"vel":12.2,"ageAt100":43,"since100":16},{"id":"ZACH_WEINBERG","n":"Zach Weinberg","age":40,"city":"New York","country":" ":"self","co":"Martha Stewart Living Omnimedia","did":"A former stockbroker who started a Westport catering business in 1976, published Entertaining in 1982, launched Martha Stewart Living in 1990, took the company public in 1999, served five months in federal prison in 2004 over an ImClone stock sale, and sold the company to Sequential Brands for $353M in 2015.","started":1976,"startAge":35,"toFirst100":21,"why":"She was the first person to license one lifestyle name across a magazine, a television show and a mass retailer simultaneously. Buying her name and archive back from Time Warner in 1997 meant every Kmart towel and every advertising page paid the same owner - the brand, not the content, was the asset.","comp":["Rachael Ray","Ina Garten","Oprah Winfrey","Meredith and Better Homes and Gardens","Real Simple"],"obst":"Her 2004 conviction for obstruction and false statements over the ImClone sale cost her five months in prison, sent the stock down about 80%, drove advertisers away and barred her from serving as a director of her own public company until 2011.","turn":"The 1997 buyback of her name and archive from Time Warner, which created Martha Stewart Living Omnimedia.","band":"b2","ageb":"a7","u45":false,"years":50,"vel":6,"ageAt100":56,"since100":29},{"id":"ABEL_TESFAYE","n":"Abel Tesfaye","age":36,"city":"Los Angeles","country":"US","state":"CA","region":"socal","nw":0.3,"p":"R","c":0.8,"s":"Forbes profile figure of 298 million dollars, dated 30 December 2025","m":"Forbes published figure; ahead of the disclosed roughly 1 billion dollar convertible-debt deal with Lyric Capital over his catalogue","sect":"media","origin":"self","co":"XO / The Weeknd catalogue","did":"Uploaded anonymous mixtapes as The Weeknd in 2010, kept ownership through his XO imprint rather than signing a standard label deal, and in late 2025 structured an approximately 1 billion dollar convertible-debt transaction with Lyric Capital against his catalogue while retiring the stage name.","started":2010,"startAge":20,"toFirst100":5,"why":"He built demand anonymously before any label was involved, so he signed from a position where he could keep masters and imprint control. Financing the catalogue with convertible debt instead of selling it kept the upside while extracting the cash a sale would have paid.","comp":["Drake","Frank Ocean","Post Malone","Bruno Mars"],"obst":"He was homeless in Toronto at 17 and released the first mixtapes with no name attached and no industry contacts; he later boycotted the Grammys entirely in 2021 after After Hours was shut out of nominations.","turn":"The 2015 crossover of Cant Feel My Face and The Hills, which moved him from an alternative-R and B cult act to a mainstream pop asset with catalogue value.","band":"b2","ageb":"a3","u45":true,"years":16,"vel":18.8,"ageAt100":25,"since100":11},{"id":"JASON_ROBINS","n":"Jason Robins","age":45,"city":"Boston","country":"US","state":"MA","region":"ne","nw":0.28,"p":"E","c":0.65,"s":"DraftKings Inc DEF 14A filed 26 March 2026, beneficial ownership as of the record date","m":"11,472,868 Class A shares, 2.1 percent of the class, at about 24.60 dollars per share; his 393 million Class B shares carry votes but not economics","sect":"consumer","origin":"self","co":"DraftKings","did":"Co-founded DraftKings in Boston in 2012 with Matt Kalish and Paul Liberman out of a Vistaprint cubicle, built daily fantasy sports into a mass product, took the company public via SPAC in 2020 and turned it into the second-largest US sportsbook after the Supreme Court struck down the federal betting ban.","started":2012,"startAge":31,"toFirst100":5,"why":"Daily fantasy was legal under a 2006 carve-out for games of skill, so DraftKings spent six years acquiring a database of millions of verified, funded, sports-betting-inclined accounts while sportsbooks were illegal. When Murphy legalised betting in 2018, it converted that file rather than starting from zero.","comp":["FanDuel","BetMGM","Caesars","ESP c holdings, roughly 246 million dollars in aggregate, net of decades of Form 4 sales and large charitable gifts","sect":"health","origin":"self","co":"Vertex Pharmaceuticals","did":"Left Merck in 1989 to found Vertex in Cambridge on structure-based rational drug design, ran it as CEO until 2009, and stayed on the board until 2017; the company he started now dominates cystic fibrosis therapy with Trikafta and is worth well over 100 billion dollars.","started":1989,"startAge":38,"toFirst100":12,"why":"Vertex designed molecules against a solved protein structure rather than screening compound libraries, letting it attack targets big pharma had ruled undruggable. Cystic fibrosis, a small population with a single known genetic cause, gave it a defined patient set and orphan pricing that funded everything after.","comp":["Merck","Gilead Sciences","Abbott","Boehringer Ingelheim"],"obst":"Vertex went nearly two decades without a self-discovered approved drug and burned through repeated financing rounds; its HIV protease programme was beaten to market and its hepatitis C drug Incivek, briefly a blockbuster, was obsoleted within two years by Gilead's Sovaldi.","turn":"The 2012 approval of Kalydeco, the first drug to treat the underlying cause of cystic fibrosis rather than its symptoms, which validated twenty years of rational design.","band":"b2","ageb":"a7","u45":false,"years":37,"vel":7,"ageAt100":50,"since100":25},{"id":"JULIA_CHEEK","n":"Julia Cheek","age":45,"city":"Austin","country":"US","state":"TX","region":"tx","nw":0.26,"p":"I","c":0.45,"s":"Forbes profile figure last updated 1 Jun 2023, when Forbes valued Everly Health at about 1.8 billion dollars","m":"Dated Forbes estimate of her founder stake, not revalued for the later fall in digital-health valuations","sect":"health","origin":"self","co":"Everly Health","started":2015,"startAge":34,"toFirst100":6,"did":"Founded EverlyWell in Austin in 2015 after paying thousands out of pocket for lab tests, pitched it on Shark Tank in 2017 and took Lori Greiners investment, then built Everly Health into a seller of about 30 at-home test kits through CVS and Rite Aid at a 3.6 billion dollar 2022 valuation.","why":"Clinical labs bill insurers and will not sell direct, so a consumer who wants a test needs a physician order. Everly bought lab capacity wholesale, wrapped it in a telehealth physician network that could issue the order, and sold the kit at retail, capturing the spread between wholesale lab pricing and cash-pay retail.","comp":["LetsGetChecked","23andMe","Quest Diagnostics","LabCorp OnDemand"],"obst":"The FDA had shut down 23andMe health reports in 2013, so she had to build the physician-order structure to stay inside the rules, and after the pandemic testing boom ended the company cut staff and its 3.6 billion dollar 2022 mark was not supported by later rounds.","turn":"The 2020 pivot to at-home COVID collection kits, which took a niche wellness brand into CVS and Rite Aid distribution it kept afterwards.","band":"b2","ageb":"a5","u45":false,"years":11,"vel":23.6,"ageAt100":40,"since100":5},{"id":"RJ_SCARINGE","n":"RJ Scaringe","age":43,"city":"Laguna Beach","country":"US","state":"CA","region":"socal","nw":0.25,"p":"E","c":0.85,"s":"Rivian DEF 14A filed 27 Apr 2026: 10,798,921 Class A and 3,912,500 Class B shares beneficially owned as of 23 Apr 2026; RIVN closed 16.97 dollars on 21 Aug 2026","m":"Combined Class A and Class B beneficial ownership times market close, 14,711,421 x 16.97 = 250 million dollars","sect":"industry","origin":"self","co":"Rivian Automotive","did":"Founded Rivian in 2009 straight out of an MIT doctorate, spent a decade in stealth before revealing the R1T pickup and R1S SUV in 2018, took Amazon and Ford money, listed on Nasdaq in 2021, and moved the company headquarters to Irvine.","started":2009,"startAge":26,"toFirst100":12,"why":"Tesla had taken sedans, so he built the two body styles American buyers actually pay premiums for and pre-sold a 100,000-van fleet order to Amazon. That commercial contract underwrote the factory and gave the consumer trucks a manufacturing base they could not have funded alone.","comp":["Tesla","Ford","Lucid Motors","GM"],"obst":"Rivian burned roughly 1.5 billion dollars a quarter through 2022, saw its share price fall more than 80 percent from the IPO, cut staff repeatedly, and had to renegotiate the Amazon exclusivity before its R2 platform reached production.","turn":"The 2019 Amazon order for 100,000 electric delivery vans, which converted a decade-old stealth company into a funded manufacturer.","band":"b2","ageb":"a4","u45":true,"years":17,"vel":14.7,"ageAt100":38,"since100":5},{"id":"BELINDA_JOHNSON","n":"Belinda Johnson","age":62,"city":"Austin","country":"US","state":"TX","region":"tx","nw":0.25,"p":"I","c":0.5,"s":"Forbes profile figure last updated 1 Jun 2023, based on her Airbnb holdings","m":"Dated Forbes estimate from Airbnb equity, not revalued","sect":"tech","origin":"self","co":"Airbnb","started":2011,"startAge":47,"toFirst100":9,"did":"Was general counsel of Mark Cubans Broadcast.com through the 1999 Yahoo sale and stayed at Yahoo for twelve years, then joined Airbnb in 2011 as its first general counsel and first executive hire, became chief operating officer in 2018 and left the board in 2023.","why":"Airbnbs binding constraint was municipal law, not product, because any city could ban short-term rentals outright. She ran the litigation and settlements, including suing San Francisco and New York, converting regulatory risk into per-city rules the company could operate under and competitors then had to match.","comp":["VRBO","HomeAway","Booking.com","Expedia"],"obst":"She had to defend a business that was illegal across much of its largest market and lost New York outright, while the equity she was paid in stayed illiquid through a decade of private rounds and a pandemic that cut bookings by roughly 80 percent in 2020.","turn":"Airbnbs December 2020 IPO, which finall const ROWS = DB.rows, ASOF = DB.asof, ASOF_YEAR = +ASOF.slice(0,4);
const BANDS = [{"id":"b1","lo":0.1,"hi":0.25,"n":"$100M - $250M"},{"id":"b2","lo":0.25,"hi":0.5,"n":"$250M - $500M"},{"id":"b3","lo":0.5,"hi":1,"n":"$500M - $1B"},{"id":"b4","lo":1,"hi":2.5,"n":"$1B - $2.5B"},{"id":"b5","lo":2.5,"hi":5,"n":"$2.5B - $5B"}], REGIONS = {"bay":"SF Bay Area","socal":"Southern California","pnw":"Pacific Northwest","mtn":"Mountain West & Plains","tx":"Texas","mw":"Midwest","se":"Southeast","ne":"Northeast (ex-NYC)","nyc":"New York metro","dc":"DC, Maryland & Virginia"}, SECTORS = {"tech":"Technology","finance":"Finance","industry":"Industry & manufacturing","consumer":"Consumer goods","realestate":"Real estate","energy":"Energy","health":"Health & pharma","media":"Media & entertainment","retail":"Retail","logistics":"Logistics & transport","agri":"Agriculture & food","crypto":"Crypto & digital assets","other":"Other"};
const AGEBANDS = [{"id":"a1","lo":0,"hi":30,"n":"Under 30"},{"id":"a2","lo":30,"hi":35,"n":"30-34"},{"id":"a3","lo":35,"hi":40,"n":"35-39"},{"id":"a4","lo":40,"hi":45,"n":"40-44"},{"id":"a5","lo":45,"hi":55,"n":"45-54"},{"id":"a6","lo":55,"hi":65,"n":"55-64"},{"id":"a7","lo":65,"hi":200,"n":"65+"}];
const U45C = 'var(--self)', O45C = 'var(--inherited)';
const ORIGINS = {self:'Self-made', inherited:'Inherited', mixed:'Mixed'};
const PROV = {R:'Reported', E:'Estimated', I:'Inferred'};
const OCOL = {self:'var(--self)', inherited:'var(--inherited)', mixed:'var(--mixed)'};
const U45 = ['a1','a2','a3','a4'];

const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (b)=> b>=1 ? '$'+(+b.toFixed(2))+'B' : '$'+Math.round(b*1000)+'M';
const med = (a)=>{ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };

/* ---- state ---- */
const F = {ageb:new Set(), band:new Set(), region:new Set(), sect:new Set(), origin:new Set(), p:new Set(), q:''};
let sortKey='nw', sortDir=-1, sel=null;

/* Columns declared once — they drive the header, the cell and the ordering
   together, so a header can never disagree with the ordering underneath it.
   Same rule the Scarcity board follows. */
const COLS = [
  {k:'rank',  h:'#',        w:0, cell:(r,i)=>`<div class="rk r">${i+1}</div>`, nosort:true},
  {k:'n',     h:'Name',     get:(r)=>r.n.toLowerCase(), cell:(r)=>`<div class="nm" title="${esc(r.n)} &mdash; ${esc(r.co)}">${esc(r.n)}</div>`},
  {k:'age',   h:'Age',      get:(r)=>r.age??-1, cell:(r)=>`<div class="num">${r.age??'-'}</div>`, r:true},
  {k:'city',  h:'City',     get:(r)=>r.city.toLowerCase(), cell:(r)=>`<div class="cy" title="${esc(r.city)}, ${esc(r.state)}">${esc(r.city)}</div>`},
  {k:'nw',    h:'Worth',    get:(r)=>r.nw, cell:(r)=>`<div class="nw">${money(r.nw)}</div>`, r:true},
  {k:'sect',  h:'Sector',   get:(r)=>r.sect, cell:(r)=>`<div class="cy">${esc(SECTORS[r.sect].split(' ')[0])}</div>`},
  {k:'started',h:'Began',   get:(r)=>r.started, cell:(r)=>`<div class="num">${r.started}</div>`, r:true},
  {k:'startAge',h:'At',     get:(r)=>r.startAge, cell:(r)=>`<div class="num">${r.startAge}</div>`, r:true},
  {k:'years', h:'Yrs',      get:(r)=>r.years??999, cell:(r)=>`<div class="num">${r.years??'-'}</div>`, r:true},
  {k:'toFirst100',h:'To100M',get:(r)=>r.toFirst100??999, cell:(r)=>`<div class="num">${r.toFirst100??'-'}</div>`, r:true},
  {k:'origin',h:'Origin',   get:(r)=>r.origin, cell:(r)=>`<div class="cy"><span class="od" style="background:${OCOL[r.origin]}"></span> ${ORIGINS[r.origin].split('-')[0]}</div>`},
  {k:'p',     h:'Src',      get:(r)=>({R:0,E:1,I:2})[r.p], cell:(r)=>`<div><span class="tag ${r.p}" title="${PROV[r.p]} &mdash; ${esc(r.s)}">${r.p}</span></div>`},
];

function filtered(){
  const q = F.q.trim().toLowerCase();
  return ROWS.filter((r)=>{
    if(F.ageb.size && !F.ageb.has(r.ageb)) return false;
    if(F.band.size && !F.band.has(r.band)) return false;
    if(F.region.size && !F.region.has(r.region)) return false;
    if(F.sect.size && !F.sect.has(r.sect)) return false;
    if(F.origin.size && !F.origin.has(r.origin)) return false;
    if(F.p.size && !F.p.has(r.p)) return false;
    if(q && !(r.n+' '+r.co+' '+r.city+' '+r.state+' '+r.did).toLowerCase().includes(q)) return false;
    return true;
  });
}
function sorted(rs){
  const c = COLS.find((x)=>x.k===sortKey);
  if(!c || !c.get) return rs;
  return [...rs].sort((a,b)=>{ const x=c.get(a), y=c.get(b);
    return (x<y?-1:x>y?1:0)*sortDir; });
}

/* ---- charts ---- */
const TXT='#8a98ad', MUT='#828fa6', GRID='#1c2536';
function barChart(el, items, opt){
  const {label, value, color, w=430} = opt;
  const rowH=opt.rowH||21, padL=opt.padL||104, padR=42, h=items.length*rowH+6;
  const max = Math.max(1, ...items.map(value));
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  items.forEach((d,i)=>{
    const y=i*rowH+3, bw=Math.max(2,(value(d)/max)*(w-padL-padR)), c=color?color(d):'var(--accent)';
    s+=`<text x="${padL-9}" y="${y+11}" text-anchor="end" font-size="11" fill="${TXT}">${esc(label(d))}</text>`;
    s+=`<rect x="${padL}" y="${y+3}" width="${bw}" height="11" rx="4" fill="${c}"></rect>`;
    s+=`<text x="${padL+bw+7}" y="${y+12}" font-size="11" fill="${MUT}" font-variant-numeric="tabular-nums">${value(d)}</text>`;
  });
  el.innerHTML = s+'</svg>';
}

/* Stacked bar, two series: under 45 and 45+. A 2px surface gap sits between the
   segments so the boundary reads without a stroke. */
function stackChart(el, items, opt){
  const {label, w=430} = opt, rowH=21, padL=opt.padL||132, padR=46, h=items.length*rowH+6;
  const max = Math.max(1, ...items.map((d)=>d.a+d.b));
  const span = w-padL-padR;
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  items.forEach((d,i)=>{
    const y=i*rowH+6, aw=(d.a/max)*span, bw=(d.b/max)*span;
    s+=`<text x="${padL-9}" y="${y+8}" text-anchor="end" font-size="11" fill="${TXT}">${esc(label(d))}</text>`;
    if(d.a>0) s+=`<rect x="${padL}" y="${y}" width="${Math.max(2,aw)}" height="11" rx="4" fill="${U45C}"></rect>`;
    if(d.b>0) s+=`<rect x="${padL+aw+(d.a>0?2:0)}" y="${y}" width="${Math.max(2,bw-(d.a>0?2:0))}" height="11" rx="4" fill="${O45C}"></rect>`;
    s+=`<text x="${padL+aw+bw+7}" y="${y+9}" font-size="11" fill="${MUT}" font-variant-numeric="tabular-nums">${d.a+d.b}</text>`;
  });
  el.innerHTML = s+'</svg>';
}

function scatter(el, rs){
  const w=430,h=224,padL=40,padB=34,padT=10,padR=10;
  const xs = rs.filter((r)=>r.age!=null);
  const maxX = 85, minX = 20;
  // log y: the band spans 50x, and a linear axis buries the whole sub-$1B half
  const ly=(v)=>Math.log10(v), y0=ly(0.1), y1=ly(5);
  const X=(v)=>padL+((v-minX)/(maxX-minX))*(w-padL-padR);
  const Y=(v)=>padT+(1-(ly(v)-y0)/(y1-y0))*(h-padT-padB);
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  [0.1,0.25,0.5,1,2.5,5].forEach((v)=>{
    s+=`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${w-padR}" y2="${Y(v).toFixed(1)}" stroke="${GRID}" stroke-width="1"></line>`;
    s+=`<text x="${padL-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${MUT}">${v>=1?'$'+v+'B':'$'+v*1000+'M'}</text>`;
  });
  for(let t=20;t<=maxX;t+=10){
    s+=`<text x="${X(t).toFixed(1)}" y="${h-padB+15}" text-anchor="middle" font-size="10" fill="${MUT}">${t}</text>`;
  }
  // the 45 line — the cut the census is organised around, drawn not implied
  s+=`<line x1="${X(45).toFixed(1)}" y1="${padT}" x2="${X(45).toFixed(1)}" y2="${h-padB}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"></line>`;
  s+=`<text x="${(X(45)-5).toFixed(1)}" y="${padT+9}" text-anchor="end" font-size="9.5" fill="var(--accent)">under 45</text>`;
  s+=`<text x="${(padL+(w-padR))/2}" y="${h-2}" text-anchor="middle" font-size="10" fill="${MUT}">age</text>`;
  xs.forEach((r)=>{
    s+=`<circle cx="${X(r.age).toFixed(1)}" cy="${Y(r.nw).toFixed(1)}" r="4.2" fill="${OCOL[r.origin]}" fill-opacity=".82" stroke="var(--bg)" stroke-width="2" data-id="${r.id}"></circle>`;
  });
  el.innerHTML = s+'</svg>';
}

const split = (rs,fn,k)=>({a:rs.filter((r)=>fn(r)===k&&r.u45).length, b:rs.filter((r)=>fn(r)===k&&!r.u45).length});

function drawCharts(rs){
  barChart($('#cAge'), AGEBANDS.map((b)=>({...b, c:rs.filter((r)=>r.ageb===b.id).length})),
    {label:(d)=>d.n, value:(d)=>d.c, rowH:22, padL:74,
     color:(d)=>U45.includes(d.id)?U45C:O45C});
  const nu=rs.filter((r)=>r.u45).length;
  $('#lAge').innerHTML = `<span><i style="background:${U45C}"></i>Under 45 <span style="color:var(--mut)">${nu}</span></span>`
    + `<span><i style="background:${O45C}"></i>45 and over <span style="color:var(--mut)">${rs.filter((r)=>r.u45===false).length}</span></span>`
    + (rs.length?`<span style="color:var(--mut)">${Math.round(nu/rs.length*100)}% under 45</span>`:'');
  scatter($('#cScat'), rs);
  $('#lScat').innerHTML = Object.entries(ORIGINS).map(([k,v])=>
    `<span><i style="background:${OCOL[k]}"></i>${v} <span style="color:var(--mut)">${rs.filter((r)=>r.origin===k).length}</span></span>`).join('');
  const sec = Object.entries(SECTORS).map(([k,n])=>({n, ...split(rs,(r)=>r.sect,k)}))
    .filter((d)=>d.a+d.b).sort((x,y)=>(y.a+y.b)-(x.a+x.b));
  stackChart($('#cSect'), sec, {label:(d)=>d.n});
  $('#lSect').innerHTML = `<span><i style="background:${U45C}"></i>Under 45</span><span><i style="background:${O45C}"></i>45 and over</span>`;
  const reg = Object.entries(REGIONS).map(([k,n])=>({n, ...split(rs,(r)=>r.region,k)}))
    .filter((d)=>d.a+d.b).sort((x,y)=>(y.a+y.b)-(x.a+x.b));
  stackChart($('#cRegion'), reg, {label:(d)=>d.n});
}

/* ---- table ---- */
function drawHead(){
  $('#hdRow').innerHTML = COLS.map((c)=>{
    if(c.nosort) return `<div class="r">${c.h}</div>`;
    const on = sortKey===c.k;
    return `<div class="${c.r?'r':''}"><button class="${on?'srt':''}" data-k="${c.k}">${c.h}${on?(sortDir<0?' ↓':' ↑'):''}</button></div>`;
  }).join('');
  $('#hdRow').querySelectorAll('button').forEach((b)=>b.onclick=()=>{
    const k=b.dataset.k;
    if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=(k==='n'||k==='city'||k==='sect'||k==='origin')?1:-1;}
    render();
  });
}
function drawRows(rs){
  $('#rows').innerHTML = rs.map((r,i)=>
    `<div class="grid row${sel===r.id?' on':''}" data-id="${r.id}">${COLS.map((c)=>c.cell(r,i)).join('')}</div>`).join('')
    || `<div class="empty"><b>Nothing matches those filters</b>Clear one and try again.</div>`;
  $('#rows').querySelectorAll('.row').forEach((el)=>el.onclick=()=>{ sel=el.dataset.id; render(); });
}

/* ---- dossier ---- */
function timeline(r){
  if(!r.started) return '';
  const born = r.age!=null ? ASOF_YEAR-r.age : null;
  const t0 = born ?? r.started, t1 = ASOF_YEAR, span = Math.max(1, t1-t0);
  const at = (y)=>((y-t0)/span*100);
  const c100 = r.toFirst100!=null ? r.started+r.toFirst100 : null;
  let s = `<div class="tl"><div class="ax"></div>`;
  s += `<div class="fill" style="left:${at(r.started).toFixed(1)}%;right:0"></div>`;
  if(born){ s+=`<div class="pt" style="left:${at(born).toFixed(1)}%;background:var(--mut)"></div><div class="lb t" style="left:${at(born).toFixed(1)}%">born ${born}</div>`; }
  s += `<div class="pt" style="left:${at(r.started).toFixed(1)}%;background:var(--accent)"></div><div class="lb b" style="left:${at(r.started).toFixed(1)}%">started ${r.started}, age ${r.startAge}</div>`;
  if(c100) s+=`<div class="pt" style="left:${at(c100).toFixed(1)}%;background:var(--estimated)"></div><div class="lb t" style="left:${at(c100).toFixed(1)}%">$100M ${c100}</div>`;
  s += `<div class="pt" style="left:100%;background:var(--reported)"></div><div class="lb b" style="left:98%">${money(r.nw)}</div>`;
  return s+'</div>';
}
function drawDossier(){
  const r = ROWS.find((x)=>x.id===sel);
  if(!r){ $('#dossier').innerHTML = `<div class="empty"><b>Select a person</b>Every row opens a dossier: what they built, how long it took, why it worked, who they beat, and what nearly stopped them.</div>`; return; }
  const sec = (h,b)=>b?`<div class="ds"><h5>${h}</h5>${b}</div>`:'';
  $('#dossier').innerHTML =
    `<div class="dh">
       <h2>${esc(r.n)}</h2>
       <div class="meta">${r.age!=null?'Age '+r.age+' &middot; ':''}${esc(r.city)}, ${esc(r.state)} &middot; ${esc(SECTORS[r.sect])}<br>${esc(r.co)} &middot; ${ORIGINS[r.origin]}</div>
       <div class="big"><b>${money(r.nw)}</b><span><span class="tag ${r.p}">${r.p}</span> ${PROV[r.p]} &middot; as of ${ASOF}</span></div>
       ${timeline(r)}
     </div>
     <div class="kpi">
       <div><div class="k">Years to today</div><div class="v">${r.years??'-'}</div></div>
       <div><div class="k">To first $100M</div><div class="v">${r.toFirst100??'-'} <small>yrs</small></div></div>
       <div><div class="k">Rate</div><div class="v">${r.vel!=null?'$'+r.vel+'M':'-'}<small>/yr</small></div></div>
     </div>
     ${sec('What they did', `<p>${esc(r.did)}</p>`)}
     ${sec('Why it worked', `<p>${esc(r.why)}</p>`)}
     ${sec('The turning point', `<p>${esc(r.turn)}</p>`)}
     ${sec('What they overcame', `<p>${esc(r.obst)}</p>`)}
     ${sec('Who they were up against', `<div class="rival">${(r.comp||[]).map((c)=>`<span>${esc(c)}</span>`).join('')}</div>`)}
     ${sec('Provenance', `<table class="pv">
        <tr><td>Tier</td><td><span class="tag ${r.p}">${r.p}</span> ${PROV[r.p]}, confidence ${r.c}</td></tr>
        <tr><td>Method</td><td>${esc(r.m)}</td></tr>
        <tr><td>Source</td><td>${esc(r.s)}</td></tr>
        <tr><td>Began</td><td>${r.started}, at age ${r.startAge}</td></tr>
        ${r.ageAt100!=null?`<tr><td>Hit $100M</td><td>at age ${r.ageAt100}, then compounded ${r.since100} more years</td></tr>`:''}
      </table>`)}`;
}

/* ---- filters ---- */
function drawFilters(){
  const grp = (el, set, items) => {
    $(el).innerHTML = items.map((it)=>
      `<button class="chip${set.has(it.k)?' on':''}" data-k="${it.k}"><span>${esc(it.n)}</span><span class="ct">${it.c}</span></button>`).join('');
    $(el).querySelectorAll('.chip').forEach((b)=>b.onclick=()=>{
      const k=b.dataset.k; set.has(k)?set.delete(k):set.add(k); render(); });
  };
  const cnt = (fn,k)=>ROWS.filter((r)=>fn(r)===k).length;
  grp('#fAge', F.ageb, AGEBANDS.map((b)=>({k:b.id, n:b.n, c:cnt((r)=>r.ageb,b.id)})));
  grp('#fBand', F.band, BANDS.map((b)=>({k:b.id, n:b.n, c:cnt((r)=>r.band,b.id)})));
  grp('#fRegion', F.region, Object.entries(REGIONS).map(([k,n])=>({k,n,c:cnt((r)=>r.region,k)})).sort((a,b)=>b.c-a.c));
  grp('#fSect', F.sect, Object.entries(SECTORS).map(([k,n])=>({k,n,c:cnt((r)=>r.sect,k)})).filter((x)=>x.c).sort((a,b)=>b.c-a.c));
  grp('#fOrigin', F.origin, Object.entries(ORIGINS).map(([k,n])=>({k,n,c:cnt((r)=>r.origin,k)})));
  grp('#fProv', F.p, Object.entries(PROV).map(([k,n])=>({k,n,c:cnt((r)=>r.p,k)})));
}

function render(){
  const rs = sorted(filtered());
  drawFilters(); drawHead(); drawCharts(rs); drawRows(rs); drawDossier();
  $('#tCount').textContent = rs.length;
  $('#tMed').textContent = rs.length ? money(med(rs.map((r)=>r.nw))) : '-';
  const ys = rs.map((r)=>r.years).filter((v)=>v!=null);
  $('#tYrs').textContent = ys.length ? med(ys)+' yrs' : '-';
  const as = rs.map((r)=>r.startAge).filter((v)=>v!=null);
  $('#tAge').textContent = as.length ? med(as) : '-';
  const nu = rs.filter((r)=>r.u45).length;
  $('#tU45').textContent = rs.length ? `${nu} (${Math.round(nu/rs.length*100)}%)` : '-';
}

$('#q').oninput = (e)=>{ F.q=e.target.value; render(); };
$('#reset').onclick = ()=>{ [F.ageb,F.band,F.region,F.sect,F.origin,F.p].forEach((s)=>s.clear()); F.q=''; $('#q').value=''; render(); };
$('#only45').onclick = ()=>{ const on=U45.every((k)=>F.ageb.has(k)) && F.ageb.size===4;
  F.ageb.clear(); if(!on) U45.forEach((k)=>F.ageb.add(k)); render(); };
$('#hU45').textContent = ROWS.filter((r)=>r.u45).length;
$('#hAsof').textContent = ASOF;
$('#hCount').textContent = ROWS.length;
$('#hStates').textContent = new Set(ROWS.map((r)=>r.state)).size;
$('#hTotal').textContent = '$'+Math.round(ROWS.reduce((a,r)=>a+r.nw,0))+'B';
$('#note').innerHTML = `<b>What this is, and what it is not.</b> There is no complete list of America&rsquo;s $100M&ndash;$5B fortunes, and there cannot be: on the standard estimates something like 12,000&ndash;15,000 US households hold more than $100M, no public source enumerates them, and privately-held wealth is by construction undocumented. This is a deliberately spread census of ${ROWS.length} people &mdash; sampled across every band, region and sector so the <em>shape</em> of the population is legible &mdash; not a ranking and not a complete roster. Every figure carries a provenance tag: <span class="tag R">R</span> published by Forbes or a comparable named list, <span class="tag E">E</span> modelled from an SEC-disclosed stake times a fetched price, <span class="tag I">I</span> third-party or dated estimate. Treat E and I as directional. <b>Two known artifacts.</b> The published sub-$1B cohort skews female, because Forbes&rsquo; Self-Made Women list is nearly the only publisher that verifies figures below $1B &mdash; that skew measures publishing, not wealth. And private industrial and family fortunes are systematically under-represented against listed-equity ones, because they surface only when a company sells. Figures move daily with share prices; this snapshot is ${ASOF}.`;

/* hover tooltips on the scatter */
const tip=$('#tip');
$('#cScat').addEventListener('mousemove',(e)=>{
  const t=e.target;
  if(t.tagName==='circle'){ const r=ROWS.find((x)=>x.id===t.dataset.id);
    tip.innerHTML=`<b>${esc(r.n)}</b><br><span>${money(r.nw)} &middot; ${r.years} yrs &middot; ${ORIGINS[r.origin]}</span><br><span>${esc(r.co)}</span>`;
    tip.style.opacity=1; tip.style.left=Math.min(innerWidth-244,e.clientX+13)+'px'; tip.style.top=(e.clientY+13)+'px';
  } else tip.style.opacity=0;
});
$('#cScat').addEventListener('mouseleave',()=>tip.style.opacity=0);
$('#cScat').addEventListener('click',(e)=>{ if(e.target.tagName==='circle'){ sel=e.target.dataset.id; render();
  const el=document.querySelector(`.row[data-id="${sel}"]`); if(el) el.scrollIntoView({block:'center'}); }});

render();
</script>
</body>
</html>
